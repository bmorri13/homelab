name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      max_changes:
        description: 'Max resources the plan may update, replace or delete (raise only after reading the plan)'
        required: false
        default: 1
        type: number

# Never run two applies against the same state at once, and never cancel one midway.
concurrency:
  group: terraform-proxmox
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.17.2"
  WORKING_DIR: "infrastructure_tooling/proxmox/terraform"

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: [self-hosted, Linux, X64]
    environment: prod
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper echoes extra lines to stdout, which breaks `terraform show -json`
          terraform_wrapper: false

      - name: Create Terraform Variables File
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          cat > terraform.tfvars << EOF
          # Proxmox API connection details
          proxmox_api_url          = "${{ secrets.PROXMOX_URL }}"
          proxmox_api_token_id     = "${{ secrets.PROXMOX_USERNAME }}"
          proxmox_api_token_secret = "${{ secrets.PROXMOX_TOKEN }}"

          # Proxmox node settings (default node for all VMs)
          target_node = "${{ secrets.PROXMOX_NODE || 'proxmox' }}"

          # Per-VM node overrides (optional - uses target_node if not set)
          EOF

          # Add per-VM node overrides if secrets are set
          if [ -n "${{ secrets.TARGET_NODE_SPLUNK }}" ]; then
            echo 'target_node_splunk = "${{ secrets.TARGET_NODE_SPLUNK }}"' >> terraform.tfvars
          fi
          if [ -n "${{ secrets.TARGET_NODE_GITHUB_RUNNER }}" ]; then
            echo 'target_node_github_runner = "${{ secrets.TARGET_NODE_GITHUB_RUNNER }}"' >> terraform.tfvars
          fi
          if [ -n "${{ secrets.TARGET_NODE_DOCKER_COMPOSE_02 }}" ]; then
            echo 'target_node_docker_compose_02 = "${{ secrets.TARGET_NODE_DOCKER_COMPOSE_02 }}"' >> terraform.tfvars
          fi

          cat >> terraform.tfvars << EOF

          # Storage settings
          disk_storage = "local-lvm"

          # Network settings
          network_bridge = "vmbr0"
          dns_servers    = ["8.8.8.8", "8.8.4.4"]
          dns_domain     = "home"

          # VM password
          vm_password = "${{ secrets.SSH_PASSWORD }}"
          EOF

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -lockfile=readonly
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -out=tfplan
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}

      # Fail closed before a wide apply: one apply that touched every VM shut them all
      # down, including this runner's own VM. Reads the same tfplan that is applied below.
      - name: Guard Plan Size
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          plan_json="$(terraform show -json tfplan)"
          printf '%s' "$plan_json" | node -e '
            const max = (process.env.MAX_CHANGES || "").trim() === "" ? NaN : Number(process.env.MAX_CHANGES);
            if (!Number.isInteger(max) || max < 0) {
              console.error(`max_changes must be a non-negative integer, got "${process.env.MAX_CHANGES}"`);
              process.exit(1);
            }
            const plan = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const risky = (plan.resource_changes || []).filter(rc =>
              rc.change.actions.some(a => a === "update" || a === "delete"));
            const lines = risky.map(rc => `- \`${rc.address}\`: ${rc.change.actions.join(", ")}`);
            const summary = [`## Plan guard: ${risky.length} update/replace/delete (max ${max})`, ...lines].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
            console.log(summary);
            if (risky.length > max) {
              console.error(`Refusing to apply: ${risky.length} resources would be updated, replaced or deleted (max_changes=${max}). Read the plan, then re-run with a higher max_changes if intended.`);
              process.exit(1);
            }
          '
        env:
          MAX_CHANGES: ${{ inputs.max_changes }}
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply tfplan
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}

      - name: Cleanup Temporary Files
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: rm -f terraform.tfvars tfplan

      - name: Apply Summary
        if: success()
        run: |
          echo "## Terraform Apply Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure has been successfully deployed to Proxmox!" >> $GITHUB_STEP_SUMMARY