name: Terraform Validate and Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure_tooling/proxmox/terraform/**'
  push:
    branches:
      - main
    paths:
      - 'infrastructure_tooling/proxmox/terraform/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.17.2"
  WORKING_DIR: "infrastructure_tooling/proxmox/terraform"

jobs:
  # No environment and no secrets, so it runs on pull requests too: the prod
  # environment only allows deployments from its allowed branches and rejects a
  # PR merge ref before any step runs.
  terraform-validate:
    name: Terraform Validate
    runs-on: [self-hosted, Linux, X64]
    # Public repo: never run a pull request from a fork on the self-hosted runners
    # (fork PRs get no secrets, but would still run their code inside the homelab).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      # -lockfile=readonly: fail if .terraform.lock.hcl is out of date instead of
      # re-resolving the provider (see Provider lock file in infrastructure_tooling/proxmox/README.md).
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false -lockfile=readonly

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

  # Needs the prod secrets and the real state, so pushes to main and manual
  # runs only.
  terraform-plan:
    name: Terraform Plan
    runs-on: [self-hosted, Linux, X64]
    needs: terraform-validate
    if: github.event_name != 'pull_request'
    environment: prod
    # Same group as terraform-apply.yml: the plan takes the state lock, so never
    # run it alongside an apply.
    concurrency:
      group: terraform-proxmox
      cancel-in-progress: false
    outputs:
      changes: ${{ steps.count.outputs.changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper echoes extra lines to stdout, which breaks `terraform show -json`
          terraform_wrapper: false

      - name: Create Terraform Variables File
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          cat > terraform.tfvars << EOF
          # Proxmox API connection details
          proxmox_api_url          = "${{ secrets.PROXMOX_URL }}"
          proxmox_api_token_id     = "${{ secrets.PROXMOX_USERNAME }}"
          proxmox_api_token_secret = "${{ secrets.PROXMOX_TOKEN }}"

          # Proxmox node settings (default node for all VMs)
          target_node = "${{ secrets.PROXMOX_NODE || 'proxmox' }}"

          # Per-VM node overrides (optional - uses target_node if not set)
          EOF

          # Add per-VM node overrides if secrets are set
          if [ -n "${{ secrets.TARGET_NODE_SPLUNK }}" ]; then
            echo 'target_node_splunk = "${{ secrets.TARGET_NODE_SPLUNK }}"' >> terraform.tfvars
          fi
          if [ -n "${{ secrets.TARGET_NODE_GITHUB_RUNNER }}" ]; then
            echo 'target_node_github_runner = "${{ secrets.TARGET_NODE_GITHUB_RUNNER }}"' >> terraform.tfvars
          fi
          if [ -n "${{ secrets.TARGET_NODE_DOCKER_COMPOSE_02 }}" ]; then
            echo 'target_node_docker_compose_02 = "${{ secrets.TARGET_NODE_DOCKER_COMPOSE_02 }}"' >> terraform.tfvars
          fi

          cat >> terraform.tfvars << EOF

          # Storage settings
          disk_storage = "local-lvm"

          # Network settings
          network_bridge = "vmbr0"
          dns_servers    = ["8.8.8.8", "8.8.4.4"]
          dns_domain     = "home"

          # VM password
          vm_password = "${{ secrets.SSH_PASSWORD }}"
          EOF

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -lockfile=readonly
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -out=tfplan
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}

      # How many resources and outputs the plan would change. Only the number leaves
      # this step: the plan JSON holds every input variable unredacted.
      - name: Count Planned Changes
        id: count
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          plan_json="$(terraform show -json tfplan)"
          changes="$(printf '%s' "$plan_json" | node -e '
            const plan = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const quiet = actions => actions.every(a => a === "no-op" || a === "read");
            const resources = (plan.resource_changes || []).filter(rc => !quiet(rc.change.actions));
            const outputs = Object.values(plan.output_changes || {}).filter(o => !quiet(o.actions));
            console.log(resources.length + outputs.length);
          ')"
          [[ "$changes" =~ ^[0-9]+$ ]] || { echo "could not count the planned changes" >&2; exit 1; }
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          echo "**Planned changes: $changes**" >> "$GITHUB_STEP_SUMMARY"
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}

      - name: Plan Summary
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan | head -n 100 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # The plan file embeds every input variable unredacted (Proxmox token
      # secret, VM password), so it is never uploaded -- this repo is public
      # and anyone signed in can download its artifacts. Review the plan in
      # the job summary above (sensitive values are masked there). The runner
      # is a persistent VM, so remove both files from the workspace.
      - name: Cleanup Temporary Files
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: rm -f terraform.tfvars tfplan

  # Passes only when the plan above changes nothing, and is skipped otherwise (a
  # plan with changes is not a failure of this workflow). The triage agent reads
  # this job after it merges a provider update: see `After merge` in .factory/risk.md.
  plan-no-changes:
    name: Plan shows no changes
    runs-on: [self-hosted, Linux, X64]
    needs: terraform-plan
    if: needs.terraform-plan.outputs.changes == '0'
    steps:
      - name: Nothing to apply
        run: echo "The plan for this commit changes nothing."
