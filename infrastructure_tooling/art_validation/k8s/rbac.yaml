# The runner may do exactly the tests in art-validation.sh, in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: art-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: art-runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [art-runner]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, get, delete]
  # Needed to bind the view ClusterRole in a RoleBinding (RBAC escalation check).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [view]
    verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: art-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: art-runner
subjects:
  - kind: ServiceAccount
    name: art-runner
    namespace: art-validation
