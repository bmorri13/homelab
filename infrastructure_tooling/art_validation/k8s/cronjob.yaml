# Weekly, at the same time as the host part on ubuntu-desktop-01. Run it any time with
#   kubectl -n art-validation create job --from=cronjob/art-validation art-validation-manual-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: art-validation
spec:
  schedule: "0 6 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: art-validation
        spec:
          serviceAccountName: art-runner
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          # The official kubectl image (distroless, matches the k3s 1.36 server) has no
          # shell, so a static busybox is copied in for the script. Replaced alpine/k8s,
          # whose bundled tools carried 23 critical CVEs (Trivy, 2026-11-04).
          initContainers:
            - name: tools
              image: docker.io/library/busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
              command: [sh, -c, 'cp /bin/busybox /tools/busybox && cd /tools && for a in $(./busybox --list); do ln -sf busybox "$a"; done']
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: tools, mountPath: /tools}
          containers:
            - name: runner
              image: registry.k8s.io/kubectl:v1.36.6@sha256:0650805141538d13ccbb6bb9e0dd647bc415bc002898357970211c4d47224396
              command: [/tools/sh, /scripts/art-validation.sh]
              env:
                - {name: HOME, value: /tmp}
                - {name: PATH, value: /tools:/bin:/usr/bin:/usr/local/bin}
                - name: TARGET_IMAGE
                  value: docker.io/library/busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: tools, mountPath: /tools, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap: {name: art-validation-scripts}
            - name: tools
              emptyDir: {}
            - name: tmp
              emptyDir: {}
