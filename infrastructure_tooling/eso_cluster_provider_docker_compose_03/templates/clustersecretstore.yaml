# Secondary cluster (docker-compose-03-k3s) only; applied by hand, see
# docs/secondary-cluster.md. k3s-01 has its own vault-backend store
# (eso_cluster_provider_helm); applying this there would overwrite it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault-k3s.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"
          namespace: "default"
