# OpenCanary honeypot on docker-compose-02. See README.md.
name: opencanary

services:
  opencanary:
    image: thinkst/opencanary:0.9.10@sha256:4e51338e3b6e349652b0604be656d9b8fc1cde2cd40409b2e956f1da3eb673a1
    container_name: opencanary
    hostname: nas-backup-01
    restart: unless-stopped
    # Binds its ports as root, then drops to nobody (the image's default command).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /var/tmp, /var/run]
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - ./opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
    networks:
      lan:
        ipv4_address: 192.168.4.240
    # Fixed, locally administered MAC so UniFi keeps one client entry across recreates.
    mac_address: "02:42:c0:a8:04:f0"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  # Its own address on proxmox-net (192.168.4.0/24, DHCP hands out .6-.100), so it
  # looks like another machine. The VM itself cannot reach this address (macvlan).
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.4.0/24
          gateway: 192.168.4.1
          ip_range: 192.168.4.240/32
