{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app-cointhieves
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: arc-github-app-cointhieves
    creationPolicy: Owner
    # ESO defaults spelled out so ArgoCD doesn't report drift on them
    deletionPolicy: Retain
  data:
    {{- range list "github_app_id" "github_app_installation_id" "github_app_private_key" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.vaultPath }}
        property: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
