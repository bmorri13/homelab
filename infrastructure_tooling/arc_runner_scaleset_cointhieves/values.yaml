gha-runner-scale-set:
  # Org-level scale set: any cointhieves repo the runner group allows can target it.
  # Public repos are blocked by the org runner group's default
  # ("Allow public repositories" off), and should stay that way -- six
  # cointhieves repos are public and a fork PR would otherwise run on this cluster.
  githubConfigUrl: "https://github.com/cointhieves"

  # GitHub App credentials (github_app_id, github_app_installation_id,
  # github_app_private_key) synced from Vault kv/github-arc-cointhieves by the
  # ExternalSecret in templates/. Org runners need the App's
  # organization "Self-hosted runners: write" permission; the repo-scoped PAT in
  # kv/github-arc can't register them.
  githubConfigSecret: arc-github-app-cointhieves

  # Controller service account (required for ArgoCD deployment)
  controllerServiceAccount:
    name: arc-controller-k3s-gha-rs-controller
    namespace: arc-systems

  # Runner configuration - use this as runs-on value
  runnerScaleSetName: "arc-k3s-cointhieves"

  # One warm runner so a dead listener is visible (see arc_runner_scaleset_daily_news).
  # Bounded, unlike the bmorri13 scale sets: k3s-01 is a single 4-core node that
  # also runs Vault and ArgoCD, and org repos can queue many jobs at once.
  minRunners: 1
  maxRunners: 3

  # Docker-in-Docker, spelled out by hand instead of `containerMode.type: dind`.
  # Org CI (GuardRail's scans in particular) builds images and runs `docker run`,
  # which kubernetes mode can't do. The chart's built-in dind container can't
  # take resource limits, and that sidecar is where all the Docker work
  # actually runs, so this is the chart's dind render (0.13.1, k8s >= 1.29
  # native sidecar) with limits and a real /var/lib/docker volume added.
  #
  # The dind sidecar is privileged: a job can reach the k3s-01 node. That's
  # accepted because only private cointhieves repos can use these runners
  # (the org runner group blocks public repos -- keep it that way).
  template:
    spec:
      initContainers:
        - name: init-dind-externals
          image: ghcr.io/actions/actions-runner:latest
          command: ["cp"]
          args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        - name: dind
          image: docker:dind
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
            # Keeps dockerd's overlay2 storage off the container's own overlayfs
            - name: dind-storage
              mountPath: /var/lib/docker
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/home/runner/run.sh"]
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
      volumes:
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        - name: work
          emptyDir: {}

externalSecret:
  # Owns arc-github-app-cointhieves only. Separate from the shared
  # arc-github-token secret that arc_runner_scaleset creates.
  enabled: true
  refreshInterval: "1h"
  secretStoreName: vault-backend
  vaultPath: kv/github-arc-cointhieves
