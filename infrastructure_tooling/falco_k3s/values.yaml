# Falco on k3s-01. Alerts are one JSON object per line on stdout; the OTel collector
# DaemonSet (infrastructure_tooling/otel_collector_k3s) already ships pod logs to
# Cribl, where the cc-falco-ocsf pack turns them into OCSF Detection Findings in
# index=security (matched on namespace "falco"). The syscall DaemonSet loads the
# same rules as the hosts: infrastructure_tooling/monitoring_stack/falco/rules.d and
# config.d/homelab-rules.yaml, through templates/homelab-rules.yaml (rules.d and
# config.d here are symlinks to that directory). Output settings are below.
#
# Node prerequisite: k3s-01 has /etc/sysctl.d/99-inotify.conf with
# fs.inotify.max_user_instances = 8192, installed by ../k3s_node/install.sh. Falco
# needs an inotify instance at start (it watches its config), and every containerd
# shim holds some as root, so at the default 128 a rollout crashloops with "could not
# initialize inotify handler" while the old pod still holds its instance. On a rebuilt
# node, run that script again.
falco:
  driver:
    kind: modern_ebpf      # kernel 6.8 with BTF; no kernel module

  falcoctl:
    artifact:
      install:
        enabled: true      # installs the container plugin and falco-rules at pod start
      follow:
        enabled: false     # no rule auto-updates between restarts
    config:
      artifact:
        install:
          # The stable rules, pinned to the release the hosts' Falco package ships
          # (Falco 0.45.2: falco-rules 5.2.0). Move it with the Falco version.
          # The chart adds the container plugin to this list.
          refs: ["falco-rules:5.2.0"]
        follow:
          refs: []

  # The homelab rules and rule selection (templates/homelab-rules.yaml). The chart's
  # own customRules would mount over /etc/falco/rules.d, so it stays unset here.
  mounts:
    volumes:
      - name: homelab-rules
        configMap:
          name: falco-homelab-rules
      - name: homelab-config
        configMap:
          name: falco-homelab-config
    volumeMounts:
      - name: homelab-rules
        mountPath: /etc/falco/rules.d
        readOnly: true
      - name: homelab-config
        mountPath: /etc/falco/homelab.d
        readOnly: true

  falco:
    # config.d is the chart's own (driver loader); homelab.d holds the rule selection.
    config_files:
      - /etc/falco/config.d
      - /etc/falco/homelab.d
    priority: notice
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    stdout_output:
      enabled: true
    # OCSF needs process/parent PIDs and an image id on every alert.
    append_output:
      - suggested_output: true
      - match:
          source: syscall
        extra_fields:
          - proc.pid
          - proc.ppid
          - container.image.id

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi

# Kubernetes audit detections. The apiserver posts audit events
# (infrastructure_tooling/k3s_audit) to this Deployment's k8saudit plugin, which runs
# the k8saudit-rules set. Alerts go to stdout as JSON like the DaemonSet's; FALCO_HOSTNAME
# is the node name, so they arrive in index=security with host=k3s-01.
falco-k8saudit:
  fullnameOverride: falco-k8saudit
  # k3s control-plane identities missing from the rules' allowed_k8s_users list
  # ("Disallowed K8s User" fired every minute for the embedded cloud controller).
  # k3s's local-path provisioner runs a short-lived helper pod in kube-system for
  # every volume it creates or deletes (18 alerts 2026-10-26/27). The audit policy
  # logs pods at Metadata level, so the rule's image allow-list never matches; the
  # exception is by identity instead. Any other user creating a kube-system pod
  # still alerts.
  # ARC's homelab runner set runs in Kubernetes container mode: its runner pod
  # execs each job step into the job's own "<runner>-workflow" pod (about 100 of
  # 117 "Attach/Exec Pod" alerts 2026-10-25 to 10-28). Only that service account,
  # in arc-runners, into a -workflow pod is exempt; any other exec still alerts.
  # Trivy Operator reads its own config secret in trivy-system on every reconcile
  # (3,622 "K8s Secret Get Successfully" alerts in 24 hours, 2026-11-12). Only its
  # service account reading secrets in trivy-system is exempt; its reads in other
  # namespaces, and anyone else's, still alert.
  customRules:
    homelab_k8saudit.yaml: |-
      - list: allowed_k8s_users
        items: ["k3s-cloud-controller-manager", "system:k3s-supervisor", "system:k3s-controller"]
        override:
          items: append
      - rule: Pod Created in Kube Namespace
        condition: and not ka.user.name = "system:serviceaccount:kube-system:local-path-provisioner-service-account"
        override:
          condition: append
      - rule: Attach/Exec Pod
        condition: >-
          and not (ka.user.name = "system:serviceaccount:arc-runners:arc-k3s-homelab-gha-rs-kube-mode" and
          ka.target.namespace = arc-runners and ka.target.name endswith -workflow)
        override:
          condition: append
      - rule: K8s Secret Get Successfully
        condition: >-
          and not (ka.user.name = "system:serviceaccount:trivy-system:trivy-operator" and
          ka.target.namespace = trivy-system)
        override:
          condition: append
  driver:
    enabled: false
  collectors:
    enabled: false
  controller:
    kind: deployment
    deployment:
      replicas: 1        # the plugin is a webhook receiver; more replicas would need a load balancer for nothing

  falcoctl:
    artifact:
      install:
        enabled: true
      follow:
        enabled: false   # pinned rules, as with the syscall DaemonSet
    config:
      artifact:
        install:
          refs: ["k8saudit-rules:0.16", "k8saudit:0.16"]   # falcoctl pulls the json plugin as a dependency
        follow:
          refs: []

  # Fixed ClusterIP: the apiserver runs on the host and can't resolve cluster DNS
  # (audit-webhook.kubeconfig points here). Not exposed outside the cluster.
  services:
    - name: webhook
      type: ClusterIP
      clusterIP: 10.43.200.10
      ports:
        - name: k8saudit
          port: 9765
          targetPort: 9765
          protocol: TCP

  falco:
    rules_files:
      - /etc/falco/k8s_audit_rules.yaml
      - /etc/falco/rules.d
    plugins:
      - name: k8saudit
        library_path: libk8saudit.so
        init_config: ""
        open_params: "http://:9765/k8s-audit"
      - name: json
        library_path: libjson.so
        init_config: ""
    load_plugins: [k8saudit, json]
    priority: notice
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    stdout_output:
      enabled: true
    webserver:
      enabled: true      # liveness/readiness probes; ClusterIP only

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1024Mi     # 512Mi was OOM-killed on 2026-11-04, -05 and -08
