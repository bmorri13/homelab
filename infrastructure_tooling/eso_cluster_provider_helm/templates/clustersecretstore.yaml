---

# Sets up the cluster-wide secret store.
#
# ESO logs in to Vault with its own ServiceAccount (Vault Kubernetes auth),
# not a stored token. The Vault side is runtime state, not GitOps; see
# README.md in this directory for the exact commands. The Vault role
# `external-secrets` grants only the `eso-read` policy (read kv/data/*,
# read+list kv/metadata/*), so ESO cannot write to Vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets-operator
            namespace: external-secrets
            audiences: ["vault"]
