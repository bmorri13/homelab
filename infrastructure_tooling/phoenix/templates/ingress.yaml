# Tailnet-only and behind Authentik, same pattern as cribl.bmosan.com: the DNS record points at k3s-01's
# tailnet IP and this allowlist rejects non-tailnet sources.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.ingress.sourceRanges | nindent 6 }}
---
# Every request is shown to Authentik's embedded outpost first. Authentik decides who
# may pass (the Phoenix application: authentik Admins, with a second factor). The
# outpost's login paths on this host are served from the authentik chart.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.ingress.forwardAuthClusterIP }}/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entrypoints }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-tailnet-only@kubernetescrd,{{ .Release.Namespace }}-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phoenix
                port:
                  number: 6006
  tls:
    - hosts:
        - {{ .Values.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
