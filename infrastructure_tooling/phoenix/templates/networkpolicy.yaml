# In: the namespaces that send traces. Traefik is hostNetwork on k3s-01 and kube-router
# admits node-local traffic, so the Ingress still reaches port 6006.
# Out: DNS only. Phoenix has no reason to call anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phoenix
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.senders }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 6006}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
