gha-runner-scale-set:
  githubConfigUrl: "https://github.com/bmorri13/homelab"

  # Reference the secret created by ExternalSecret (pre-created)
  githubConfigSecret: arc-github-token

  # Controller service account (required for ArgoCD deployment)
  controllerServiceAccount:
    name: arc-controller-k3s-gha-rs-controller
    namespace: arc-systems

  # Runner configuration - use this as runs-on value
  runnerScaleSetName: "arc-k3s-homelab"

  # Container mode (recommended for K8s)
  containerMode:
    type: "kubernetes"
    kubernetesModeWorkVolumeClaim:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 10Gi

externalSecret:
  # Owns the shared arc-github-token secret for BOTH scale sets in arc-runners.
  # Deliberately enabled here only -- arc_runner_scaleset_daily_news renders a
  # secret of the same name in the same namespace, so enabling both would make
  # two ArgoCD apps claim one resource.
  # Was previously created by hand; that manual step was lost in the bmo-nuc ->
  # k3s-01 migration and left every ARC runner dead from 2026-04-20.
  enabled: true
  refreshInterval: "1h"
  secretStoreName: vault-backend
  vaultPath: kv/github-arc
