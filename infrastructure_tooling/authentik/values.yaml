# Authentik on k3s-01: https://auth.bmosan.com, tailnet-only. The identity provider for
# Splunk Web (SAML) and the Cribl UI (Traefik forward auth; Cribl's Free license has no
# external login). Every login needs a second factor (blueprints/require-mfa.yaml).
#
# Secrets come from Vault kv/authentik through an ExternalSecret (templates/
# externalsecret.yaml): secret_key, postgres_password, bootstrap_password. See README.md
# for how they were generated without leaving Vault.

host: auth.bmosan.com

vault:
  secretStoreName: vault-backend
  path: kv/authentik
  refreshInterval: 1h

ingress:
  className: traefik
  entrypoints: websecure
  clusterIssuer: bmosan-cert
  tlsSecretName: auth-bmosan-com-tls
  # Tailscale IPv4 and IPv6. The DNS record points at k3s-01's tailnet IP; this rejects
  # the LAN path (192.168.4.98 + Host header) and everything else.
  sourceRanges:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48

# The Cribl UI behind Authentik (templates/cribl.yaml). Cribl's Free license has no
# external login, so Traefik asks Authentik's embedded outpost first, then Cribl's own
# login follows. The Leader's firewall lets only k3s-01 reach port 9000.
cribl:
  host: cribl.bmosan.com
  tlsSecretName: cribl-bmosan-com-tls
  # The Leader, on security-tooling-01. Its cert (homelab CA) has this name, not the
  # host name, so Traefik verifies against it.
  leader:
    ip: 192.168.4.11
    port: 9000
    serverName: cribl-homelab
  # Traefik runs on the host network, so it can't resolve cluster DNS names. It reaches
  # the outpost through a Service at this fixed address instead.
  forwardAuthClusterIP: 10.43.200.11

# Splunk Web (templates/splunk.yaml). No forward auth: Splunk logs in through Authentik
# itself with SAML (blueprints/splunk.yaml). The Splunk host's firewall lets only
# k3s-01 reach port 8000.
splunk:
  host: splunk.bmosan.com
  tlsSecretName: splunk-bmosan-com-tls
  # Splunk Web's cert (homelab CA, scripts/tls-certs.sh) has this name.
  web:
    ip: 192.168.4.11
    port: 8000
    serverName: splunk-homelab

# Authentik's database: the official image, one replica, on k3s-01's local-path storage.
# (The upstream chart's PostgreSQL option is the Bitnami chart, which no longer has free
# images.)
postgres:
  image: docker.io/library/postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
  storageClass: local-path
  size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

authentik:
  global:
    # Digest inside tag, not in digest:, so Renovate bumps both together.
    image:
      repository: ghcr.io/goauthentik/server
      tag: 2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    # Secrets from the ExternalSecret. env wins over the chart's own config Secret.
    env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: authentik-credentials, key: secret_key}
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef: {name: authentik-credentials, key: postgres_password}
      # Only read on the very first start: the password of the built-in akadmin user.
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        valueFrom:
          secretKeyRef: {name: authentik-credentials, key: bootstrap_password}

  authentik:
    log_level: info
    error_reporting:
      enabled: false
    postgresql:
      host: authentik-postgres
      name: authentik
      user: authentik

  blueprints:
    configMaps:
      - authentik-homelab-blueprints

  # The forward auth for the Cribl UI uses the outpost embedded in the server, so
  # Authentik needs no Kubernetes API access to deploy outposts of its own.
  serviceAccount:
    create: false

  server:
    replicas: 1
    securityContext: &podsec
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile: {type: RuntimeDefault}
    containerSecurityContext: &ctrsec
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    metrics:
      enabled: false

  worker:
    replicas: 1
    securityContext: *podsec
    containerSecurityContext: *ctrsec
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 1Gi
    metrics:
      enabled: false

  postgresql:
    enabled: false
