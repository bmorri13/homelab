# Every login through the default authentication flow needs a second factor: an
# authenticator app (TOTP) or a passkey/security key (WebAuthn). A user without one is
# made to enrol one before the login completes. The stage itself comes from Authentik's
# default blueprint (flow-default-authentication-flow.yaml); this only changes its
# settings, which that blueprint leaves alone.
version: 1
metadata:
  name: homelab - require MFA
entries:
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes:
        - totp
        - webauthn
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
