---
# Argo CD Application for Authentik. Apply once:
#   kubectl apply -f infrastructure_tooling/authentik/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bmorri13/homelab.git
    targetRevision: HEAD
    path: infrastructure_tooling/authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
  # The API server adds status.phase to the database's volumeClaimTemplate.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: authentik-postgres
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status
