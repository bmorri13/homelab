# Authentik's PostgreSQL. One replica on local-path storage; the PVC is kept if the app
# is deleted.
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
spec:
  selector:
    app.kubernetes.io/name: authentik-postgres
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres
spec:
  serviceName: authentik-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999     # postgres in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_DB, value: authentik}
            - {name: POSTGRES_USER, value: authentik}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: authentik-credentials, key: postgres_password}
            # A subdirectory: the volume root holds lost+found on some storage.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, authentik, -d, authentik]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, authentik, -d, authentik]
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  # apiVersion, kind and volumeMode are the API server's defaults, spelled out so Argo CD
  # sees no difference (status is ignored in application.yaml).
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
# Only Authentik's server and worker may reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
        {{- if .Values.postgres.backup.enabled }}
        # And the backup (templates/postgres-backup.yaml).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik-postgres-backup
        {{- end }}
      ports:
        - {protocol: TCP, port: 5432}
