# secret_key, postgres_password and bootstrap_password from Vault (README.md: generated
# inside Vault, never printed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-credentials
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: authentik-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key := list "secret_key" "postgres_password" "bootstrap_password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.vault.path }}
        property: {{ $key }}
        # Spelled out because the API server defaults them, which Argo CD reports as drift.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
