# https://splunk.bmosan.com: Splunk Web, tailnet-only. Splunk itself sends the login to
# Authentik (SAML, blueprints/splunk.yaml), so there is no forward auth here.

# Splunk Web outside the cluster: a Service without a selector, and its one endpoint.
apiVersion: v1
kind: Service
metadata:
  name: splunk-web
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-splunk-web@kubernetescrd
spec:
  ports:
    - {name: https, port: {{ .Values.splunk.web.port }}, targetPort: {{ .Values.splunk.web.port }}, protocol: TCP}
---
# EndpointSlice, as for cribl-leader (templates/cribl.yaml).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: splunk-web
  labels:
    kubernetes.io/service-name: splunk-web
    endpointslice.kubernetes.io/managed-by: argocd.homelab
addressType: IPv4
endpoints:
  - addresses: [{{ .Values.splunk.web.ip | quote }}]
    conditions: {ready: true}
ports:
  - {name: https, port: {{ .Values.splunk.web.port }}, protocol: TCP}
---
# Traefik verifies Splunk Web's cert against the homelab CA only (Secret homelab-ca,
# templates/cribl.yaml).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: splunk-web
spec:
  serverName: {{ .Values.splunk.web.serverName }}
  rootCAs:
    - secret: homelab-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splunk
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entrypoints }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-tailnet-only@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.splunk.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: splunk-web
                port:
                  number: {{ .Values.splunk.web.port }}
  tls:
    - hosts:
        - {{ .Values.splunk.host }}
      secretName: {{ .Values.splunk.tlsSecretName }}
