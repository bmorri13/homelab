gha-runner-scale-set:
  githubConfigUrl: "https://github.com/bmorri13/daily_news_app"

  # Reference the secret created by ExternalSecret (pre-created)
  githubConfigSecret: arc-github-token

  # Controller service account (required for ArgoCD deployment)
  controllerServiceAccount:
    name: arc-controller-k3s-gha-rs-controller
    namespace: arc-systems

  # Runner configuration - use this as runs-on value
  runnerScaleSetName: "arc-k3s-daily-news"

  # Keep one runner registered at all times so an ARC outage is visible from
  # `kubectl -n arc-runners get pods` instead of going unnoticed. This scale set
  # shares the arc-github-token secret with arc_runner_scaleset, so it was dead
  # for the same four months (2026-04-20 to 2026-08-08) and for the same reason
  # -- and nobody noticed, because with minRunners at the default 0 a dead
  # listener and an idle scale set look identical.
  #
  # Note this does NOT bound the 24h queue ceiling, which is a GitHub-side limit
  # on self-hosted jobs and is not configurable.
  #
  # maxRunners is deliberately left unset (unbounded), matching arc_runner_scaleset.
  minRunners: 1

  # Container mode (recommended for K8s)
  containerMode:
    type: "kubernetes"
    kubernetesModeWorkVolumeClaim:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 10Gi

externalSecret:
  # Intentionally disabled -- do not flip this to true.
  # The arc_runner_scaleset chart creates the shared arc-github-token secret in
  # this same namespace (arc-runners). Enabling it here too would make the
  # arc-runner-scaleset-k3s and arc-runner-daily-news-k3s ArgoCD apps both own
  # the same resource. This scale set consumes the secret that chart creates,
  # so the PAT/App in Vault kv/github-arc must cover daily_news_app as well.
  enabled: false
  refreshInterval: "1h"
  secretStoreName: vault-backend
  vaultPath: kv/github-arc
