# Nothing reaches the pods, and they reach only DNS and HTTPS on the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: software-factory
  labels:
    {{- include "software-factory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: software-factory
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.internetExcept | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
