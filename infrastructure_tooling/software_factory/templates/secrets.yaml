# Everything secret comes from Vault through External Secrets. Nothing is in git.
{{- define "software-factory.ref" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
# The GitHub App's id and private key. Each run trades the key for a one-hour token
# limited to the one repository it is working on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: software-factory-github-app
  labels:
    {{- include "software-factory.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: software-factory-github-app
    creationPolicy: Owner
  data:
    {{- range list "app_id" "private_key" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.vault.githubApp }}
        property: {{ . }}
        {{- include "software-factory.ref" $ }}
    {{- end }}
---
# The Claude credential, shared with the homelab agents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: software-factory-claude
  labels:
    {{- include "software-factory.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: software-factory-claude
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.vault.claude }}
        property: claude_oauth_token
        {{- include "software-factory.ref" . }}
---
# GHCR pull credential for the private image (read:packages only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: software-factory-ghcr-pull
  labels:
    {{- include "software-factory.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: software-factory-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}'
  data:
    {{- range list "username" "token" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.image.pullSecretVaultPath }}
        property: {{ . }}
        {{- include "software-factory.ref" $ }}
    {{- end }}
