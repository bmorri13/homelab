# Argo CD Application for the software-factory agent. Applied by hand once (no app-of-apps):
#   kubectl apply -f infrastructure_tooling/software_factory/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: software-factory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bmorri13/homelab.git
    targetRevision: HEAD
    path: infrastructure_tooling/software_factory
  destination:
    server: https://kubernetes.default.svc
    namespace: software-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
