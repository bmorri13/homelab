# AdGuard Home: a DNS resolver for the LAN whose query log goes to Splunk. Clients reach
# it at k3s-01's LAN address, 192.168.4.98:53 (Service below); DHCP hands it out first,
# with the gateway second, so clients fall back to the gateway if it stops answering
# (README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-work
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  labels:
    app.kubernetes.io/name: adguard
spec:
  replicas: 1
  # One pod at a time: the work volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The Git config replaces whatever AdGuard wrote back last time, and the work
        # directory is created one level down the volume (whose root belongs to root),
        # so AdGuard owns it at 0700.
        - name: config
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [sh, -c, "cp /config/AdGuardHome.yaml /conf/AdGuardHome.yaml && mkdir -p /work/agh && chmod 700 /work/agh"]
          securityContext: &ctr
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: conf, mountPath: /conf}
            - {name: work, mountPath: /work}
      containers:
        - name: adguard
          image: docker.io/adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          args: [--no-check-update, -c, /opt/adguardhome/conf/AdGuardHome.yaml, -w, /opt/adguardhome/work/agh]
          ports:
            - {name: dns-udp, containerPort: 5353, protocol: UDP}
            - {name: dns-tcp, containerPort: 5353, protocol: TCP}
            - {name: http, containerPort: 3000, protocol: TCP}
          # The binary carries the NET_BIND_SERVICE file capability, so it won't exec
          # without that capability in the bounding set (the one the restricted Pod
          # Security level allows). It still listens on unprivileged ports.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          readinessProbe:
            tcpSocket: {port: 5353}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5353}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: conf, mountPath: /opt/adguardhome/conf}
            - {name: work, mountPath: /opt/adguardhome/work}
        # Ships the query log: AdGuard writes it to a file, not stdout. Its lines reach
        # Splunk through the k3s OTel collector and Cribl (hec_in: index=network,
        # sourcetype=adguard:querylog).
        - name: querylog
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          # From the end on a restart (Splunk already has the older lines); from the start
          # if AdGuard hasn't created the file yet.
          command:
            - sh
            - -c
            - |
              f=/work/agh/data/querylog.json; from=0
              until [ -f "$f" ]; do from=+1; sleep 5; done
              exec tail -n "$from" -F "$f"
          securityContext: *ctr
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - {name: work, mountPath: /work, readOnly: true}
      volumes:
        - name: config
          configMap: {name: adguard-config}
        - name: conf
          emptyDir: {}
        - name: work
          persistentVolumeClaim: {claimName: adguard-work}
---
# Port 53 on k3s-01's LAN address, forwarded to the pod's 5353 by kube-proxy.
# externalTrafficPolicy Local keeps the client's own address, so the query log shows
# which device asked.
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
spec:
  selector:
    app.kubernetes.io/name: adguard
  externalIPs: [192.168.4.98]
  externalTrafficPolicy: Local
  ports:
    - {name: dns-udp, port: 53, targetPort: 5353, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: 5353, protocol: TCP}
---
# Only DNS comes in. The web UI (3000) is reached with kubectl port-forward, which
# doesn't pass through the NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adguard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adguard
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
