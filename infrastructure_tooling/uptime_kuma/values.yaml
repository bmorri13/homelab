image:
  repository: louislam/uptime-kuma
  # Pinned (Renovate bumps it): the floating "2" tag with IfNotPresent never pulled
  # again, so the pod sat on 2.3.2 from May with 17 critical CVEs (Trivy).
  tag: "2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

persistence:
  enabled: true
  storageClass: ""  # leave empty to use default
  accessMode: ReadWriteOnce
  size: 1Gi

ingress:
  enabled: true
  host: uptime-kuma.bmosan.com
  className: traefik
  clusterIssuer: bmosan-cert
  # Traefik entrypoint. Must be comma-separated with NO spaces -- Traefik does not
  # trim the values, so "web, websecure" fails to match the websecure entrypoint.
  # Port 80 has no redirect middleware configured on this cluster, so websecure only.
  entrypoints: websecure
  tlsSecretName: uptime-kuma-bmosan-com
