{{- if .Values.ingress.enabled }}
---
# Exposes Uptime Kuma via Traefik at {{ .Values.ingress.host }}.
#
# Traefik on this cluster runs hostNetwork with hostPorts 80/443 bound directly to
# the k3s-01 node IP, and its Service is disabled (service.enabled: false in the
# traefik HelmChartConfig). There is no MetalLB here, so Ingress objects never get
# status.loadBalancer populated -- argocd_config carries a health override so this
# does not leave the app stuck at Progressing. The Cloudflare A record for this
# host points at the node IP directly (DNS-only, LAN-reachable).
#
# The certificate is issued by cert-manager over DNS-01 via Cloudflare, so it does
# not require this host to be reachable from the public internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entrypoints }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
