apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cribl-hec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cribl-hec
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: kv/cribl-hec
        property: token
        # Spelled out because the API server defaults them, which Argo CD reports as drift.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Vault kv/audit-poller: cloudflare_account_id, cloudflare_token, tailscale_client_id,
# tailscale_client_secret. Read-only credentials; see ../README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audit-poller
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: audit-poller
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: kv/audit-poller
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
