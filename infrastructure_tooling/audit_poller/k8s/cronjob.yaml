apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-poller
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit-poller
        spec:
          serviceAccountName: audit-poller
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: poller
              image: cgr.dev/chainguard/python:latest@sha256:31dd69d84fe5235fe18f8ceb5b76620e6f44a0ce1f9b0d3a46c491576f8b453b
              command: [python, /scripts/poll.py]
              env:
                - {name: HEC_URL, value: "https://192.168.4.11:8443/services/collector/event"}
                - {name: HEC_CA, value: /ca/homelab-ca.crt}
                - {name: STATE_FILE, value: /state/state.json}
                - {name: GITHUB_REPOS, value: bmorri13/homelab}
                - name: HEC_TOKEN
                  valueFrom:
                    secretKeyRef: {name: cribl-hec, key: token}
                - name: CLOUDFLARE_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef: {name: audit-poller, key: cloudflare_account_id, optional: true}
                - name: CLOUDFLARE_TOKEN
                  valueFrom:
                    secretKeyRef: {name: audit-poller, key: cloudflare_token, optional: true}
                - name: TAILSCALE_CLIENT_ID
                  valueFrom:
                    secretKeyRef: {name: audit-poller, key: tailscale_client_id, optional: true}
                - name: TAILSCALE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef: {name: audit-poller, key: tailscale_client_secret, optional: true}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: ca, mountPath: /ca, readOnly: true}
                - {name: state, mountPath: /state}
          volumes:
            - name: script
              configMap: {name: audit-poller-script}
            - name: ca
              configMap: {name: homelab-ca}
            - name: state
              persistentVolumeClaim: {claimName: audit-poller-state}
