# Trivy Operator on k3s-01: scans what is actually running, not what is in Git.
# Reports are Kubernetes objects (VulnerabilityReport, ConfigAuditReport,
# ExposedSecretReport, RbacAssessmentReport, ClusterRbacAssessmentReport). The k3s OTel
# collector reads them every 12 hours (otel_collector_k3s, receiver k8s_objects/trivy)
# and sends them to Splunk index=security as sourcetype=trivy:<kind>.

trivy-operator:
  operator:
    # k3s-01 is a single 4-core node that also runs everything else: scan two
    # workloads at a time.
    scanJobsConcurrentLimit: 2
    scanJobTimeout: 10m
    # One Trivy server holds the vulnerability database for every scan, instead of
    # each scan job downloading it.
    builtInTrivyServer: true
    vulnerabilityScannerEnabled: true
    vulnerabilityScannerScanOnlyCurrentRevisions: true
    configAuditScannerEnabled: true
    rbacAssessmentScannerEnabled: true
    exposedSecretScannerEnabled: true
    # Node checks need a privileged collector pod; kube-bench (infrastructure_tooling/
    # kube_bench) runs the CIS k3s benchmark on the host instead.
    infraAssessmentScannerEnabled: false
    clusterComplianceEnabled: false
    # Rescan each workload daily, so new CVEs in unchanged images show up.
    scannerReportTTL: "24h"
    metricsFindingsEnabled: false

  trivy:
    # Pinned here instead of taking the chart's default, so Renovate can see it.
    # 0.76.2 is rebuilt on Alpine 3.24.3 (fixes brotli CVE-2026-111497).
    image:
      registry: mirror.gcr.io
      repository: aquasec/trivy
      tag: 0.76.2
    # Only what is worth acting on; also keeps each report small enough for one
    # Splunk event.
    severity: HIGH,CRITICAL
    ignoreUnfixed: false
    server:
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 1Gi}
      podSecurityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}

  # The restricted Pod Security level applies to the namespace, scan jobs included.
  trivyOperator:
    scanJobPodTemplatePodSecurityContext:
      runAsUser: 10000
      runAsGroup: 10000
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    scanJobPodTemplateContainerSecurityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}

  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

  serviceMonitor:
    enabled: false
