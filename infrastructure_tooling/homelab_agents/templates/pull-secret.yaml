# GHCR pull credential for the private image, from Vault (read:packages only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-agents-ghcr-pull
  labels:
    {{- include "homelab-agents.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homelab-agents-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}'
  data:
    {{- range list "username" "token" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.image.pullSecretVaultPath }}
        property: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
