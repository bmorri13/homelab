# Homelab tuning for the default Falco ruleset. Each exception is scoped to a
# known-good image and process so the rule still fires for anything else.
# Add new ones here, with the evidence that justified them.

# guardrail-postgres: the compose healthcheck runs pg_isready every 5 s, and
# pg_isready (perl) reads /etc/shadow.
- rule: Read sensitive file untrusted
  condition: and not (container.image.repository = postgres and proc.name = pg_isready)
  override:
    condition: append

# Splunk: splunkd runs its own Python and shell helpers (secure gateway, modular
# inputs) as a matter of course.
- rule: Run shell untrusted
  condition: and not (container.image.repository = splunk/splunk and proc.pname in (splunkd, python3.13, python3.9))
  override:
    condition: append

# ARC runner pods (k3s-01): CI jobs download tools and build binaries into the
# runner's home and run them, which is the job. GuardRail's scan alone ran
# /home/runner/.cache/opengrep/.../opengrep-core about 350 times a minute.
# Only this rule, only in arc-runners, only for binaries under /home/runner/;
# every other rule still applies to the runners.
- rule: Drop and execute new binary in container
  condition: and not (k8s.ns.name = arc-runners and proc.exepath startswith /home/runner/)
  override:
    condition: append

# Cluster infrastructure talks to the Kubernetes API by design: ArgoCD, the OTel
# collector (k8s_attributes, k8s_events), ESO, cert-manager, the ARC controller,
# the ToolHive operator, Falco itself, and Vault (Kubernetes auth TokenReview).
# Application namespaces (apiary, toolhive-mcp's kubectl MCP server, alexprinter,
# stirling-pdf, uptime-kuma) still alert: there, API access is worth seeing.
- rule: Contact K8S API Server From Container
  condition: >-
    and not k8s.ns.name in (argocd, otel-collector, kube-system, external-secrets,
    cert-manager, arc-systems, toolhive-system, falco, vault)
  override:
    condition: append
