# Homelab tuning for upstream Falco rules: the stable set (/etc/falco/falco_rules.yaml)
# and the incubating and sandbox rules selected in config.d/homelab-rules.yaml. Upstream
# rules carry no exceptions blocks, so each one is tuned with a condition append.
# Each exception is scoped to a known-good image and process so the rule still fires
# for anything else. Add new ones here, with the evidence that justified them.
# Loaded last, after every rule it changes.

- required_engine_version: 0.57.0

# The vendored incubating and sandbox files redefine python_package_managers without
# uv, and the last definition wins for every rule, stable ones included. Put uv back
# so the stable rules behave as they do with falco_rules.yaml alone.
- list: python_package_managers
  items: [uv]
  override:
    items: append

# guardrail-postgres: the compose healthcheck runs pg_isready every 5 s, and
# pg_isready (perl) reads /etc/shadow. systemd-sysusers (comm is truncated to
# "systemd-sysuser") reads it when packages create users, on hosts and in CI image builds.
# ubuntu-desktop-01: the GNOME update notifier runs
# `pkexec /usr/lib/update-notifier/package-system-locked` about every 2 minutes, and
# pkexec reads /etc/shadow for PAM. Other pkexec use still alerts.
# Proxmox nodes: pvedaemon's workers (comm "pvedaemon worke", truncated at 15) read
# /etc/pam.d/* to authenticate API and web logins (about 40 alerts a week on one
# node). Only those workers, and only /etc/pam.d/, are exempt.
- rule: Read sensitive file untrusted
  condition: >-
    and not ((container.image.repository = postgres and proc.name = pg_isready) or
    proc.name startswith systemd-sysuser or
    (proc.name = pkexec and proc.cmdline contains /usr/lib/update-notifier/) or
    (proc.name = "pvedaemon worke" and fd.name startswith /etc/pam.d/))
  override:
    condition: append

# Splunk: splunkd runs its own Python and shell helpers (secure gateway, modular
# inputs) as a matter of course.
# Steampipe (used by GuardRail's CI scans in arc-runners) runs an embedded
# Postgres from its own install directory; initdb in single-user mode spawns sh.
- rule: Run shell untrusted
  condition: >-
    and not ((container.image.repository = splunk/splunk and proc.pname in (splunkd, python3.13, python3.9)) or
    (k8s.ns.name = arc-runners and proc.pname = postgres and proc.pexepath contains /steampipe/db/))
  override:
    condition: append

# ARC runner pods (k3s-01) are ephemeral CI containers: jobs download tools into
# the runner's home and apt-install compilers, then run them, which is the job.
# GuardRail's scan ran /home/runner/.cache/opengrep/.../opengrep-core about 350
# times a minute, and a Rust build ran apt-installed gcc/cc1/as hundreds of times.
# Only this rule is exempt in arc-runners; reverse shells, credential searches
# (apart from one CI fixture check, below),
# sensitive reads, container escapes and K8s API contact still alert there.
# BuildKit probes for QEMU emulation by writing a tiny binary to /tmp/qemu-check*/check
# and running it, once per build. Inside DinD the container has no k8s metadata, so
# the arc-runners exemption doesn't catch it.
- rule: Drop and execute new binary in container
  condition: >-
    and not (k8s.ns.name = arc-runners or
    (proc.pname = buildkitd and proc.exepath glob "/tmp/qemu-check*/check"))
  override:
    condition: append

# A CI test suite in arc-runners checks its own redaction fixtures with
# `grep -q BEGIN PRIVATE KEY /tmp/tmp.<random>/...` (20 alerts 2026-10-23 to 10-25,
# all from runner pods on k3s-01). Only that exact form is exempt: grep for keys
# anywhere else, any other search tool, or the same command outside arc-runners
# still alerts.
- rule: Search Private Keys or Passwords
  condition: >-
    and not (k8s.ns.name = arc-runners and proc.name = grep and
    proc.cmdline startswith "grep -q BEGIN PRIVATE KEY /tmp/tmp.")
  override:
    condition: append

# Cluster infrastructure talks to the Kubernetes API by design: ArgoCD, the OTel
# collector (k8s_attributes, k8s_events), ESO, cert-manager, the ARC controller,
# the ToolHive operator, Falco itself, and Vault (Kubernetes auth TokenReview).
# Application namespaces (apiary, alexprinter) still
# alert: there, API access is worth seeing.
# toolhive-mcp's kubectl MCP server runs `kubectl proxy`, which reopens its pooled
# API connection about once an hour. Falco sees only that connect, never the
# requests an agent sends through it, so the alert carried no signal. Any other
# process in toolhive-mcp contacting the API still alerts. Agent API activity needs
# the k3s audit log (Falco k8saudit plugin) instead.
# Also in toolhive-mcp: each MCP server's thv-proxyrunner manages its own pod, and
# vmcp discovers backends through the API (57 alerts 2026-10-23 to 10-27, at pod start).
# ARC runners in Kubernetes container mode run job steps as pods through the
# runner's hook, `node /home/runner/k8s/index.js` (1,858 alerts 2026-10-26/27).
# Other runner processes contacting the API still alert.
- rule: Contact K8S API Server From Container
  condition: >-
    and not (k8s.ns.name in (argocd, otel-collector, kube-system, external-secrets,
    cert-manager, arc-systems, toolhive-system, falco, vault) or
    (k8s.ns.name = toolhive-mcp and proc.name = kubectl and proc.cmdline startswith "kubectl proxy") or
    (k8s.ns.name = toolhive-mcp and proc.exepath in (/ko-app/thv-proxyrunner, /ko-app/vmcp)) or
    (k8s.ns.name = arc-runners and container.image.repository = ghcr.io/actions/actions-runner and
    proc.cmdline = "node /home/runner/k8s/index.js"))
  override:
    condition: append

# dockerd and BuildKit unpacking image layers truncate files like var/log/dpkg.log
# inside layer snapshots (seen from the DinD sidecar and image builds in arc-runners). Real log clearing,
# outside dockerd's own storage, still alerts.
- rule: Clear Log Activities
  condition: >-
    and not ((proc.name = dockerd and fd.name startswith /var/lib/docker/) or
    (proc.name = buildkitd and fd.name startswith /var/lib/buildkit/))
  override:
    condition: append

# The Docker-in-Docker sidecar in arc-runners: dockerd opens packet sockets to
# set up networking for each CI job's containers.
- rule: Packet socket created in container
  condition: and not (proc.name = dockerd and container.image.repository = docker.io/library/docker)
  override:
    condition: append

# Privileged containers that exist by design on k3s-01:
# - The Docker-in-Docker sidecar of the cointhieves runner set in arc-runners
#   (arc_runner_scaleset_cointhieves/values.yaml: image docker:dind, privileged: true).
#   It starts with every CI job.
# - k3s's local-path provisioner runs a short-lived privileged helper pod in
#   kube-system for every volume it creates or deletes (helper-pod-*, the
#   mirrored-library-busybox image).
# Falco's own DaemonSet is already allowed by the rule (falco_privileged_images). The
# OTel collector DaemonSet and the Trivy Operator are not privileged (Trivy's node
# collector is off: infraAssessmentScannerEnabled: false). Anything else privileged
# still alerts.
- rule: Launch Privileged Container
  condition: >-
    and not ((k8s.ns.name = arc-runners and container.image.repository = docker.io/library/docker) or
    (k8s.ns.name = kube-system and k8s.pod.name startswith helper-pod- and
    container.image.repository endswith /mirrored-library-busybox))
  override:
    condition: append

# On hosts with a desktop session the container plugin reports systemd user slices
# as containers (container.id "user-0.slice"), and every login runs
# `systemctl --user set-environment ...`, which reads /proc/1/environ to detect
# virtualisation (ubuntu-desktop-01, each SSH session, 2026-11-15). Only systemd's own
# tools reading PID 1's environment are exempt.
- rule: Read environment variable from /proc files
  condition: and not (proc.name in (systemctl, systemd) and fd.name = /proc/1/environ)
  override:
    condition: append
