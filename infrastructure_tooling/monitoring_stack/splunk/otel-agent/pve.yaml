# OTel collector, pve role (layered on base.yaml, Proxmox nodes only): receives
# Proxmox's own metrics and forwards them to Cribl HEC.
# Proxmox VE 9.2's built-in OpenTelemetry metric server (Datacenter -> Metric Server,
# /etc/pve/status.cfg) is set to 127.0.0.1:4318 over http. The config is cluster-wide,
# so every node's pvestatd pushes to its own local collector: node, per-guest (VM and
# LXC: CPU, memory, disk and network I/O) and storage-pool metrics, about every 10 s.
# The listener is bound to localhost, so nothing on the network can write to it.
#
# Also tails pveproxy's access log for writes to the Proxmox API (users, tokens,
# permissions, guest changes). Tasks and logins are already in journald; these aren't.
# GETs are dropped: the web UI polls several times a second.
receivers:
  filelog/pve_access:
    include: [/var/log/pveproxy/access.log]
    start_at: end
    storage: file_storage
    operators:
      - type: filter
        expr: 'body not matches "\"(POST|PUT|DELETE) "'
      - type: regex_parser
        regex: '^(?P<src>\S+) \S+ (?P<pve_user>\S+) \[(?P<when>[^\]]+)\] "(?P<method>[A-Z]+) (?P<uri>\S+) [^"]*" (?P<status>\d+)'
        timestamp:
          parse_from: attributes.when
          layout: '%d/%m/%Y:%H:%M:%S %z'
      - type: remove
        field: attributes.when
  otlp/pve:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  # Proxmox also emits each NIC and storage as its own metric name
  # (proxmox_node_nics_tap100i0_netin, proxmox_node_storages_local_used). The same
  # values arrive as proxmox_node_network_* and proxmox_node_storage_* with a
  # device/storage dimension, so the per-name copies are dropped: one series name per
  # VM interface would grow without bound. Per-device block statistics
  # (proxmox_vm_blockstat_scsi0_*) go too: proxmox_vm_diskread/diskwrite carry the
  # totals, and the host agent already covers the node's own disks.
  filter/pve:
    error_mode: ignore
    metrics:
      metric:
        - IsMatch(name, "^proxmox_node_(nics|storages)_")
        - IsMatch(name, "^proxmox_(vm|node)_blockstat_")
  # pvestatd pushes every ~10 s; one point a minute is enough for the dashboards. It
  # runs before cumulativetodelta because it only thins cumulative and gauge series.
  interval/pve:
    interval: 60s

exporters:
  splunk_hec/pve_access:
    token: ${env:CRIBL_HEC_TOKEN}
    endpoint: https://192.168.4.11:8443/services/collector
    tls:
      ca_file: /etc/otelcol-contrib/homelab-ca.crt
    source: pveproxy
    sourcetype: pve:access
    index: audit
    splunk_app_name: homelab-otel-agent
    sending_queue:
      enabled: true
      storage: file_storage
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0

service:
  pipelines:
    logs/pve_access:
      receivers: [filelog/pve_access]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [splunk_hec/pve_access]
    metrics/pve:
      receivers: [otlp/pve]
      # resourcedetection sets host to the node that collected it, as for host metrics.
      processors: [memory_limiter, resourcedetection, filter/pve, interval/pve, cumulativetodelta, batch]
      exporters: [splunk_hec/metrics]
