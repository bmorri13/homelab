# Splunk Enterprise (developer license) behind Cribl Stream - homelab logging box
# on security-tooling-01. All log sources send to Cribl; Splunk only receives from
# Cribl over the stack's internal network. Data and config live on the host under
# ${SPLUNK_DATA_DIR} and ${CRIBL_DATA_DIR} and survive container recreation and
# image upgrades. Use scripts/deploy.sh rather than a bare `up`.
services:
  splunk:
    image: splunk/splunk:10.6.1@sha256:2a7cf9d2e8a2226773a9fac95b5e0e2cc8752496abfb134a21bdf8f67c9ee44d
    container_name: splunk
    hostname: splunk-homelab
    restart: unless-stopped
    environment:
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_START_ARGS=--accept-license
      # Only applied on first start; change it in the UI afterwards.
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD in .env}
      - SPLUNK_HTTP_ENABLESSL=true
    ports:
      - "8000:8000"   # Splunk Web (HTTPS, self-signed)
      # REST API + the Splunk MCP Server app, for the MCP gateway on k3s-01. LAN
      # address only, and scripts/mgmt-firewall.sh drops every other source.
      - "${SPLUNK_MGMT_BIND:-192.168.4.11}:8089:8089"
    # Not published: 9997 (receives from Cribl), 8088 (HEC, unused).
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
      # Parent of the Unraid NFS mount. rslave lets an NFS mount that comes up
      # after the container started still propagate in; archive_bucket.sh only
      # archives when the share's marker file is visible. Kept outside
      # /opt/splunk: the image chowns everything under it on start, the share
      # refuses chown (all_squash), and splunkd would never start.
      - type: bind
        source: ${SPLUNK_ARCHIVE_HOST_DIR:-/mnt/unraid-splunk}
        target: /mnt/splunk-archive
        bind:
          propagation: rslave
          create_host_path: true
    mem_limit: ${SPLUNK_MEM_LIMIT:-8g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Cribl runs distributed (one Leader, one Worker) because the Cribl MCP server
  # (/api/v1/mcp) only exists on a Leader. The Leader holds the config (in the
  # default Worker Group) and serves the UI, API and MCP over HTTPS; the Worker
  # pulls the config from it and does all the data processing.
  cribl:
    image: cribl/cribl:4.20.3@sha256:8c7ac510ef79c4c5952490efc709b6dcaa0aa1e528754a2edc3faebe4ec1145c
    container_name: cribl
    hostname: cribl-homelab
    restart: unless-stopped
    environment:
      - CRIBL_VOLUME_DIR=/opt/cribl/config-volume
      - CRIBL_DIST_MODE=master
      - CRIBL_DIST_MASTER_URL=tcp://${CRIBL_DIST_TOKEN:?set CRIBL_DIST_TOKEN in .env}@0.0.0.0:4200
      # Cribl's MCP tools call the Leader API over HTTPS at the Leader's own interface
      # address, so its Node runtime must trust the homelab CA.
      - NODE_EXTRA_CA_CERTS=/opt/cribl/config-volume/local/cribl/auth/homelab-tls/ca.crt
    ports:
      - "9000:9000"       # Cribl UI, API and MCP (HTTPS, homelab CA)
    # Not published: 4200 (Worker connections, compose network only).
    # Only on cribl-leader, at a fixed address that tls-certs.sh puts in the cert (see
    # NODE_EXTRA_CA_CERTS above). On a second network the MCP tools could pick the
    # other, changing address.
    networks:
      cribl-leader:
        ipv4_address: ${CRIBL_LEADER_IP:-192.168.237.2}
    volumes:
      # Leader settings, users, the Worker Group config (groups/default, a git
      # repo), and the TLS cert written by scripts/tls-certs.sh.
      - ${CRIBL_DATA_DIR:-/srv/cribl}:/opt/cribl/config-volume
    depends_on:
      - splunk
    # The Cribl server can exit while the container stays up (the entrypoint just
    # sleeps), so report it as unhealthy when the API stops answering.
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/opt/cribl/config-volume/local/cribl/auth/homelab-tls/ca.crt",
             "https://127.0.0.1:9000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # The Leader runs a config helper per Worker Group plus several service
    # processes; it uses about 2.1 GiB and was OOM-killed at 2 GiB.
    mem_limit: ${CRIBL_LEADER_MEM_LIMIT:-3g}
    logging: *logging

  cribl-worker:
    image: cribl/cribl:4.20.3@sha256:8c7ac510ef79c4c5952490efc709b6dcaa0aa1e528754a2edc3faebe4ec1145c
    container_name: cribl-worker
    hostname: cribl-worker-homelab
    restart: unless-stopped
    environment:
      - CRIBL_VOLUME_DIR=/opt/cribl/config-volume
      - CRIBL_DIST_MODE=worker
      - CRIBL_DIST_MASTER_URL=tcp://${CRIBL_DIST_TOKEN:?set CRIBL_DIST_TOKEN in .env}@cribl:4200?group=default
    ports:
      - "514:9514/udp"    # syslog: Proxmox, Unraid, other hosts -> index=infra
      - "514:9514/tcp"
      - "5514:9515/udp"   # syslog: UniFi gateway -> index=network
      - "5514:9515/tcp"
      - "8088:8088"       # HEC from the OTel collectors (token required)
    networks:
      - default           # sends to splunk:9997
      - cribl-leader      # pulls config from cribl:4200
    volumes:
      # Config pulled from the Leader, and the persistent queue that holds data
      # while Splunk is down.
      - ${CRIBL_WORKER_DATA_DIR:-/srv/cribl-worker}:/opt/cribl/config-volume
    depends_on:
      - cribl
      - splunk
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: ${CRIBL_MEM_LIMIT:-2g}
    logging: *logging

networks:
  # The Leader's network. A 192.168.x subnet because the homelab CA may only sign
  # private 192.168.0.0/16 addresses; this one is not used on the LAN.
  cribl-leader:
    ipam:
      config:
        - subnet: ${CRIBL_LEADER_SUBNET:-192.168.237.0/29}

volumes:
  # Bind-backed named volumes: fixed host paths, plus Docker's copy-up of the
  # image's /opt/splunk/etc defaults on first start.
  splunk-etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPLUNK_DATA_DIR:-/srv/splunk}/etc
  splunk-var:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPLUNK_DATA_DIR:-/srv/splunk}/var
