# Repo-managed homelab settings, synced by scripts/deploy.sh.
# Changes made in Splunk Web land in this app's local/ and are left alone by the sync.
[install]
state = enabled

[package]
id = homelab_base
check_for_updates = false

[ui]
is_visible = false
label = Homelab Base

[launcher]
author = bmorri13
description = Index layout, retention, and disk guards for the homelab Splunk instance
version = 1.0.0
