# Hot/warm/cold all live on local disk (Splunk does not support NFS for hot/warm).
# Buckets that age out or exceed the volume cap are archived to the Unraid NFS
# share by bin/archive_bucket.sh. If the share is unavailable the script fails and
# splunkd keeps the bucket and retries, so nothing is deleted without a copy.

[volume:local]
path = $SPLUNK_DB
# Combined cap for the homelab indexes below (MB). The 600 GB root disk is shared.
maxVolumeDataSizeMB = 350000

[homelab]
# General host/app logs (Linux, Docker, Proxmox, apps)
homePath   = volume:local/homelab/db
coldPath   = volume:local/homelab/colddb
thawedPath = $SPLUNK_DB/homelab/thaweddb
frozenTimePeriodInSecs = 31536000
coldToFrozenScript = "/bin/sh" "$SPLUNK_HOME/etc/apps/homelab_base/bin/archive_bucket.sh"

[network]
# UniFi, firewall, DNS
homePath   = volume:local/network/db
coldPath   = volume:local/network/colddb
thawedPath = $SPLUNK_DB/network/thaweddb
frozenTimePeriodInSecs = 31536000
coldToFrozenScript = "/bin/sh" "$SPLUNK_HOME/etc/apps/homelab_base/bin/archive_bucket.sh"

[k8s]
# k3s clusters
homePath   = volume:local/k8s/db
coldPath   = volume:local/k8s/colddb
thawedPath = $SPLUNK_DB/k8s/thaweddb
frozenTimePeriodInSecs = 15552000
coldToFrozenScript = "/bin/sh" "$SPLUNK_HOME/etc/apps/homelab_base/bin/archive_bucket.sh"
