# OCSF 1.9.0 JSON written by the Cribl packs in cribl/packs/. Cribl sends events to
# Splunk already split and timestamped (_time comes from the OCSF "time" field), so
# only search-time JSON extraction is needed here. Fields use OCSF names, for example
# class_uid, src_endpoint.ip, finding_info.analytic.name, unmapped.UNIFIwifiName.

[ubiquiti:unifi:ocsf]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 100000
# The OCSF-CIM add-on maps no src for Detection Findings (IDS/IPS) and falls back to
# an existing src field, so supply one. Other classes get src from the add-on.
FIELDALIAS-finding_src = evidences{}.src_endpoint.ip AS src

[falco:ocsf]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 100000
