# Roles for the homelab indexes. The built-in user and power roles can search
# every non-internal index (srchIndexesAllowed = *), and imported roles pass
# their allowed indexes on. So sensitive indexes are blocked with
# srchIndexesDisallowed, which wins over anything allowed or imported.
#
# Sensitive: audit (Vault, admin actions, remote logins), ai_agents (agent
# prompts and tool calls) and security (detections).

[role_admin]
# Searches with no index= cover the homelab indexes instead of main.
srchIndexesDefault = network;infra;k8s;apps;audit;ai_agents;security

[role_homelab_analyst]
# Everything, including audit, ai_agents and security, without admin rights.
importRoles = user
srchIndexesDefault = network;infra;k8s;apps;audit;ai_agents;security

[role_homelab_viewer]
# Day-to-day logs only: no audit, ai_agents or security.
importRoles = user
srchIndexesDefault = network;infra;k8s;apps
srchIndexesDisallowed = audit;ai_agents;security
