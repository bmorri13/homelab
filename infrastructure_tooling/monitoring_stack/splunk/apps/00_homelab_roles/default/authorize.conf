# Roles for the homelab indexes. The built-in user and power roles can search
# every non-internal index (srchIndexesAllowed = *), and imported roles pass
# their allowed indexes on. So sensitive indexes are blocked with
# srchIndexesDisallowed, which wins over anything allowed or imported.
#
# Sensitive: audit (Vault, admin actions, remote logins), ai_agents (agent
# prompts and tool calls) and security (detections).
#
# mcp_reader is for the mcp-gateway user that the MCP gateway on k3s-01 uses through
# the Splunk MCP Server app. It can search every index, internal ones included, for
# testing; narrow srchIndexesAllowed to cut what MCP clients can read.
#
# mcp_agent is the read-only role for the agents (see its stanza).

[role_admin]
# Searches with no index= cover the homelab indexes instead of main.
srchIndexesDefault = network;infra;k8s;apps;audit;ai_agents;security

[role_homelab_analyst]
# Everything, including audit, ai_agents and security, without admin rights.
importRoles = user
srchIndexesDefault = network;infra;k8s;apps;audit;ai_agents;security

[role_homelab_viewer]
# Day-to-day logs only: no audit, ai_agents or security.
importRoles = user
srchIndexesDefault = network;infra;k8s;apps
srchIndexesDisallowed = audit;ai_agents;security

[role_mcp_reader]
# Search everything plus run the Splunk MCP Server app's tools. No admin rights:
# it cannot mint MCP tokens (mcp_tool_admin) or change config.
# list_introspection: read-only server status, e.g. | rest
# /services/server/status/partitions-space (free disk), which returns 403 without it.
importRoles = user
mcp_tool_execute = enabled
list_introspection = enabled
srchIndexesAllowed = *;_*
srchIndexesDefault = network;infra;k8s;apps;audit;ai_agents;security

[role_mcp_agent]
# The security and operations agents on coding-box, through the MCP gateway
# (user mcp-agent, gateway backend splunk-agent). Read-only by construction: it
# imports no role, because Splunk cannot take back capabilities a role imports,
# and the built-in user role can write with SPL (run_collect, run_mcollect,
# run_sendalert, output_file, run_dump, run_custom_command, upload_lookup_files,
# rest_properties_set, edit_own_objects). Only search and read capabilities are
# listed here, and the write capabilities that system/default/authorize.conf's
# [default] stanza gives every role are switched off.
run_collect = disabled
run_mcollect = disabled
edit_own_objects = disabled
schedule_rtsearch = disabled
search = enabled
get_metadata = enabled
get_typeahead = enabled
list_metrics_catalog = enabled
list_all_objects = enabled
list_inputs = enabled
list_introspection = enabled
read_datasets = enabled
rest_access_server_endpoints = enabled
rest_apps_view = enabled
rest_properties_get = enabled
mcp_tool_execute = enabled
srchIndexesAllowed = *;_*
srchIndexesDefault = network;infra;k8s;apps;audit;ai_agents;security
# Bounded so a looping agent can't tie up splunkd: a few searches at a time,
# five minutes each, no real-time searches.
srchJobsQuota = 4
cumulativeSrchJobsQuota = 4
rtSrchJobsQuota = 0
cumulativeRTSrchJobsQuota = 0
srchMaxTime = 300
srchDiskQuota = 200
# Federated searches reach other deployments; none are configured, keep it that way.
srchFederatedProvidersAllowed =
srchFederatedProvidersDefault =
