# Kubernetes posture on k3s-01, both in index=security.
#
# Trivy Operator reports (infrastructure_tooling/trivy_operator), one event per report
# object as JSON, every 12 hours, through the k3s OTel collector. Fields come out under
# their JSON paths, e.g. 'report.summary.criticalCount',
# 'metadata.labels.trivy-operator.resource.name', 'report.artifact.repository'.
[trivy:vulnerabilityreport]
KV_MODE = json
TRUNCATE = 0

[trivy:exposedsecretreport]
KV_MODE = json
TRUNCATE = 0

[trivy:configauditreport]
KV_MODE = json
TRUNCATE = 0

[trivy:rbacassessmentreport]
KV_MODE = json
TRUNCATE = 0

[trivy:clusterrbacassessmentreport]
KV_MODE = json
TRUNCATE = 0

# kube-bench (infrastructure_tooling/kube_bench), monthly, one line per check:
# "[FAIL] 1.1.20 Ensure that the Kubernetes PKI certificate file permissions are ..."
[kube-bench]
EXTRACT-check = ^\[(?<status>PASS|FAIL|WARN|INFO)\]\s+(?<check_id>[0-9][0-9.]*)\s+(?<check>.+)$
