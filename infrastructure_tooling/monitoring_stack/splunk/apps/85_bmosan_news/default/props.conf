# The daily news app's backend (github.com/bmorri13/daily_news_app) on
# docker-compose-03 writes one JSON object per line, tagged by the Cribl hec_in
# pipeline. Every event has `event`, `level`, `logger` and `message`. Useful events:
# llm_call (index=ai_agents): operation, model, input_tokens, output_tokens,
#   latency_ms, stop_reason, status, error_type
# trigger_invoked / trigger_denied (index=security): path, client_ip, reason
# http_request (index=apps): method, path, status, duration_ms, client_ip, request_id
# job_started / job_completed / job_failed (index=apps): job, trigger, token totals

[bmosan:news:json]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 20000

# cloudflared connector logs: "<time> INF|WRN|ERR <message> key=value ...".
[cloudflare:cloudflared]
KV_MODE = auto
SHOULD_LINEMERGE = false
EXTRACT-cloudflared_level = ^\S+\s+(?<log_level>[A-Z]{3})\s
