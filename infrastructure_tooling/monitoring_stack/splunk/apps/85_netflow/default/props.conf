# NetFlow/IPFIX flow records from the UniFi gateway: Cribl's NetFlow source (input
# netflow, UDP 2055) serializes each record to JSON (pipeline netflow) and sets
# index=network. _time comes from Cribl, so nothing here parses a timestamp.
[netflow]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 20000
