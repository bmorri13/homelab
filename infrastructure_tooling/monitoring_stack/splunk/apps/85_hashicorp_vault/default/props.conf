# Vault audit device entries (one JSON object per line) from Vault's stdout on
# k3s-01, tagged by the Cribl hec_in pipeline. Cribl sends them already split and
# timestamped, so only search-time JSON extraction is needed. Useful fields:
# type (request/response), auth.display_name, auth.policies, request.operation,
# request.path, request.remote_address, error. Tokens and secret values are HMAC'd.
# The sourcetype name matches the Splunkbase HashiCorp Vault add-on's.

[hashicorp_vault_audit_log]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 100000
