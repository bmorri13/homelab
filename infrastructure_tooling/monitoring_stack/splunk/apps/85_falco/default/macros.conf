# Upstream Falco rules on trial: the incubating and sandbox rules enabled in
# falco/config.d/homelab-rules.yaml. Their findings are indexed in index=security like
# any other, but "Falco - runtime finding" leaves them out until each is tuned.
# To graduate a rule: check its findings over the trial, add exceptions for the known
# noise to falco/rules.d/80-upstream-exceptions.yaml, then remove its name here.
# Hand-edited; not generated.
[falco_trial_rules]
definition = finding_info.title IN ("Modify Shell Configuration File", "Schedule Cron Jobs", \
    "Adding ssh keys to authorized_keys", "Launch Privileged Container", "Set Setuid or Setgid bit", \
    "Delete or rename shell history", "Read environment variable from /proc files", \
    "Backdoored library loaded into SSHD (CVE-2024-3094)", "Launch Suspicious Network Tool on Host", \
    "Netcat/Socat Remote Code Execution on Host", "Launch Sensitive Mount Container", \
    "Known Cryptominer Process Executed", "Detect crypto miners using the Stratum protocol", \
    "Network Tool Executed During NPM Package Install", "Web Server Spawned Shell", \
    "Reverse Shell from Web Server")
iseval = 0
