# Any Falco finding from the AI agent rules (falco/rules.d/ai_agents.yaml, all tagged
# ai_agent). One row per host and rule, with the commands seen. Suppressed per host
# and rule for an hour, so a burst raises one alert and a different rule still does.
[Falco - AI agent finding]
search = index=security sourcetype=falco:ocsf finding_info.types{}=ai_agent \
| rename device.hostname as agent_host, finding_info.title as rule, evidences{}.process.cmd_line as command \
| stats count min(_time) as first_seen max(_time) as last_seen values(severity) as severity values(command) as commands by agent_host rule \
| convert ctime(first_seen) ctime(last_seen)
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = agent_host,rule
alert.digest_mode = 0
action.homelab_slack = 1
description = A process run by an AI agent tripped one of the ai_agent Falco rules. Shows host, rule, severity and the commands.

# Every other Falco finding at Warning or above (OCSF severity medium, high,
# critical): the default syscall rules on the VMs and k3s-01, and the k8saudit
# rules on the k3s API audit log. The AI agent rules have their own alert above.
# One row per host and rule, suppressed per host and rule for an hour.
[Falco - runtime finding]
search = index=security sourcetype=falco:ocsf severity IN (medium, high, critical) NOT finding_info.types{}=ai_agent \
| eval detail=coalesce('evidences{}.process.cmd_line', message) \
| rename device.hostname as finding_host, finding_info.title as rule \
| stats count min(_time) as first_seen max(_time) as last_seen values(severity) as severity values(detail) as details by finding_host rule \
| convert ctime(first_seen) ctime(last_seen)
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = finding_host,rule
alert.digest_mode = 0
action.homelab_slack = 1
description = A Falco finding at Warning or above, other than the AI agent rules. Shows host, rule, severity and the command or event.
