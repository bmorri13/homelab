# Any Falco finding from the AI agent rules (falco/rules.d/ai_agents.yaml, all tagged
# ai_agent). One row per host and rule, with the commands seen. Suppressed per host
# and rule for an hour, so a burst raises one alert and a different rule still does.
[Falco - AI agent finding]
search = index=security sourcetype=falco:ocsf finding_info.types{}=ai_agent \
| rename device.hostname as agent_host, finding_info.title as rule, evidences{}.process.cmd_line as command \
| stats count min(_time) as first_seen max(_time) as last_seen values(severity) as severity values(command) as commands by agent_host rule \
| convert ctime(first_seen) ctime(last_seen)
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = agent_host,rule
alert.digest_mode = 0
description = A process run by an AI agent tripped one of the ai_agent Falco rules. Shows host, rule, severity and the commands.
