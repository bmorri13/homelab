# Splunk Web logs in through Authentik (https://auth.bmosan.com) with SAML, so every
# login needs Authentik's second factor. The Authentik side is
# infrastructure_tooling/authentik/blueprints/splunk.yaml.
#
# Local users still work: the REST API and its tokens (mcp-gateway, mcp-agent), and
# the local admin as break-glass at /en-US/account/login?loginType=splunk. Port 8000
# only accepts k3s-01, so the break-glass login is reached through Traefik or an SSH
# tunnel to the host (README.md). HL - Splunk local login reports it.

[authentication]
authType = SAML
authSettings = authentik

[authentik]
# The SP: what the browser sees, through Traefik on k3s-01.
entityId = https://splunk.bmosan.com
fqdn = https://splunk.bmosan.com
redirectPort = 443
# The IdP: the Authentik application with the slug splunk.
issuerId = https://auth.bmosan.com/application/saml/splunk/metadata/
idpSSOUrl = https://auth.bmosan.com/application/saml/splunk/sso/binding/redirect/
idpSLOUrl = https://auth.bmosan.com/application/saml/splunk/slo/binding/redirect/
ssoBinding = HTTPRedirect
sloBinding = HTTPRedirect
redirectAfterLogoutToUrl = https://splunk.bmosan.com
# Authentik's signing cert, copied to etc/auth/idpCerts by deploy.sh from
# auth/authentik-saml.crt. Authentik signs the response and the assertion; Splunk's
# requests are not signed (Authentik has no key to check them with).
idpCertPath = authentik-saml.crt
signedAssertion = true
signAuthnRequest = false
signatureAlgorithm = RSA-SHA256
inboundSignatureAlgorithm = RSA-SHA256;RSA-SHA384;RSA-SHA512
inboundDigestMethod = SHA256;SHA384;SHA512
nameIdFormat = urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
# Roles come only from roleMap_SAML, never from an attribute that happens to name a
# Splunk role.
enableAutoMappedRoles = false

# The attribute names Authentik sends (blueprints/splunk.yaml).
[authenticationResponseAttrMap_SAML]
role = role
realName = realName
mail = mail

# Authentik application entitlement -> Splunk role.
[roleMap_SAML]
admin = splunk-admin
