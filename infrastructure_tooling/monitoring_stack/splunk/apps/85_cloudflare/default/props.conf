# Cloudflare account logs, pulled every 10 minutes by scripts/cloudflare-logs.py on
# security-tooling-01 and sent through Cribl's HEC input (host=cloudflare,
# source=cloudflare-logs:<stream>). One JSON object per event; _time is Cloudflare's
# own timestamp, set by the HEC event, so no timestamp extraction here. The
# cloudflared connector logs (cloudflare:cloudflared) are in 85_bmosan_news.

# Account audit log v2 (index=audit): action.type (create, update, delete, view),
# action.description ("Create DNS Record", "SSO_LOGIN", ...), action.result,
# actor.email / actor.type (user, account, system) / actor.context (dash, api,
# api_token) / actor.ip_address / actor.token.id and .name, resource.product,
# resource.type, resource.request and resource.response (the API bodies; strings
# under secret-looking keys are [REDACTED] by the collector), zone.name, and raw.method,
# raw.uri, raw.user_agent for dashboard and API calls. The HL - Cloudflare detections
# use the hl_cf_audit macro (85_detections) rather than these aliases.
[cloudflare:audit]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 200000
# CIM Change-ish names.
EVAL-user = coalesce('actor.email', 'actor.token.name', 'actor.type')
EVAL-src = 'actor.ip_address'
EVAL-action = case('action.type'=="create", "created", 'action.type'=="update", "modified", 'action.type'=="delete", "deleted", true(), 'action.type')
EVAL-status = if('action.result'=="success", "success", "failure")
EVAL-object_category = 'resource.product'
EVAL-command = 'action.description'
EVAL-vendor_product = "Cloudflare"
FIELDALIAS-cf_audit = zone.name AS dest raw.user_agent AS http_user_agent

# Zero Trust Access authentication log (index=audit): user_email, ip_address,
# app_domain, app_uid, action (login, ...), allowed, connection, country, ray_id,
# created_at.
[cloudflare:access]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
# CIM Authentication-ish names. The original action stays as cf_access_action.
EVAL-cf_access_action = action
EVAL-action = if(allowed=="true" OR allowed==1, "success", "failure")
EVAL-user = user_email
EVAL-src = ip_address
EVAL-app = app_domain
EVAL-vendor_product = "Cloudflare Access"

# Tunnel snapshot (index=network), one event per tunnel per run: tunnel_id,
# tunnel_name, status (healthy, degraded, down, inactive), connections,
# connectors, pending_reconnect, colos{}, origin_ips{}, client_versions{},
# conns_active_at, conns_inactive_at, created_at, remote_config, config_src.
[cloudflare:tunnel]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false

# Security events per zone (index=network, GraphQL firewallEventsAdaptive): datetime,
# action (block, challenge, managed_challenge, jschallenge, log, skip, ...), source
# (waf, firewallManaged, firewallCustom, securitylevel, ratelimit, bic, ...), clientIP,
# clientCountryName, clientAsn, clientASNDescription, clientRequestHTTPHost,
# clientRequestHTTPMethodName, clientRequestPath, clientRequestQuery, ruleId,
# rulesetId, description, rayName, userAgent, edgeColoName, edgeResponseStatus, kind,
# zone. Needs Zone > Analytics > Read on the token.
[cloudflare:firewall]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
FIELDALIAS-cim = clientIP AS src clientRequestHTTPHost AS dest clientRequestPath AS uri_path clientRequestHTTPMethodName AS http_method userAgent AS http_user_agent clientCountryName AS src_country ruleId AS signature_id
EVAL-vendor_action = action
EVAL-vendor_product = "Cloudflare WAF"

# Hourly totals per zone (index=network, GraphQL httpRequests1hGroups), sent once the
# hour is complete: zone, hour, requests, cachedRequests, encryptedRequests, bytes,
# cachedBytes, threats, pageViews, uniques.
[cloudflare:traffic]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
