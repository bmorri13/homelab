# Audit records from the ToolHive vMCP gateway at mcp.bmosan.com (one JSON object
# per line on the vmcp container's stdout), split out of the pod logs by Cribl's
# hec_in pipeline. One record per MCP request: type (mcp_tool_call, ...), outcome,
# subjects.user_id (the client ServiceAccount, e.g. ...:toolhive-clients:macbook-air),
# source.value (client IP), target.method, target.name (the tool),
# metadata.extra.backend_name and metadata.extra.duration_ms. Arguments and results
# are not logged.

[toolhive:vmcp:audit]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 100000
# subjects.user is always "anonymous" (ServiceAccount tokens carry no name claim);
# the client identity is subjects.user_id, one ServiceAccount per machine.
FIELDALIAS-user = subjects.user_id AS user source.value AS src
