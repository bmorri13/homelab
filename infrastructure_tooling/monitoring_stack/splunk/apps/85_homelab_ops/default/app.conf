# Repo-managed, synced by scripts/deploy.sh.
# Changes made in Splunk Web land in this app's local/ and are left alone by the sync.
[install]
state = enabled

[package]
id = 85_homelab_ops
check_for_updates = false

[ui]
is_visible = true
label = Homelab Operations

[launcher]
author = bmorri13
description = Operations dashboard over index=metrics: Proxmox nodes and guests, VM hosts, Docker containers, k3s and the agents, plus the alerts that post to Slack through homelab_slack (agent watchdog, Splunk health and license, detection validation, kube-bench, Trivy)
version = 1.0.0
