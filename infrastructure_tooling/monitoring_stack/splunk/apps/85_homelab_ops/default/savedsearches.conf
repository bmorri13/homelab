# Watchdog for the homelab agents (infrastructure_tooling/homelab_agents: two
# Kubernetes CronJobs on k3s-01, homelab-agent-sec and homelab-agent-ops). The agents
# post their own findings and their own run failures to Slack, but a run that never
# starts (cluster down, CronJob suspended, image can't be pulled, pod can't be
# scheduled) can't report itself. The searches in this file that set
# action.homelab_slack are the only Splunk searches that post to Slack directly
# (homelab_slack action, 85_detections): this watchdog, the checks on what the agents
# depend on (Splunk health, license, detection validation, Vault, k3s, External
# Secrets), the Kubernetes posture reports (kube-bench, Trivy), and the Authentik
# backup check.
#
# Problems, per agent:
#   - no run for more than 75 minutes (runs are every 30), from the run log in index=ai_agents
#   - every run in the last hour failed (Vault, gateway or HEC problem)
#   - every triage in the last hour failed (Claude token expired or revoked, API down)
#   - Kubernetes warnings in the last hour for the agent's CronJob, Jobs or pods
#     (index=k8s kube:events: BackoffLimitExceeded, DeadlineExceeded, ErrImagePull,
#     FailedMount, FailedScheduling, ...), which also say *why* a run didn't happen
#     UnexpectedJob is ignored: the CronJob controller logs it as a Warning whenever a
#     Job is created from the CronJob by hand (kubectl create job --from=cronjob/...),
#     which is a manual run, not a fault. FailedDelete "... not found" is ignored too:
#     the CronJob controller logs it when it prunes an old Job (history limit 2) that is
#     already gone, alongside a SuccessfulDelete for the same Job. Seen 2026-10-29 and
#     twice on 2026-11-10 with every run succeeding. A FailedDelete for any other reason
#     still alerts.
[Agents - not running or failing]
search = | makeresults | eval agent=split("sec,ops", ",") | mvexpand agent | fields agent \
| join type=left agent [search index=ai_agents sourcetype=homelab:agent kind=run earliest=-24h | stats max(_time) as last_run by agent] \
| join type=left agent [search index=ai_agents sourcetype=homelab:agent kind=run earliest=-65m \
    | stats count as runs sum(eval(if(status="error",1,0))) as failed_runs sum(triaged) as triaged sum(triage_errors) as triage_errors latest(error) as last_error by agent] \
| join type=left agent [search index=k8s sourcetype=kube:events k8s.namespace.name=toolhive-clients otel.log.severity.text=Warning k8s.event.reason!=UnexpectedJob NOT (k8s.event.reason=FailedDelete "not found") earliest=-65m \
    | rex field=k8s.object.name "^homelab-agent-(?<agent>sec|ops)" | where isnotnull(agent) \
    | stats values(k8s.event.reason) as k8s_reasons latest(_raw) as k8s_message by agent] \
| fillnull value=0 runs failed_runs triaged triage_errors \
| eval minutes_since=if(isnull(last_run), null(), round((now()-last_run)/60)) \
| eval problem=case(isnull(last_run), "no run in the last 24 hours", \
    minutes_since>75, "no run for ".minutes_since." minutes", \
    runs>0 AND failed_runs==runs, "every run in the last hour failed", \
    triage_errors>0 AND triaged==0, "every triage in the last hour failed", \
    isnotnull(k8s_reasons), "Kubernetes warnings: ".mvjoin(k8s_reasons, ", "), \
    true(), null()) \
| where isnotnull(problem) \
| eval problem_type=case(match(problem, "^no run"), "not running", match(problem, "every run"), "runs failing", \
    match(problem, "every triage"), "triage failing", true(), "kubernetes warnings") \
| eval agent=if(agent=="sec", "Security agent", "Ops agent"), severity="high", \
    detection=agent." is not working", \
    detail=problem.if(isnotnull(last_error), ". Last error: ".last_error, "") \
        .if(isnotnull(k8s_reasons) AND NOT match(problem, "^Kubernetes"), ". Kubernetes: ".mvjoin(k8s_reasons, ", "), "") \
        .if(isnotnull(k8s_message), " (".k8s_message.")", "") \
        .". Check: kubectl -n toolhive-clients get cronjobs,jobs,pods -l app.kubernetes.io/name=homelab-agents", \
    last_run=coalesce(strftime(last_run, "%F %T %Z"), "none in 24h"), \
    link="https://splunk.bmosan.com/en-US/app/85_homelab_ops/homelab_ops" \
| table agent severity detection detail problem problem_type last_run runs link
description = A homelab agent hasn't run for 75 minutes, every run or triage in the last hour failed, or Kubernetes reported warnings for its CronJob. Posts to Slack through homelab_slack.
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 5,35 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = agent,problem_type
action.homelab_slack = 1

# splunkd's own health report (Settings > Health Report Manager), from the
# PeriodicHealthReporter lines it writes to index=_internal every 30 seconds for each
# feature. Fires when a feature has been yellow or red in every report for the last
# 16 minutes (at least 24 of the usual 32, so a splunkd restart in the window still
# counts), so short bursts don't alert (the IOWait thresholds are raised for this
# shared VM in 00_homelab_server/health.conf). The reason is the latest non-green
# indicator's. Each feature alerts at most every 6 hours.
[Splunk - health degraded]
search = index=_internal sourcetype=splunkd component=PeriodicHealthReporter node_type IN (feature, indicator) \
| eval is_feature=if(node_type=="feature", 1, 0) \
| stats count(eval(is_feature==1)) as reports count(eval(is_feature==1 AND color=="green")) as green_reports \
    latest(eval(if(is_feature==1, color, null()))) as color \
    latest(eval(if(is_feature==0 AND color!="green", reason, null()))) as reason \
    latest(eval(if(is_feature==1, node_path, null()))) as node_path by feature \
| where reports>=24 AND green_reports==0 \
| eval severity=if(color=="red", "high", "medium"), problem=feature." is ".color, host="security-tooling-01", \
    detection="Splunk health: ".feature." has been ".color." for 15+ minutes", \
    detail=coalesce(reason, "No indicator reason logged").". Check: index=_internal component=PeriodicHealthReporter feature=\"".feature."\", or Settings > Health Report Manager in Splunk Web.", \
    link="https://splunk.bmosan.com/en-US/app/85_homelab_ops/homelab_ops" \
| table feature severity detection detail problem host node_path link
description = A splunkd health feature (IOWait, Disk Space, Ingestion Latency, Search Lag, ...) has been yellow or red for 15 minutes. Posts to Slack through homelab_slack.
dispatch.earliest_time = -16m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = feature
action.homelab_slack = 1

# The Developer license (Enterprise group, 10 GB/day) is valid for six months. When it
# lapses Splunk falls back to Free: no logins at all (SAML and local users), no
# scheduled searches, so neither this alert nor any detection runs any more. Warns
# weekly from 30 days out, and once more as high when 7 days are left (suppression is
# per severity).
[Splunk - license expiring]
search = | rest /services/licenser/licenses splunk_server=local \
| search group_id=Enterprise status=VALID \
| eval days_left=floor((expiration_time-now())/86400) \
| stats max(days_left) as days_left max(expiration_time) as expires values(label) as license \
| eval days_left=coalesce(days_left, -1) \
| where days_left<=30 \
| eval severity=if(days_left<=7, "high", "medium"), host="security-tooling-01", \
    license=coalesce(mvjoin(license, ", "), "no valid Enterprise license"), \
    expires=if(isnotnull(expires), strftime(expires, "%Y-%m-%d"), "already expired"), \
    detection="Splunk license expires in ".days_left." days (".expires.")", \
    detail=license.". Request a new Developer license from splunk.com and install it under Settings > Licensing. When it lapses Splunk falls back to Free: no logins and no scheduled searches or alerts.", \
    link="https://splunk.bmosan.com/en-US/manager/system/licensing" \
| table severity detection detail license days_left expires host link
description = The Splunk Developer license expires within 30 days. Posts to Slack through homelab_slack.
dispatch.earliest_time = -1m
dispatch.latest_time = now
cron_schedule = 0 13 * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 7d
alert.suppress.fields = severity
action.homelab_slack = 1

# Detection validation (infrastructure_tooling/art_validation): the weekly Atomic Red
# Team style tests log a marker per test, ART-VALIDATION run=<id> expect="<detection>",
# from ubuntu-desktop-01 (index=infra) and the art-validation namespace (index=k8s).
# Hourly, this looks at markers 40 to 100 minutes old (each run is checked exactly
# once) and reports every expected detection that produced no finding carrying the
# art-validation marker: a broken search, a dropped log source, a changed Cribl route
# or Falco rule. The HL - detections run every 15 minutes over [-20m, -5m], so 40
# minutes leaves room for two runs.
[Splunk - detection validation failed]
search = search (index=infra host=ubuntu-desktop-01 "ART-VALIDATION") OR (index=k8s k8s.namespace.name=art-validation "ART-VALIDATION") earliest=-100m latest=-40m \
| rex "ART-VALIDATION run=(?<run>\S+) expect=\"(?<expect>[^\"]+)\" test=(?<test>\S+)" \
| where isnotnull(run) \
| stats min(_time) as started values(test) as tests by run expect \
| join type=left expect \
    [search index=security ((sourcetype=homelab:detection) OR (sourcetype=falco:ocsf host=ubuntu-desktop-01)) "art-validation" earliest=-100m \
    | spath output=falco_title path=finding_info.title \
    | eval expect=if(sourcetype=="falco:ocsf", "Falco: ".mvindex(falco_title, 0), detection) \
    | stats count as found by expect] \
| where isnull(found) \
| eval severity="high", host=if(match(run, "-host$"), "ubuntu-desktop-01", "k3s-01"), \
    detection="Detection validation: ".expect." did not fire", \
    detail="Run ".run." (ATT&CK ".mvjoin(tests, ", ").") expected a finding from ".expect." and none appeared within 40 minutes. Check the search's scheduler runs (index=_internal sourcetype=scheduler), the source's logs and the Cribl route.", \
    link="https://splunk.bmosan.com/en-US/app/search/search" \
| convert ctime(started) \
| table severity detection detail run expect tests started host link
description = A weekly Atomic Red Team style test ran and the detection it targets produced no finding: that detection is broken or blind. Posts to Slack through homelab_slack.
dispatch.earliest_time = -100m
dispatch.latest_time = now
cron_schedule = 50 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 24h
alert.suppress.fields = run,expect
action.homelab_slack = 1

# kube-bench (infrastructure_tooling/kube_bench) runs the CIS k3s benchmark on k3s-01 at
# 07:00 UTC on the 1st. This posts its FAIL list, or says it didn't run.
[Kubernetes - CIS benchmark failures]
search = index=security sourcetype=kube-bench earliest=-2h \
| stats count(eval(status=="PASS")) as pass count(eval(status=="FAIL")) as fail count(eval(status=="WARN")) as warn \
    values(eval(if(status=="FAIL", check_id." ".check, null()))) as failed count as lines \
| eval severity=case(lines==0, "high", fail>0, "medium"), host="k3s-01", \
    detection=if(lines==0, "kube-bench did not report this month", "CIS k3s benchmark: ".fail." failing checks"), \
    detail=if(lines==0, "No kube-bench output on k3s-01 in the 2 hours after its monthly run. Check: systemctl status kube-bench.timer kube-bench", \
        "PASS ".pass.", FAIL ".fail.", WARN ".warn.". Failing: ".mvjoin(failed, "; ")), \
    link="https://splunk.bmosan.com/en-US/app/search/search?q=search%20index%3Dsecurity%20sourcetype%3Dkube-bench" \
| where lines==0 OR fail>0 \
| table severity detection detail host link
description = Monthly: the CIS k3s benchmark's failing checks on k3s-01, or a missing run. Posts to Slack through homelab_slack.
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = 30 7 1 * *
enableSched = 1
alert.track = 1
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 1
action.homelab_slack = 1

# Trivy Operator (infrastructure_tooling/trivy_operator) rescans every running workload
# daily; the k3s collector sends a copy of every report every 12 hours. Weekly digest of
# workloads running images with CRITICAL vulnerabilities, newest report per container.
[Trivy - critical vulnerabilities in running images]
search = index=security sourcetype=trivy:vulnerabilityreport earliest=-13h \
| eval ns='metadata.labels.trivy-operator.resource.namespace', workload='metadata.labels.trivy-operator.resource.kind'."/".'metadata.labels.trivy-operator.resource.name', \
    container='metadata.labels.trivy-operator.container.name', image=if(match('report.artifact.tag', "/"), 'report.artifact.tag', 'report.artifact.repository'.":".'report.artifact.tag'), \
    critical=tonumber('report.summary.criticalCount'), high=tonumber('report.summary.highCount') \
| dedup ns workload container \
| where critical>0 \
| sort - critical \
| stats sum(critical) as critical sum(high) as high count as containers list(eval(ns."/".workload." (".image."): ".critical." critical")) as items \
| eval severity="medium", host="k3s-01", detection="Trivy: ".containers." running containers with critical vulnerabilities", \
    detail=critical." critical and ".high." high in total. ".mvjoin(mvindex(items, 0, 14), "; "), \
    link="https://splunk.bmosan.com/en-US/app/search/search?q=search%20index%3Dsecurity%20sourcetype%3Dtrivy%3Avulnerabilityreport" \
| table severity detection detail host link
description = Weekly: running containers on k3s-01 whose images have CRITICAL vulnerabilities (Trivy Operator). Posts to Slack through homelab_slack.
dispatch.earliest_time = -13h
dispatch.latest_time = now
cron_schedule = 0 13 * * 1
enableSched = 1
alert.track = 1
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 1
action.homelab_slack = 1

# A secret (key, token, password) found baked into a running image's filesystem. Debian's
# ssl-cert placeholder key (/etc/ssl/private/ssl-cert-snakeoil.key, generated into images
# that install ssl-cert, e.g. postgres) is not a secret of ours and is left out.
[Trivy - secret found in a running image]
search = index=security sourcetype=trivy:exposedsecretreport earliest=-13h \
| eval ns='metadata.labels.trivy-operator.resource.namespace', workload='metadata.labels.trivy-operator.resource.kind'."/".'metadata.labels.trivy-operator.resource.name', \
    image=if(match('report.artifact.tag', "/"), 'report.artifact.tag', 'report.artifact.repository'.":".'report.artifact.tag'), \
    targets='report.secrets{}.target' \
| dedup ns workload image \
| eval real=mvfilter(NOT match(targets, "/etc/ssl/private/ssl-cert-snakeoil\.key$")), found=coalesce(mvcount(real), 0) \
| where found>0 \
| eval severity="high", host="k3s-01", detection="Trivy: secret found in image ".image, \
    detail=found." secrets in ".image." (".ns."/".workload."), in: ".mvjoin(mvdedup(real), ", ").". Values are not logged; see the ExposedSecretReport in namespace ".ns.".", \
    link="https://splunk.bmosan.com/en-US/app/search/search?q=search%20index%3Dsecurity%20sourcetype%3Dtrivy%3Aexposedsecretreport" \
| table severity detection detail host image link
description = A secret was found in a running image's filesystem (Trivy Operator). Posts to Slack through homelab_slack, once a week per image.
dispatch.earliest_time = -13h
dispatch.latest_time = now
cron_schedule = 30 */6 * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 7d
alert.suppress.fields = image
action.homelab_slack = 1

# Authentik's database backup (infrastructure_tooling/authentik, postgres.backup): a
# nightly CronJob at 02:45 UTC that logs "wrote /backup/authentik-<time>.dump" when a
# dump has been written and checked. Alerts when the last such line is more than 26
# hours old (a failed run, a run that never started, or the job being switched off),
# with the pod's last error line since then if there is one. Looks back 8 days, so
# the newest of the 7 kept dumps is always in range.
[Authentik - database backup failed or missing]
search = index=k8s sourcetype=kube:container k8s.namespace.name=authentik k8s.pod.name="authentik-postgres-backup*" \
| eval ok_time=if(match(_raw, "^wrote /backup/authentik-"), _time, null()), err_time=if(match(_raw, "(?i)error|fatal|failed"), _time, null()) \
| eventstats max(ok_time) as last_ok \
| eval err=if(isnotnull(err_time) AND err_time>coalesce(last_ok, 0), _raw, null()) \
| stats max(ok_time) as last_ok latest(err) as last_error count \
| where isnull(last_ok) OR last_ok<relative_time(now(), "-26h") \
| eval severity="high", host="k3s-01", \
    hours_since=if(isnotnull(last_ok), round((now()-last_ok)/3600), null()), \
    last_backup=coalesce(strftime(last_ok, "%F %T %Z"), "none in 8 days"), \
    detection="Authentik database backup has not succeeded for ".coalesce(hours_since." hours", "8 days or more"), \
    detail="Last good dump: ".last_backup.".".if(isnotnull(last_error), " Last error: ".substr(last_error, 1, 300).".", " No backup pod has logged since.") \
        ." Check: kubectl -n authentik get cronjob,jobs,pods | grep postgres-backup", \
    link="https://splunk.bmosan.com/en-US/app/85_homelab_ops/homelab_ops" \
| table severity detection detail last_backup hours_since host link
description = No Authentik database dump has been written in the last 26 hours. Posts to Slack through homelab_slack.
dispatch.earliest_time = -8d
dispatch.latest_time = now
cron_schedule = 20 4 * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 20h
alert.suppress.fields = severity
action.homelab_slack = 1

# Vault (vault-0 in namespace vault on k3s-01) has one Shamir unseal key, so any
# restart of the pod or the node leaves it sealed until someone unseals it. While it
# is sealed, External Secrets can't refresh and both agent CronJobs fail, so the
# agents can't report it (and "HL - Log source stopped sending" only reaches their
# queue). A sealed Vault writes no audit records at all, which is the main signal:
#   - restart marker: a startup or seal line in Vault's own log (index=audit
#     sourcetype=kube:container) with no unseal line and no audit record after it,
#     at least a minute old; or
#   - silence: no hashicorp_vault_audit_log record for 6 minutes (normally 8 or more
#     every 2 minutes), while k3s container logs are still arriving (k3s-01 and its
#     collector are up) and splunkd has been running for 15 minutes (not catching up).
# Runs every 5 minutes over the last 2 hours, so a seal is reported within about 11
# minutes, and goes quiet as soon as audit records resume. All times are relative to
# the search's own latest time (addinfo), so it can be run over a past window.
# ExternalSecrets failing in the last 15 minutes are shown as corroboration only.
[Vault - sealed]
search = | tstats max(_time) as last_seen where (index=audit sourcetype=hashicorp_vault_audit_log) OR (index=k8s sourcetype=kube:container) by sourcetype \
| eval last_audit=if(sourcetype=="hashicorp_vault_audit_log", last_seen, null()), last_k8s=if(sourcetype=="kube:container", last_seen, null()) \
| append [search index=audit sourcetype=kube:container k8s.namespace.name=vault k8s.container.name=vault \
    | eval restart_time=if(match(_raw, "Vault server started|core: Initializing version history cache|core: security barrier not initialized|core: seal configuration missing|core: marked as sealed|core: pre-seal teardown starting|core: vault is sealed"), _time, null()), \
        unseal_time=if(match(_raw, "core: vault is unsealed|core: post-unseal setup complete"), _time, null()) \
    | stats max(restart_time) as last_restart max(unseal_time) as last_unseal] \
| append [search index=k8s sourcetype=kube:events k8s.object.kind=ExternalSecret k8s.event.reason=UpdateFailed \
    | addinfo | where _time>=info_max_time-900 \
    | eval eso_object='k8s.namespace.name'."/".'k8s.object.name' \
    | stats dc(eso_object) as eso_failing values(eso_object) as eso_objects] \
| append [| rest /services/server/info splunk_server=local | fields startup_time] \
| stats max(last_audit) as last_audit max(last_k8s) as last_k8s max(last_restart) as last_restart max(last_unseal) as last_unseal \
    max(eso_failing) as eso_failing values(eso_objects) as eso_objects max(startup_time) as splunk_started \
| addinfo \
| eval quiet_min=round((info_max_time-coalesce(last_audit, info_min_time))/60, 1), \
    marker=if(isnotnull(last_restart) AND last_restart>coalesce(last_unseal, 0) AND last_restart>coalesce(last_audit, 0) AND last_restart<=info_max_time-60, 1, 0), \
    silent=if(quiet_min>=6 AND last_k8s>=info_max_time-300 AND coalesce(splunk_started, 0)<=info_max_time-900, 1, 0) \
| where marker==1 OR silent==1 \
| eval severity="high", host="k3s-01", eso_failing=coalesce(eso_failing, 0), \
    problem=if(marker==1, "restarted and not unsealed", "no audit records"), \
    last_audit=coalesce(strftime(last_audit, "%F %T %Z"), "none in 2 hours"), \
    detection="Vault is sealed or down: no audit records for ".round(quiet_min)." minutes", \
    detail=if(marker==1, "Vault logged a restart or seal at ".strftime(last_restart, "%T %Z")." and no unseal since. ", "Last audit record: ".last_audit.". ") \
        .if(eso_failing>0, eso_failing." ExternalSecrets failed to sync in the last 15 minutes (".mvjoin(mvindex(eso_objects, 0, 4), ", ")."). ", "") \
        ."While sealed, External Secrets can't refresh and the agent CronJobs fail. Unseal with the key at hand: ssh root@k3s-01 k3s kubectl -n vault exec -it vault-0 -- vault operator unseal", \
    link="https://splunk.bmosan.com/en-US/app/85_homelab_ops/homelab_ops" \
| table severity detection detail problem host last_audit eso_failing link
description = Vault on k3s-01 is sealed (restarted and not unsealed) or down: no audit records for 6 minutes while k3s logs still arrive. Posts to Slack through homelab_slack.
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = 3-59/5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = host
action.homelab_slack = 1

# k3s on k3s-01 (systemd unit k3s.service, Restart=always) exiting or restarting, from
# the node's journald (index=infra sourcetype=linux:journald). systemd.unit is
# _SYSTEMD_UNIT, which is k3s.service on k3s's own lines but not on the lines systemd
# itself writes about the unit, so those are matched on "k3s.service" in the text.
#   - crash (high): k3s logged level=fatal or a panic, or systemd logged an abnormal
#     exit (status 1-255, killed, dumped) or "Failed with result", with no "Stopping
#     k3s.service" before it (a planned stop or reboot). Seen 2026-11-11 06:24 UTC
#     under CPU starvation: "Transaction commit failed", status=1/FAILURE.
#   - restart (medium): k3s started ("Starting k3s v...", "Started k3s.service") with
#     no crash, e.g. after the planned reboot on 2026-11-12 02:26 UTC; the card says
#     whether a host boot (kernel "Linux version" line) came first.
# The OTel collector's Kubernetes-events receiver does not recover from an API
# restart, so every card says to restart it. Runs every 10 minutes over 15; repeats
# of the same kind are suppressed for 30 minutes.
[Kubernetes - k3s crashed or restarted]
search = index=infra sourcetype=linux:journald host=k3s-01 ((syslog.identifier=k3s ("level=fatal" OR "panic" OR "Starting k3s")) OR (syslog.identifier=systemd "k3s.service") OR (syslog.identifier=kernel "Linux version")) \
| eval ident='syslog.identifier', \
    stop_time=if(ident=="systemd" AND match(_raw, "^Stopping k3s\.service"), _time, null()), \
    fatal=if(ident=="k3s" AND match(_raw, "level=fatal|^panic:"), _raw, null()), \
    exit_line=if(ident=="systemd" AND match(_raw, "^k3s\.service: (Main process exited, code=(killed|dumped|exited, status=[1-9])|Failed with result)"), _raw, null()), \
    fault_time=if(isnotnull(fatal) OR isnotnull(exit_line), _time, null()), \
    start_time=if((ident=="k3s" AND match(_raw, "Starting k3s v")) OR (ident=="systemd" AND match(_raw, "^Started k3s\.service")), _time, null()), \
    boot_time=if(ident=="kernel" AND match(_raw, "^Linux version"), _time, null()) \
| stats min(stop_time) as first_stop min(fault_time) as first_fault latest(fatal) as fatal latest(exit_line) as exit_line \
    max(start_time) as last_start max(boot_time) as last_boot \
| eval crash=if(isnotnull(first_fault) AND (isnull(first_stop) OR first_fault<first_stop), 1, 0) \
| where crash==1 OR isnotnull(last_start) \
| eval severity=if(crash==1, "high", "medium"), host="k3s-01", problem=if(crash==1, "crash", "restart"), \
    started=coalesce(strftime(last_start, "%T %Z"), "not yet"), \
    detection=if(crash==1, "k3s crashed on k3s-01".if(isnotnull(last_start), " and systemd restarted it", ", no restart seen yet"), \
        "k3s restarted on k3s-01".if(isnotnull(last_boot), " after a host boot", ", clean start")), \
    detail=if(crash==1, "Exited at ".strftime(first_fault, "%T %Z").". ".if(isnotnull(fatal), "k3s: ".substr(fatal, 1, 250).". ", "").coalesce("systemd: ".exit_line.". ", "") \
            ."Check CPU and memory on k3s-01 and: ssh root@k3s-01 journalctl -u k3s --since -1h. ", \
        "k3s started at ".started.if(isnotnull(last_boot), " after the host booted at ".strftime(last_boot, "%T %Z"), " with no crash logged (manual restart?)").". ") \
        ."Restart the OTel collector, whose Kubernetes-events receiver does not recover from an API restart: kubectl -n otel-collector rollout restart ds/otel-collector-opentelemetry-collector-agent", \
    link="https://splunk.bmosan.com/en-US/app/85_homelab_ops/homelab_ops" \
| table severity detection detail problem host started link
description = k3s on k3s-01 crashed (fatal, panic or abnormal exit) or restarted (clean start or host boot). Posts to Slack through homelab_slack.
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = 7-59/10 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = problem
action.homelab_slack = 1

# External Secrets (index=k8s kube:events, kind ExternalSecret): an object whose
# UpdateFailed events ("could not get secret data from provider") have gone on for
# 30 minutes with no Updated ("secret updated") since, and the latest within the last
# 30 minutes (still failing; retries back off to about 15 minutes), at least 3 of
# them. Refreshes are hourly, so a short Vault seal (authentik-credentials and
# cribl-mcp failed for 2 minutes on 2026-11-12) doesn't alert; a missing Vault path
# (toolhive-mcp/unifi-network-mcp, 17 failures in an hour on 2026-11-11) does. One
# card per object, every 6 hours; 3 or more failing at once is one card for all of
# them, as that is the store or Vault (see "Vault - sealed"), not each object. No
# ClusterSecretStore or SecretStore events were seen in index=k8s, so stores aren't
# covered here.
[Kubernetes - External Secrets failing to sync]
search = index=k8s sourcetype=kube:events k8s.object.kind=ExternalSecret k8s.event.reason IN (UpdateFailed, Updated) \
| eval object='k8s.namespace.name'."/".'k8s.object.name', fail_time=if('k8s.event.reason'=="UpdateFailed", _time, null()), ok_time=if('k8s.event.reason'=="Updated", _time, null()) \
| eventstats max(ok_time) as last_ok by object \
| where isnotnull(fail_time) AND fail_time>coalesce(last_ok, 0) \
| stats min(fail_time) as first_fail max(fail_time) as last_fail count as failures latest(_raw) as message max(last_ok) as last_ok by object \
| addinfo \
| where failures>=3 AND first_fail<=info_max_time-1800 AND last_fail>=info_max_time-1800 \
| eventstats count as failing \
| eval object=if(failing>=3, "all ExternalSecrets", object), name=object \
| stats min(first_fail) as first_fail sum(failures) as failures latest(message) as message max(last_ok) as last_ok values(name) as names max(failing) as failing max(info_max_time) as info_max_time by object \
| eval severity="high", host="k3s-01", problem="sync failing", count=failures, \
    minutes=round((info_max_time-first_fail)/60), \
    detection=if(failing>=3, failing." ExternalSecrets have failed to sync for ".minutes." minutes", "ExternalSecret ".object." has failed to sync for ".minutes." minutes"), \
    detail=failures." UpdateFailed events since ".strftime(first_fail, "%F %T %Z").", no successful sync since (last: ".coalesce(strftime(last_ok, "%F %T %Z"), "none in 4 hours")."). Last message: ".substr(message, 1, 200).". " \
        .if(failing>=3, "All at once usually means Vault is sealed or unreachable, or the ClusterSecretStore's login broke. Failing: ".mvjoin(mvindex(names, 0, 9), ", ").". Check: kubectl get clustersecretstore; kubectl get externalsecret -A", \
            "Usually the Vault path or key it reads doesn't exist. Check: kubectl -n ".mvindex(split(object, "/"), 0)." describe externalsecret ".mvindex(split(object, "/"), 1)), \
    link="https://splunk.bmosan.com/en-US/app/85_homelab_ops/homelab_ops" \
| table severity detection detail problem object count host link
description = An ExternalSecret has failed to sync from its provider for 30 minutes with no success since (3 or more at once are one card). Posts to Slack through homelab_slack.
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 11,26,41,56 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = object
action.homelab_slack = 1
