# Watchdog for the homelab agents (infrastructure_tooling/homelab_agents: two
# Kubernetes CronJobs on k3s-01, homelab-agent-sec and homelab-agent-ops). The agents
# post their own findings and their own run failures to Slack, but a run that never
# starts (cluster down, CronJob suspended, image can't be pulled, pod can't be
# scheduled) can't report itself. This is the one Splunk search that posts to Slack
# directly (homelab_slack action, 85_detections).
#
# Problems, per agent:
#   - no run for more than 75 minutes (runs are every 30), from the run log in index=ai_agents
#   - every run in the last hour failed (Vault, gateway or HEC problem)
#   - every triage in the last hour failed (Claude token expired or revoked, API down)
#   - Kubernetes warnings in the last hour for the agent's CronJob, Jobs or pods
#     (index=k8s kube:events: BackoffLimitExceeded, DeadlineExceeded, ErrImagePull,
#     FailedMount, FailedScheduling, ...), which also say *why* a run didn't happen
[Agents - not running or failing]
search = | makeresults | eval agent=split("sec,ops", ",") | mvexpand agent | fields agent \
| join type=left agent [search index=ai_agents sourcetype=homelab:agent kind=run earliest=-24h | stats max(_time) as last_run by agent] \
| join type=left agent [search index=ai_agents sourcetype=homelab:agent kind=run earliest=-65m \
    | stats count as runs sum(eval(if(status="error",1,0))) as failed_runs sum(triaged) as triaged sum(triage_errors) as triage_errors latest(error) as last_error by agent] \
| join type=left agent [search index=k8s sourcetype=kube:events k8s.namespace.name=toolhive-clients otel.log.severity.text=Warning earliest=-65m \
    | rex field=k8s.object.name "^homelab-agent-(?<agent>sec|ops)" | where isnotnull(agent) \
    | stats values(k8s.event.reason) as k8s_reasons latest(_raw) as k8s_message by agent] \
| fillnull value=0 runs failed_runs triaged triage_errors \
| eval minutes_since=if(isnull(last_run), null(), round((now()-last_run)/60)) \
| eval problem=case(isnull(last_run), "no run in the last 24 hours", \
    minutes_since>75, "no run for ".minutes_since." minutes", \
    runs>0 AND failed_runs==runs, "every run in the last hour failed", \
    triage_errors>0 AND triaged==0, "every triage in the last hour failed", \
    isnotnull(k8s_reasons), "Kubernetes warnings: ".mvjoin(k8s_reasons, ", "), \
    true(), null()) \
| where isnotnull(problem) \
| eval problem_type=case(match(problem, "^no run"), "not running", match(problem, "every run"), "runs failing", \
    match(problem, "every triage"), "triage failing", true(), "kubernetes warnings") \
| eval agent=if(agent=="sec", "Security agent", "Ops agent"), severity="high", \
    detection=agent." is not working", \
    detail=problem.if(isnotnull(last_error), ". Last error: ".last_error, "") \
        .if(isnotnull(k8s_reasons) AND NOT match(problem, "^Kubernetes"), ". Kubernetes: ".mvjoin(k8s_reasons, ", "), "") \
        .if(isnotnull(k8s_message), " (".k8s_message.")", "") \
        .". Check: kubectl -n toolhive-clients get cronjobs,jobs,pods -l app.kubernetes.io/name=homelab-agents", \
    last_run=coalesce(strftime(last_run, "%F %T %Z"), "none in 24h"), \
    link="https://security-tooling-01.tail25c6fe.ts.net:8000/en-US/app/85_homelab_ops/homelab_ops" \
| table agent severity detection detail problem problem_type last_run runs link
description = A homelab agent hasn't run for 75 minutes, every run or triage in the last hour failed, or Kubernetes reported warnings for its CronJob. Posts to Slack through homelab_slack.
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 5,35 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = agent,problem_type
action.homelab_slack = 1
