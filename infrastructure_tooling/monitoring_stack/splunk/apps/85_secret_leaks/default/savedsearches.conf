# Backstop for Cribl's secret masking (splunk_out + secret_mask, issue #201).
# Looks for high-confidence credential formats that are still unmasked in the last
# hour. Results show where (index, sourcetype, host) and which format, never the
# value. If it fires: rotate the credential, add or fix the Cribl rule and a
# must-mask test case, then remove the events (| delete, needs can_delete).
[Secret leak - unmasked credential in indexed events]
search = index=* index!=_* \
| eval format=case(\
    match(_raw, "-----BEGIN [A-Z ]*PRIVATE KEY"), "private key", \
    match(_raw, "\btskey-[A-Za-z0-9-]{10,}"), "tailscale key", \
    match(_raw, "\b(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_\w{40,})"), "github token", \
    match(_raw, "\b(AKIA|ASIA)[0-9A-Z]{16}\b"), "aws key id", \
    match(_raw, "\bxox[abprs]-[A-Za-z0-9-]{10,}"), "slack token", \
    match(_raw, "\bsk-(ant-|proj-)?[A-Za-z0-9_-]{30,}"), "ai api key", \
    match(_raw, "\bhv[sbr]\.[A-Za-z0-9_-]{20,}"), "vault token", \
    match(_raw, "\beyJhIjoi[A-Za-z0-9+/=_-]{40,}"), "cloudflare tunnel token", \
    match(_raw, "(?i)\b[a-z][a-z0-9+.-]*://[^\s:@/\"']+:(?!\[REDACTED)[^\s@/\"']{4,}@"), "url password", \
    match(_raw, "(?i)(password|passwd|secret|api[_-]?key)[\"']?\s*[:=]\s*[\"']?(?!\[REDACTED|hmac-sha256:|true\b|false\b|null\b)[^\s\"'&,;]{8,}"), "key/value secret") \
| where isnotnull(format) \
| stats count min(_time) as first_seen max(_time) as last_seen by format index sourcetype host \
| convert ctime(first_seen) ctime(last_seen)
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
cron_schedule = 7 * * * *
enableSched = 1
schedule_window = 10
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = format,index,host
alert.digest_mode = 0
action.homelab_slack = 1
description = Credential formats still unmasked after Cribl's splunk_out pipeline. Shows where and which format, never the value.
