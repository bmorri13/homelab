# Lookups for the HL - detections. The CSVs are in lookups/, kept in git and synced by
# deploy.sh with --delete: edit them in the repo, never in Splunk Web. See the Splunk
# README, Detections.

# Indicators from published advisories (indicator,type,source,context,added,expires).
# type is ip or domain; a row is ignored from its expires date on (hl_ti_active).
[hl_threat_indicators]
filename = hl_threat_indicators.csv
case_sensitive_match = false

# Services with a DNS signal of their own (domain,category,note).
[hl_dns_watch_domains]
filename = hl_dns_watch_domains.csv
case_sensitive_match = false

# Written on the Splunk host by hl-threat-feeds.service (scripts/threat-feeds.py), every
# 6 hours, and not in git: deploy.sh leaves lookups/hl_ti_feed_* alone. README,
# Detections, Threat-intel feeds.
# abuse.ch ThreatFox, URLhaus and Feodo Tracker (indicator,type,source,context,added,
# expires): the same columns as hl_threat_indicators, one row per indicator.
[hl_ti_feed_indicators]
filename = hl_ti_feed_indicators.csv
case_sensitive_match = false

# CISA Known Exploited Vulnerabilities (cve,vendor,product,name,date_added,due_date,
# ransomware: Known or Unknown).
[hl_ti_feed_kev]
filename = hl_ti_feed_kev.csv
case_sensitive_match = false
