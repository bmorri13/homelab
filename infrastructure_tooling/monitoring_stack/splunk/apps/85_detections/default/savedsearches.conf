# Generated by build_detections.py; edit that, not this file.
# Every stanza is a MITRE ATT&CK v20 detection. Findings go to index=security
# (sourcetype homelab:detection) and to Slack.

[default]
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
cron_schedule = */15 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
action.logevent = 1
action.logevent.param.index = security
action.logevent.param.sourcetype = homelab:detection
action.logevent.param.source = $name$
action.logevent.param.host = $result.host$
action.logevent.param.event = $result.finding$
action.homelab_slack = 1

[HL - Kubernetes exec, attach or port-forward into a pod]
description = ATT&CK v20 T1609 (Execution), strategy DET0065. Someone ran a command in, attached to, or port-forwarded into a pod. ARC runner pods are excluded: in Kubernetes mode the runner execs job steps by design. Test: kubectl -n <scratch> exec <pod> -- true
search = `hl_k8s_audit` objectRef.subresource IN (exec, attach, portforward) | where NOT `hl_k8s_platform_user` AND NOT match('user.username', "^system:serviceaccount:arc-runners:") | eval user='user.username', src=mvindex('sourceIPs{}', 0), object=coalesce('objectRef.namespace'."/", "").'objectRef.resource'.coalesce("/".'objectRef.name', "").coalesce("/".'objectRef.subresource', "") | stats count min(_time) as first_seen max(_time) as last_seen values(verb) as verbs values(userAgent) as agents values(responseStatus.code) as codes by user src object | eval host="k3s-01", detail="verbs=".mvjoin(verbs, ",")." codes=".mvjoin(codes, ",")." user_agent=".mvjoin(agents, ",") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Kubernetes exec, attach or port-forward into a pod", "T1609", "Execution", "high", "DET0065")`
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
cron_schedule = */15 * * * *
alert.severity = 4
alert.suppress.fields = user,src,object
alert.suppress.period = 4h

