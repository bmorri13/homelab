[HL - Web authentication failures from a client]
description = ATT&CK v20 T1110 (Credential Access), strategy none. One client got 20 or more 401 or 403 responses from one host's backend in 15 minutes: passwords, tokens or API keys being guessed against Vault, the MCP gateway, Authentik, Splunk or Cribl. Refusals by Traefik's tailnet allowlist are not counted (see HL - Web scanning from a client). Authentik's own login failures have their own detections. Test: from a tailnet client: for i in $(seq 25); do curl -sk -o /dev/null -H 'X-Vault-Token: hl-test' https://vault.bmosan.com/v1/kv/data/hl-test; done
search = index=network sourcetype=traefik:access NOT RouterName="*@internal" | eval src=coalesce(ClientHost, "unknown"), site=coalesce(RequestHost, "(none)"), raw_path=lower(coalesce(RequestPath, "")), path=lower(coalesce(urldecode(RequestPath), RequestPath, "")), ua=coalesce('request_User-Agent', ""), status=tonumber(DownstreamStatus), origin_status=coalesce(tonumber(OriginStatus), 0), router=coalesce(RouterName, "(no router)"), claimed_ip='request_Cf-Connecting-Ip' | where NOT `hl_web_scanner_allowed` | where in(status, 401, 403) AND origin_status>0 | eval request=RequestMethod." ".replace(path, "\?.*$", "") | stats count values(status) as statuses values(request) as requests dc(request) as distinct_requests values(ua) as agents values(claimed_ip) as claimed min(_time) as first_seen max(_time) as last_seen by src site | where count>=20 | eval host="traefik", user="", object=site, detail=count." responses ".mvjoin(statuses, "/")." from the backend for ".distinct_requests." distinct requests, e.g. ".mvjoin(mvindex(requests, 0, 4), ", ")."; user_agent=".coalesce(mvjoin(mvindex(agents, 0, 2), " | "), "none").if(isnotnull(claimed), "; claimed client IP (Cf-Connecting-Ip, unverified)=".mvjoin(mvindex(claimed, 0, 2), ","), "") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Web authentication failures from a client", "T1110", "Credential Access", "medium", "")`
