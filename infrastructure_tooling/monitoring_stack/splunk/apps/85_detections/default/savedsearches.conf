description = ATT&CK v20 T1078.004 (Initial Access), strategy none. A login to the Cloudflare account (SSO_LOGIN or LOGIN in the audit log, success or failure) from an address not seen for that user in the previous 30 days; high when the country is new too (iplocation). A home address that changes after an ISP lease renewal also shows here, once. Test: log in to the Cloudflare dashboard from a network you have not used in 30 days (a phone hotspot)
search = `hl_cf_audit_window(-30d@d, -25m@m)` | where match(cf_desc, "(?i)^(sso_)?login") AND src!="" | iplocation src | eval hl_country=coalesce(nullif(Country, ""), "unknown") | eventstats min(_time) as hl_ip_first by cf_actor src | eventstats min(_time) as hl_country_first by cf_actor hl_country | eventstats min(_time) as hl_data_start | where _time>=relative_time(now(), "-40m@m") AND hl_ip_first>=relative_time(now(), "-40m@m") AND hl_data_start<relative_time(now(), "-1d") | eval hl_severity=if(hl_country_first>=relative_time(now(), "-40m@m"), "high", "medium"), hl_rank=if(hl_severity=="high", 2, 1), user=cf_actor, object="cloudflare dashboard" | stats count min(_time) as first_seen max(_time) as last_seen values(cf_desc) as actions values(cf_result) as results values(hl_country) as countries max(hl_rank) as hl_rank by user src object | eval hl_severity=if(hl_rank==2, "high", "medium"), host="cloudflare", detail="first login from this address in 30 days, country=".mvjoin(countries, ",").if(hl_severity=="high", " (new country)", "")." actions=".mvjoin(actions, ",")." results=".mvjoin(results, ",") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Cloudflare dashboard login from a new IP or country", "T1078.004", "Initial Access", "medium", "")`
