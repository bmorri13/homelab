[HL - MCP gateway write tool, denial or new client]
description = ATT&CK v20 T1078 (Initial Access), strategy DET0927. Through the MCP gateway: a call that was denied or failed authorization, a write-capable tool (pipeline, notebook, firewall or device changes), or the first call from a client identity in 30 days. ATT&CK v20 has no detection strategy for agent tool abuse; DET0927 (AI-enabled exfiltration, SaaS analytic) is the closest. Test: call a tool through the gateway with a token whose policy denies it
search = index=audit sourcetype=toolhive:vmcp:audit earliest=-30d@d latest=-5m@m | eval user='subjects.user_id', tool='target.name', src='source.value' | eventstats min(_time) as user_first by user | where _time>=relative_time(now(), "-20m@m") | eval reason=case(outcome!="success", "outcome=".outcome, match(tool, "(?i)(set|update|delete|create|add|remove|edit|block|unblock|reboot|toggle|apply|restart|upgrade|authorize)"), "write-capable tool", user_first>=relative_time(now(), "-20m@m"), "first call from this client in 30 days") | where isnotnull(reason) | stats count min(_time) as first_seen max(_time) as last_seen values(tool) as tools values(reason) as reasons by user src | eval host="k3s-01", object=mvjoin(mvindex(tools, 0, 9), ","), detail=mvjoin(reasons, "; ") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - MCP gateway write tool, denial or new client", "T1078", "Initial Access", "medium", "DET0927")`
dispatch.earliest_time = -20m@m
