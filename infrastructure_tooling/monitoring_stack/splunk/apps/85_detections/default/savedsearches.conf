description = ATT&CK v20 T1071.004 (Command and Control), strategy DET0400. One client asked for many distinct long subdomains of one domain, or many distinct TXT/NULL names, in 15 minutes: the shape of DNS tunnelling or exfiltration. A legitimate chatty domain (reputation lookups, DNSBLs) goes in the hl_dns_chatty_domain macro; reverse lookups (.arpa) are already there. Test: from a client that uses AdGuard, look up 25 different random 40-character names under a domain you own (they fail, which is fine)
