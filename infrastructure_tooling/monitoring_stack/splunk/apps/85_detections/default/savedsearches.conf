[HL - DNS lookup of a data-drop or callback service]
description = ATT&CK v20 T1567.004 (Exfiltration), strategy none. A client looked up a service from hl_dns_watch_domains.csv that malware and intrusion tools use to move data or prove a blind exploit worked: request-capture webhooks (T1567.004, high), out-of-band callback servers such as Interactsh and Burp Collaborator (T1071.004, high), paste sites (T1102), anonymous file drops (T1567.002), ad-hoc tunnels such as ngrok and Cloudflare quick tunnels (T1572), and the Tor Project (T1090.003); the finding's technique and severity follow the category. One finding per client and category. Known-good client and name pairs, such as a security scanner that uses OOB callbacks, go in the hl_dns_watch_allowed macro on the Splunk host. Test: from a client that uses AdGuard: dig webhook.site
search = index=network sourcetype=adguard:querylog | eval qname=replace(replace(lower(QH), "\.$", ""), "\.tail[0-9a-f]+\.ts\.net$", "") | rex field=qname "(?<domain>[^.]+\.(?:(?:co|com|net|org|gov|edu|ac)\.[a-z]{2}|[^.]+))$" | eval subdomain=if(len(qname)>len(domain), substr(qname, 1, len(qname)-len(domain)-1), ""), src=coalesce(IP, "unknown") | where isnotnull(domain) AND NOT `hl_dns_chatty_domain` | `hl_dns_name_candidates` | lookup hl_dns_watch_domains domain AS hl_cand OUTPUT domain AS watch_domain | where isnotnull(watch_domain) | mvexpand watch_domain | lookup hl_dns_watch_domains domain AS watch_domain OUTPUT category AS watch_category | where in(watch_category, "webhook", "callback", "paste", "filedrop", "tunnel", "tor") AND NOT `hl_dns_watch_allowed` | stats count min(_time) as first_seen max(_time) as last_seen values(watch_domain) as domains values(qname) as names by src watch_category | eval hl_technique=case(watch_category=="webhook", "T1567.004", watch_category=="callback", "T1071.004", watch_category=="paste", "T1102", watch_category=="filedrop", "T1567.002", watch_category=="tunnel", "T1572", watch_category=="tor", "T1090.003"), hl_tactic=case(watch_category=="webhook", "Exfiltration", watch_category=="callback", "Command and Control", watch_category=="paste", "Command and Control", watch_category=="filedrop", "Exfiltration", watch_category=="tunnel", "Command and Control", watch_category=="tor", "Command and Control"), hl_severity=case(watch_category=="webhook", "high", watch_category=="callback", "high", watch_category=="paste", "medium", watch_category=="filedrop", "medium", watch_category=="tunnel", "medium", watch_category=="tor", "medium"), label=case(watch_category=="webhook", "request-capture (webhook) service", watch_category=="callback", "out-of-band callback service", watch_category=="paste", "paste site", watch_category=="filedrop", "anonymous file-upload service", watch_category=="tunnel", "ad-hoc tunnel service", watch_category=="tor", "Tor download or gateway") | eval host="adguard", user="", object=watch_category, detail=count." lookups of a ".label." (".mvjoin(domains, ", ")."); names: ".mvjoin(mvindex(names, 0, 4), " ") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - DNS lookup of a data-drop or callback service", "T1567.004", "Exfiltration", "medium", "")`
