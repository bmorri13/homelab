description = ATT&CK v20 T1098.001 (Persistence), strategy none. An API token was created, rolled, changed or deleted, or the Global API Key was viewed or rolled. A token is a credential that outlives a password change, and Cloudflare holds DNS, tunnels and Zero Trust for every public site. object is the token name, and the detail lists its permission groups. Creating one logs twice (Create Token and TOKEN_CREATE); both are in one finding. Test: in the Cloudflare dashboard, create a read-only API token hl-test (Account API Tokens), then delete it
