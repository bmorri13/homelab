[HL - Host stopped sending telemetry]
description = ATT&CK v20 T1685 (Defense Impairment), strategy DET0497. A host that sent metrics in the last 24 hours has sent none for 15 minutes: powered off, collector stopped, or network cut. An attacker stopping telemetry looks the same as an outage, so both are reported. Test: systemctl stop otelcol-contrib on a test host for 20 minutes
search = | mstats count(system.uptime) as c where index=metrics earliest=-24h latest=now span=1m by host | stats max(_time) as last_seen min(_time) as first_seen by host | where last_seen<relative_time(now(), "-15m") | eval user="", src="", object="otel agent", count=round((now()-last_seen)/60), detail="no host metrics for ".count." minutes" | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Host stopped sending telemetry", "T1685", "Defense Impairment", "high", "DET0497")`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
alert.severity = 4
alert.suppress.fields = host
alert.suppress.period = 6h
