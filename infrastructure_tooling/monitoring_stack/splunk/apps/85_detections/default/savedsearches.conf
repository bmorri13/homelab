[HL - Sensitive command run over SSH or sudo]
description = ATT&CK v20 T1685 (Defense Impairment), strategy DET0497. A command that stops security tooling, touches authorized_keys or cron, writes to auth config (PAM, sudoers, sshd_config; reading them is not flagged), changes accounts, flushes the firewall, clears logs or history, or pipes a download into a shell. Covers T1685 (and T1685.006 log clearing), T1053.003, T1098.004, T1136.001, T1059.004. Your own admin work will match; tune by adding exclusions, not by widening the window. Test: ssh root@<test-vm> 'crontab -l; journalctl --rotate'
search = index=infra sourcetype=linux_secure (eventtype=homelab_tailscale_ssh_command OR app=sudo) | eval cmd=coalesce(command, process) | regex cmd="(?i)(systemctl\s+(stop|disable|mask)\s+\S*(falco|otelcol|tailscaled|auditd|cribl|splunk)|authorized_keys|crontab\s+(-e|-r|\S+\.\w+)|(sed\s+-i|tee|>|vi|vim|nano|cp|mv)\s*[^;|]*/etc/(pam\.d|sudoers|ssh/sshd_config)|\b(iptables|nft|ufw)\s+(-F|flush|disable|-X)|history\s+-c|journalctl\s+--(vacuum|rotate)|(truncate|shred|rm)\s+[^;|]*?/var/log|unset\s+HISTFILE|useradd|usermod|userdel|passwd\s|chpasswd|curl[^|;]*\|\s*(ba)?sh|wget[^|;]*\|\s*(ba)?sh|base64\s+-d[^|;]*\|\s*(ba)?sh|nc\s+-[a-z]*e\s)" | eval user=coalesce(ts_user, user), src=coalesce(src, "local") | stats count min(_time) as first_seen max(_time) as last_seen values(cmd) as cmds by host user src | eval object="command", detail=mvjoin(mvindex(cmds, 0, 4), " || ") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Sensitive command run over SSH or sudo", "T1685", "Defense Impairment", "medium", "DET0497")`
