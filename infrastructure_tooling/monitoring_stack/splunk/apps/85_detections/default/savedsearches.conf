description = ATT&CK v20 T1071 (Command and Control), strategy none. An IP address from hl_threat_indicators.csv (published advisories, ignored after each row's expires date) appeared in any event: an SSH or login source, a honeypot connection, a firewall or proxy line, a pod log. The detail names the advisory and what the address was used for. Advisories warn that addresses get reassigned, so corroborate before acting. Not searched: the agents' run log and gateway, and homelab:detection. Test: on a monitored host: logger 'hl-test threat indicator 198.51.100.73' (the art_validation canary row, an RFC 5737 documentation address)
