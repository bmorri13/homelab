[HL - Web host reached on a new path]
description = ATT&CK v20 T1190 (Initial Access), strategy none. A backend answered (2xx or 3xx) a request for a path prefix (first two segments) or a router on one host that had not been answered in the previous 14 days: a new endpoint in use, a new route, or someone exploring an app after getting in. Low severity, for context; a host with less than 7 days of access logs is skipped. Test: after the first 7 days of access logs: from a tailnet client, open a page of https://vault.bmosan.com that hasn't been used in 14 days (for example /v1/sys/seal-status)
search = earliest=-14d@d latest=-5m@m index=network sourcetype=traefik:access NOT RouterName="*@internal" | eval src=coalesce(ClientHost, "unknown"), site=coalesce(RequestHost, "(none)"), raw_path=lower(coalesce(RequestPath, "")), path=lower(coalesce(urldecode(RequestPath), RequestPath, "")), ua=coalesce('request_User-Agent', ""), status=tonumber(DownstreamStatus), origin_status=coalesce(tonumber(OriginStatus), 0), router=coalesce(RouterName, "(no router)"), claimed_ip='request_Cf-Connecting-Ip' | where NOT `hl_web_scanner_allowed` | where status>=200 AND status<400 AND origin_status>0 | eval uri=replace(path, "\?.*$", "") | rex field=uri "^(?<prefix>/[^/]*(/[^/]*)?)" | eval prefix=replace(coalesce(prefix, "/"), "/([0-9a-f-]{8,}|[0-9]+)(?=/|$)", "/*") | eventstats min(_time) as site_first by site | where site_first<=relative_time(now(), "-7d@d") | stats count min(_time) as first_seen max(_time) as last_seen values(src) as srcs values(RequestMethod) as methods values(uri) as uris by site router prefix | where first_seen>=relative_time(now(), "-20m@m") | eval host="traefik", user="", src=mvjoin(mvindex(srcs, 0, 2), ","), object=site.prefix, detail="first answered request in 14 days for ".site.prefix." (router ".router."): ".count." requests, methods=".mvjoin(methods, ",")."; e.g. ".mvjoin(mvindex(uris, 0, 2), " ") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Web host reached on a new path", "T1190", "Initial Access", "low", "")`
