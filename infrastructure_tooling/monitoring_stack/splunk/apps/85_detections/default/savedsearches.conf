[HL - Kubernetes anonymous or denied API requests]
description = ATT&CK v20 T1613 (Discovery), strategy DET0490. Anonymous API requests, or five or more rejected (401, which has no user: anonymous auth is off on k3s) or denied (403) requests from one identity and source in 15 minutes: API scanning or a misused credential. Test: curl -sk https://k3s-01:6443/api/v1/namespaces/default/secrets (no token)
search = `hl_k8s_audit` (user.username="system:anonymous" OR responseStatus.code IN (401, 403)) | eval user=coalesce('user.username', "(unauthenticated)"), src=mvindex('sourceIPs{}', 0), object=coalesce('objectRef.resource', 'requestURI') | stats count min(_time) as first_seen max(_time) as last_seen values(object) as objects values(responseStatus.code) as codes values(userAgent) as agents by user src | where count>=5 OR user="system:anonymous" | eval host="k3s-01", object=mvjoin(mvindex(objects, 0, 9), ","), detail="codes=".mvjoin(codes, ",")." user_agent=".mvjoin(agents, ",") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Kubernetes anonymous or denied API requests", "T1613", "Discovery", "medium", "DET0490")`
