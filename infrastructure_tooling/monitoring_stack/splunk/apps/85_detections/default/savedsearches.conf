[HL - Proxmox login failures]
description = ATT&CK v20 T1110.001 (Credential Access), strategy DET0551. Failed logins to the Proxmox web UI or API. Nothing logs in with a password routinely (Terraform and Packer use API tokens), so one failure is reported. Test: curl -sk https://proxmox3:8006/api2/json/access/ticket -d username=root@pam -d password=wrong
search = index=infra (pvedaemon OR pveproxy) "authentication failure" | rex "rhost=(?<rhost>\S+)" | rex "user=(?<pve_user>\S+)" | eval src=coalesce(rhost, src), user=coalesce(pve_user, user) | stats count min(_time) as first_seen max(_time) as last_seen values(host) as hosts by src user | eval host=mvjoin(hosts, ","), object="proxmox login", detail=count." failed logins" | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Proxmox login failures", "T1110.001", "Credential Access", "high", "DET0551")`
