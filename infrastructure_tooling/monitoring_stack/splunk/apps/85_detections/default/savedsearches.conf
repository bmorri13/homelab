[HL - Cloudflare DNS record changed]
description = ATT&CK v20 T1584.001 (Resource Development), strategy none. A DNS record was created, changed or deleted on any zone, by a person, an API token or Cloudflare itself. High for NS or MX records, and for a record changed to point at a target not seen in a DNS change in 30 days (a hijacked name looks like that). ACME challenge TXT records (cert-manager, Proxmox, Cloudflare's own certificates) are left out. Test: in the Cloudflare dashboard, add a TXT record hl-test with any text to a zone, then delete it (medium); point an existing test record at a new address (high)
search = `hl_cf_audit_window(-30d@d, -25m@m)` | where cf_result=="success" AND cf_type!="view" AND (cf_product=="dns_records" OR (cf_product=="dns" AND cf_rtype=="record")) | eval hl_rec_id=coalesce('resource.response.id', 'resource.id', 'resource.value.id'), hl_names=mvdedup(mvappend('resource.response.name', 'resource.value.name', 'resource.response.posts{}.name', 'resource.response.patches{}.name', 'resource.response.puts{}.name', 'resource.response.deletes{}.name')), hl_types=mvdedup(mvappend('resource.response.type', 'resource.value.type', 'resource.response.posts{}.type', 'resource.response.patches{}.type', 'resource.response.puts{}.type', 'resource.response.deletes{}.type')), hl_contents=mvdedup(mvappend('resource.response.content', 'resource.value.content', 'resource.response.posts{}.content', 'resource.response.patches{}.content', 'resource.response.puts{}.content')), hl_repoint=if(cf_type=="update" OR isnotnull('resource.response.patches{}.name') OR isnotnull('resource.response.puts{}.name'), 1, 0) | eventstats values(hl_names) as hl_known_names values(hl_types) as hl_known_types by hl_rec_id | eval hl_names=coalesce(hl_names, hl_known_names), hl_types=coalesce(hl_types, hl_known_types), hl_content1=mvindex(hl_contents, 0) | eventstats min(_time) as hl_content_first by hl_content1 | where _time>=relative_time(now(), "-40m@m") | where NOT (mvjoin(hl_types, ",")=="TXT" AND match(mvjoin(hl_names, " "), "^_acme-challenge\.\S+( _acme-challenge\.\S+)*$")) | where NOT `hl_cf_expected_change` | eval hl_severity=if(match(mvjoin(hl_types, ","), "\b(NS|MX)\b") OR (hl_repoint==1 AND isnotnull(hl_content1) AND hl_content_first>=relative_time(now(), "-40m@m")), "high", "medium"), hl_rank=if(hl_severity=="high", 2, 1), user=cf_actor, object=cf_zone.": ".coalesce(mvjoin(hl_types, ","), "?")." ".coalesce(mvjoin(mvindex(hl_names, 0, 4), ","), "record ".hl_rec_id), hl_change=case(isnotnull('resource.response.deletes{}.name'), "delete", hl_repoint==1, "update", true(), cf_type).if(isnotnull(hl_contents), " -> ".mvjoin(mvindex(hl_contents, 0, 2), ","), "") | stats count min(_time) as first_seen max(_time) as last_seen values(cf_desc) as actions values(hl_change) as changes values(cf_via) as via max(hl_rank) as hl_rank by user src object | eval hl_severity=if(hl_rank==2, "high", "medium"), host="cloudflare", detail="changes=".mvjoin(mvindex(changes, 0, 4), "; ")." actions=".mvjoin(actions, "; ")." via=".mvjoin(via, ",") | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Cloudflare DNS record changed", "T1584.001", "Resource Development", "medium", "")`
