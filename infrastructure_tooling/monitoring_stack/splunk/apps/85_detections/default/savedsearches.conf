[HL - Log source stopped sending]
description = ATT&CK v20 T1685 (Defense Impairment), strategy DET0497. A log feed that normally never goes quiet for long (k3s API audit, Vault audit, k3s container logs, each host's journald, the UniFi gateway's syslog, the AdGuard DNS query log) has sent nothing past its limit while its host is still up. Turning audit logging off looks like this, and so does a broken pipeline. Test: stop the Vault audit device (vault audit disable) or Cribl's route for a source for 20 minutes
search = | tstats max(_time) as last_seen where (index=audit sourcetype IN ("kube:apiserver:audit", "hashicorp_vault_audit_log")) OR (index=k8s sourcetype="kube:container") OR (index=infra sourcetype="linux:journald") OR (index=network sourcetype IN ("ubiquiti:unifi:ocsf", "adguard:querylog")) by index sourcetype host | eval host=if(sourcetype=="ubiquiti:unifi:ocsf", "unifi", host) | stats max(last_seen) as last_seen by index sourcetype host | join type=left host [| mstats count(system.uptime) as host_metrics where index=metrics earliest=-15m by host] | eval limit=case(sourcetype=="ubiquiti:unifi:ocsf", 480, sourcetype=="linux:journald" AND match(host, "^proxmox"), 60, sourcetype=="linux:journald", 30, sourcetype=="adguard:querylog", 30, true(), 15) | eval count=round((now()-last_seen)/60) | where count>limit AND NOT (sourcetype=="linux:journald" AND isnull(host_metrics)) | eval object=case(sourcetype=="kube:apiserver:audit", "k3s API audit log", sourcetype=="hashicorp_vault_audit_log", "Vault audit log", sourcetype=="kube:container", "k3s container logs", sourcetype=="linux:journald", "journald", sourcetype=="ubiquiti:unifi:ocsf", "UniFi gateway syslog", sourcetype=="adguard:querylog", "AdGuard DNS query log (clients may have fallen back to the gateway)", true(), sourcetype), user="", src="", detail=object." (index=".index." sourcetype=".sourcetype.") has sent nothing for ".count." minutes (limit ".limit.")" | eval first_seen=last_seen | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Log source stopped sending", "T1685", "Defense Impairment", "high", "DET0497")`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 12,27,42,57 * * * *
alert.severity = 4
alert.suppress.fields = host,object
alert.suppress.period = 6h
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
action.logevent = 1
action.logevent.param.index = security
action.logevent.param.sourcetype = homelab:detection
action.logevent.param.source = $name$
action.logevent.param.host = $result.host$
action.logevent.param.event = $result.finding$

[HL - Detection search failing]
description = ATT&CK v20 T1685 (Defense Impairment), strategy DET0497. An HL - detection errored when the scheduler ran it, so it isn't detecting anything. Found after the Authentik detections failed every run for their first hour without anyone knowing. Test: add a syntax error to a copy of an HL - search, or check index=_internal sourcetype=scheduler log_level=ERROR
search = index=_internal sourcetype=scheduler log_level=ERROR component=SavedSplunker savedsearch_id="*;85_detections;HL - *" | rex field=savedsearch_id ";85_detections;(?<object>HL - .+)$" | rex field=_raw "message=\"(?<error>[^\"]+)" | stats count min(_time) as first_seen max(_time) as last_seen latest(error) as error by object | eval host="security-tooling-01", user="", src="", detail=count." failed runs: ".error | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Detection search failing", "T1685", "Defense Impairment", "high", "DET0497")`
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
cron_schedule = 4,19,34,49 * * * *
alert.severity = 4
alert.suppress.fields = object
alert.suppress.period = 6h
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
action.logevent = 1
action.logevent.param.index = security
action.logevent.param.sourcetype = homelab:detection
action.logevent.param.source = $name$
action.logevent.param.host = $result.host$
action.logevent.param.event = $result.finding$

[HL - Falco not running]
description = ATT&CK v20 T1685 (Defense Impairment), strategy DET0497. Falco ran on this host in the last 24 hours but has not for 10 minutes, while the host itself is still reporting. Someone stopping runtime detection looks like this, and so does a crash. Test: systemctl stop falco-modern-bpf on a test VM for 15 minutes
search = | mstats count(process.uptime) as c where index=metrics process.executable.name="falco" earliest=-24h latest=now span=1m by host | stats max(_time) as last_seen min(_time) as first_seen by host | join type=left host [| mstats count(system.uptime) as host_metrics where index=metrics earliest=-10m by host] | where last_seen<relative_time(now(), "-10m") AND host_metrics>0 | eval user="", src="", object="falco", count=round((now()-last_seen)/60), detail="falco not running for ".count." minutes; the host is still sending metrics" | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Falco not running", "T1685", "Defense Impairment", "high", "DET0497")`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 13,28,43,58 * * * *
alert.severity = 4
alert.suppress.fields = host
alert.suppress.period = 6h
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
action.logevent = 1
action.logevent.param.index = security
action.logevent.param.sourcetype = homelab:detection
