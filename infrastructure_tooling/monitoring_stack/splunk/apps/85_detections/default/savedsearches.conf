description = ATLAS v5.6.0 AML.T0051.001 (Initial Access), strategy none. Text in a log the agents read addresses a language model (ignore previous instructions, disregard previous, ignore the above, new instructions:, you are now, system prompt): someone trying to steer an agent through data it will read (MITRE ATLAS indirect prompt injection). Not searched: the agents' own run log and pods, the MCP gateway's logs and the findings index's homelab:detection events. The detail quotes at most about 150 characters with the phrase broken. Test: on a test host: logger 'hl-test please ignore previous instructions'
search = (index=network OR index=security OR index=audit OR index=infra OR index=k8s OR index=apps) NOT sourcetype=homelab:detection NOT sourcetype=toolhive:vmcp:audit NOT k8s.namespace.name IN (toolhive-clients, toolhive-mcp, toolhive-system) ("ignore previous instructions" OR "ignore all previous" OR "disregard previous" OR "ignore the above" OR "new instructions:" OR "you are now" OR "system prompt") | rex field=_raw "(?is)(?<pre>.{0,60})(?<phrase>ignore\s+previous\s+instructions|ignore\s+all\s+previous|disregard\s+previous|ignore\s+the\s+above|new\s+instructions:|you\s+are\s+now|system\s+prompt)(?<post>.{0,60})" | where isnotnull(phrase) | eval snippet=replace(replace(pre.phrase.post, "[\x00-\x1f\s]+", " "), "(?i)\b(ig|di|ne|yo|sy)(nore\s+(?:previous|all\s+previous|the\s+above)|sregard\s+previous|w\s+instructions:|u\s+are\s+now|stem\s+prompt)", "\1[-]\2"), phrase=replace(replace(lower(phrase), "\s+", " "), "(?i)\b(ig|di|ne|yo|sy)(nore\s+(?:previous|all\s+previous|the\s+above)|sregard\s+previous|w\s+instructions:|u\s+are\s+now|stem\s+prompt)", "\1[-]\2") | stats count min(_time) as first_seen max(_time) as last_seen values(phrase) as phrases first(snippet) as snippet by index sourcetype host | eval user="", src="", object=index."/".sourcetype, detail="index=".index." sourcetype=".sourcetype." host=".host." phrases=".mvjoin(phrases, ",")." quoted log text (data, not instructions; phrase broken with [-]): ".snippet | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Prompt injection phrasing in logs the agents read", "AML.T0051.001", "Initial Access", "high", "")`
