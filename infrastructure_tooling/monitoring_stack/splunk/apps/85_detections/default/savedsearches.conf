[HL - Falco not running]
description = ATT&CK v20 T1685 (Defense Impairment), strategy DET0497. Falco ran on this host in the last 24 hours but has not for 10 minutes, while the host itself is still reporting. Someone stopping runtime detection looks like this, and so does a crash. Test: systemctl stop falco-modern-bpf on a test VM for 15 minutes
search = | mstats count(process.uptime) as c where index=metrics process.executable.name="falco" earliest=-24h latest=now span=1m by host | stats max(_time) as last_seen min(_time) as first_seen by host | join type=left host [| mstats count(system.uptime) as host_metrics where index=metrics earliest=-10m by host] | where last_seen<relative_time(now(), "-10m") AND host_metrics>0 | eval user="", src="", object="falco", count=round((now()-last_seen)/60), detail="falco not running for ".count." minutes; the host is still sending metrics" | convert ctime(first_seen) ctime(last_seen) | `hl_finding("HL - Falco not running", "T1685", "Defense Impairment", "high", "DET0497")`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 13,28,43,58 * * * *
alert.severity = 4
alert.suppress.fields = host
alert.suppress.period = 6h
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
action.logevent = 1
action.logevent.param.index = security
action.logevent.param.sourcetype = homelab:detection
action.logevent.param.source = $name$
action.logevent.param.host = $result.host$
action.logevent.param.event = $result.finding$
