# Repo-managed, synced by scripts/deploy.sh.
# Changes made in Splunk Web land in this app's local/ and are left alone by the sync.
[install]
state = enabled

[package]
id = 85_detections
check_for_updates = false

[ui]
is_visible = false
label = Homelab detections

[launcher]
author = bmorri13
description = Scheduled detections mapped to MITRE ATT&CK v20, findings to index=security (homelab:detection), and the homelab_slack alert action
version = 1.0.0
