# Shared pieces for the HL - detections (savedsearches.conf).

[hl_k8s_audit]
definition = index=audit sourcetype=kube:apiserver:audit

[hl_vault_audit]
definition = index=audit sourcetype=hashicorp_vault_audit_log type=response

# Authentik's events (logins, failures, admin changes): one JSON line per event in
# the server and worker pod logs. The k8s sourcetype extracts each field twice, so
# the ones the detections use are read with spath into ak_* fields.
[hl_authentik_event]
definition = index=k8s k8s.namespace.name=authentik "Created Event" \
| spath output=ak_action path=action \
| spath output=ak_user path=user.username \
| spath output=ak_login_user path=context.username \
| spath output=ak_stage path=context.stage.name \
| spath output=ak_src path=client_ip

# Kubernetes identities that act on the API by design: the node, k3s itself, built-in
# controllers, and the platform namespaces deployed by Argo CD. Humans (system:admin
# is the root kubeconfig on k3s-01) and application service accounts are not here.
[hl_k8s_platform_user]
definition = match('user.username', "^system:(node:|kube-|k3s-|apiserver|volume-scheduler|serviceaccount:(kube-system|argocd|external-secrets|cert-manager|arc-systems|toolhive-system|otel-collector|falco|metallb-system|tailscale):)")

# hl_finding(detection, technique, tactic, severity, strategy)
# Normalises every detection to one row per finding with the same fields, and builds
# the JSON that the Log Event action writes to index=security (sourcetype
# homelab:detection). Severity: low, medium, high, critical. strategy is the ATT&CK v20
# detection strategy (DET####) the logic follows, or "" when MITRE has none for the
# product.
[hl_finding(5)]
args = detection, technique, tactic, severity, strategy
definition = eval detection="$detection$", technique="$technique$", tactic="$tactic$", severity="$severity$", attack_strategy="$strategy$", attack_version="20" \
| eval detail=substr(replace(coalesce(detail, ""), "[\r\n]+", " "), 1, 1000) \
| eval finding=json_object("detection", detection, "severity", severity, "technique", technique, "tactic", tactic, "attack_version", attack_version, "attack_strategy", attack_strategy, "host", coalesce(host, ""), "user", coalesce(user, ""), "src", coalesce(src, ""), "object", coalesce(object, ""), "detail", detail, "count", coalesce(count, 1), "first_seen", coalesce(first_seen, ""), "last_seen", coalesce(last_seen, "")) \
| table detection severity technique tactic attack_strategy host user src object detail count first_seen last_seen finding
iseval = 0

# Domains allowed to send many distinct (or long, or TXT) lookups, for the HL - DNS
# detections: reverse lookups under .arpa, whose IPv6 names are 70 characters long. Add
# a legitimate chatty domain (antivirus reputation lookups, DNSBLs) here as one more
# alternative in the regex; domain is the registered domain, e.g. example.com.
[hl_dns_chatty_domain]
definition = match(domain, "(^|\.)arpa$")
