# Shared pieces for the HL - detections (savedsearches.conf).

[hl_k8s_audit]
definition = index=audit sourcetype=kube:apiserver:audit

[hl_vault_audit]
definition = index=audit sourcetype=hashicorp_vault_audit_log type=response

# Decoy objects (honeytokens) for "HL - Decoy Kubernetes secret touched" and "HL - Decoy
# Vault secret touched". Their names must never be in this public repo, so these
# defaults match nothing. The real predicates are set by hand on the Splunk host in
# etc/apps/85_detections/local/macros.conf, which deploys never overwrite; see the
# Splunk README, Detections.
[hl_decoy_k8s_secret]
definition = false()

[hl_decoy_vault_path]
definition = false()

# Authentik's events (logins, failures, admin changes): one JSON line per event in
# the server and worker pod logs. The k8s sourcetype extracts each field twice, so
# the ones the detections use are read with spath into ak_* fields.
[hl_authentik_event]
definition = index=k8s k8s.namespace.name=authentik "Created Event" \
| spath output=ak_action path=action \
| spath output=ak_user path=user.username \
| spath output=ak_login_user path=context.username \
| spath output=ak_stage path=context.stage.name \
| spath output=ak_src path=client_ip

# Kubernetes identities that act on the API by design: the node, k3s itself, built-in
# controllers, and the platform namespaces deployed by Argo CD. Humans (system:admin
# is the root kubeconfig on k3s-01) and application service accounts are not here.
[hl_k8s_platform_user]
definition = match('user.username', "^system:(node:|kube-|k3s-|apiserver|volume-scheduler|serviceaccount:(kube-system|argocd|external-secrets|cert-manager|arc-systems|toolhive-system|otel-collector|falco|metallb-system|tailscale):)")

# Secret reads that application service accounts make by design, for "HL - Kubernetes
# secrets read by a person or application". Each is one service account, in one place:
# - Trivy Operator reading its own namespace (about 17,000 gets a day, its config).
# - Trivy Operator getting an image-pull secret by name elsewhere, to scan private
#   images. The audit event is Metadata level and has no secret type, so this goes by
#   the repo's naming convention (*-ghcr-pull, all the same read:packages credential).
#   A list, or any other secret, by Trivy outside trivy-system still alerts.
# - The ARC kube-mode runner listing only its own job secrets (the container hook's
#   pruneSecrets: labelSelector=runner-pod=<pod>). Any other read in arc-runners,
#   which holds the GitHub credentials, still alerts.
# Fields are coalesced: a cluster-wide list has no namespace, and NOT on a null
# comparison would drop the row instead of keeping it.
[hl_k8s_expected_secret_read]
definition = (('user.username'=="system:serviceaccount:trivy-system:trivy-operator" \
AND (coalesce('objectRef.namespace', "")=="trivy-system" OR (verb=="get" AND match(coalesce('objectRef.name', ""), "-ghcr-pull$")))) \
OR ('user.username'=="system:serviceaccount:arc-runners:arc-k3s-homelab-gha-rs-kube-mode" AND coalesce('objectRef.namespace', "")=="arc-runners" \
AND verb=="list" AND match(coalesce(requestURI, ""), "^/api/v1/namespaces/arc-runners/secrets[?]labelSelector=runner-pod(=|%3D)[^&,]+$")))

# hl_finding(detection, technique, tactic, severity, strategy)
# Normalises every detection to one row per finding with the same fields, and builds
# the JSON that the Log Event action writes to index=security (sourcetype
# homelab:detection). Severity: low, medium, high, critical. strategy is the ATT&CK v20
# detection strategy (DET####) the logic follows, or "" when MITRE has none for the
# product. A MITRE ATLAS technique (AML.T####, attacks on the agents) gets
# attack_version="atlas-5.6.0" instead of "20". A search whose rows differ in technique,
# tactic or severity (by watch-list category) sets hl_technique, hl_tactic and
# hl_severity on each row; those take the place of the arguments.
[hl_finding(5)]
args = detection, technique, tactic, severity, strategy
definition = eval detection="$detection$", technique=coalesce(hl_technique, "$technique$"), tactic=coalesce(hl_tactic, "$tactic$"), severity=coalesce(hl_severity, "$severity$"), attack_strategy="$strategy$", attack_version=if(like(technique, "AML.%"), "atlas-5.6.0", "20") \
| eval detail=substr(replace(coalesce(detail, ""), "[\r\n]+", " "), 1, 1000) \
| eval finding=json_object("detection", detection, "severity", severity, "technique", technique, "tactic", tactic, "attack_version", attack_version, "attack_strategy", attack_strategy, "host", coalesce(host, ""), "user", coalesce(user, ""), "src", coalesce(src, ""), "object", coalesce(object, ""), "detail", detail, "count", coalesce(count, 1), "first_seen", coalesce(first_seen, ""), "last_seen", coalesce(last_seen, "")) \
| table detection severity technique tactic attack_strategy host user src object detail count first_seen last_seen finding
iseval = 0

# Domains allowed to send many distinct (or long, or TXT) lookups, for the HL - DNS
# detections: reverse lookups under .arpa, whose IPv6 names are 70 characters long. Add
# a legitimate chatty domain (antivirus reputation lookups, DNSBLs) here as one more
# alternative in the regex; domain is the registered domain, e.g. example.com.
[hl_dns_chatty_domain]
definition = match(domain, "(^|\.)arpa$")

# Every name a DNS watch-list or indicator entry could match in qname, as hl_cand: its
# last 2, 3 and 4 labels, also after removing what follows a # (a URL fragment some
# scanners leave in the name), a *.ts.net search domain whatever the tailnet's name,
# or one or two trailing labels (another appended search domain). Lookups on hl_cand
# then match an entry and any subdomain of it. Entries have 2 to 4 labels.
[hl_dns_name_candidates]
definition = eval hl_base=mvdedup(mvappend(qname, replace(qname, "#.*$", ""), replace(qname, "\.[a-z0-9-]+\.ts\.net$", ""))) \
| eval hl_base=mvdedup(mvappend(hl_base, mvmap(hl_base, replace(hl_base, "\.[^.]+$", "")), mvmap(hl_base, replace(hl_base, "\.[^.]+\.[^.]+$", "")))) \
| eval hl_cand=mvdedup(mvappend(mvmap(hl_base, replace(hl_base, "^(?:.*\.)?([^.]+\.[^.]+)$", "\1")), \
mvmap(hl_base, replace(hl_base, "^(?:.*\.)?([^.]+\.[^.]+\.[^.]+)$", "\1")), \
mvmap(hl_base, replace(hl_base, "^(?:.*\.)?([^.]+\.[^.]+\.[^.]+\.[^.]+)$", "\1"))))

# hl_ti_active(expires): a row of lookups/hl_threat_indicators.csv still counts. expires
# is YYYY-MM-DD and the row stops counting at the start of that day; a missing or
# malformed date counts as expired, so check the CSV after editing it (README).
[hl_ti_active(1)]
args = expires
definition = coalesce(strptime($expires$, "%Y-%m-%d"), 0)>now()
iseval = 0

# Feed matches to skip in "HL - Threat feed IP seen in logs" and "HL - DNS lookup of a
# threat feed domain": a feed indicator that is a known false positive here. Fields:
# ti_indicator, ti_source, ti_context, and host (IP detection) or src and qname (DNS
# detection). Matches nothing here; set the real predicate on the Splunk host in
# etc/apps/85_detections/local/macros.conf, which deploys never overwrite (README,
# Detections), for example:
#   definition = in(ti_indicator, "203.0.113.10", "example.net")
[hl_ti_feed_allowed]
definition = false()

# hl_ti_handpicked(indicator): the indicator is also an active row of
# hl_threat_indicators.csv, whose own detections report it at high severity; the feed
# detections leave it to them.
[hl_ti_handpicked(1)]
args = indicator
definition = lookup hl_threat_indicators indicator AS $indicator$ OUTPUT expires AS hl_handpicked_expires \
| eval hl_handpicked=if(isnotnull(hl_handpicked_expires) AND `hl_ti_active(hl_handpicked_expires)`, 1, 0)
iseval = 0

# Known-good lookups for "HL - DNS lookup of a data-drop or callback service", e.g. a
# security scanner that uses OOB callbacks (Interactsh), by the marker its payloads put
# in the name. Fields: src (client), qname, watch_domain, watch_category. Matches
# nothing here; set the real predicate on the Splunk host in
# etc/apps/85_detections/local/macros.conf, which deploys never overwrite (README,
# Detections), for example:
#   definition = (watch_category=="callback" AND match(qname, "<scanner-marker>"))
[hl_dns_watch_allowed]
definition = false()

# Cloudflare's account audit log (v2), pulled every 10 minutes by
# scripts/cloudflare-logs.py, with the fields the HL - Cloudflare detections share:
# cf_desc (action.description: "Create DNS Record", "SSO_LOGIN", ...), cf_type
# (create, update, delete, view), cf_result, cf_product and cf_rtype (resource
# product and type), cf_method and cf_uri (the API request, with every 32-character
# ID as <id>; absent on Cloudflare's own system events), cf_via (dash, api,
# api_token), cf_token (the API token's ID, if one was used), cf_actor (the user's
# email, or the actor type such as system, plus the token's name), src (the actor's
# address), cf_zone, and cf_req (the request body as JSON text).
[hl_cf_audit]
definition = index=audit sourcetype=cloudflare:audit \
| spath output=cf_req path=resource.request \
| eval cf_desc=coalesce('action.description', ""), cf_type=coalesce('action.type', ""), cf_result=coalesce('action.result', ""), \
cf_product=coalesce('resource.product', ""), cf_rtype=coalesce('resource.type', ""), cf_method=coalesce('raw.method', ""), \
cf_uri=replace(coalesce('raw.uri', ""), "[0-9a-f]{32}", "<id>"), cf_via=coalesce('actor.context', ""), \
cf_token=coalesce('actor.token.id', ""), \
cf_actor=coalesce('actor.email', 'actor.type', "unknown").if(isnotnull('actor.token.name'), " (API token ".'actor.token.name'.")", ""), \
src=coalesce('actor.ip_address', ""), cf_zone=coalesce('zone.name', "")

# Cloudflare changes made on purpose, skipped by the HL - Cloudflare audit
# detections: the owner's routine changes, and the homelab's own automation (a
# Terraform or cert-manager API token, by its ID). Fields: the hl_cf_audit fields
# above (cf_token, cf_actor, src, cf_desc, cf_uri, cf_zone, ...), plus hl_names and
# hl_types in the DNS detection. Matches nothing here; set the real predicate on the
# Splunk host in etc/apps/85_detections/local/macros.conf, which deploys never
# overwrite (README, Detections), for example:
#   definition = (cf_token=="<token-id>" AND match(cf_uri, "/dns_records"))
[hl_cf_expected_change]
definition = false()

# Client addresses "HL - Cloudflare firewall burst from one address" skips (your own
# uptime monitor or scanner). Field: clientIP. Matches nothing here; set it on the
# Splunk host in local/macros.conf:
#   definition = in(clientIP, "203.0.113.10")
[hl_cf_firewall_ignore]
definition = false()

# Clients the DNS first-lookup detections (LLM API, IP geolocation) skip: Kubernetes
# pods, whose addresses change every run, so each pod is a new client. Field: src.
# Matches nothing here; set the pod range on the Splunk host in local/macros.conf:
#   definition = cidrmatch("<pod-cidr>", src)
[hl_dns_llm_client_ignore]
definition = false()
