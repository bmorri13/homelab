# Posts each finding to the homelab Slack channel through an incoming webhook.
# The webhook URL is not in the repo: it is stored in Splunk's credential store
# (storage/passwords, realm homelab_slack, user webhook, app 85_detections) by
# scripts/set-slack-webhook.sh, and read by bin/homelab_slack.py at send time.
# Findings reach Slack through the agents (homelab_agents). The searches that use
# this action are in 85_homelab_ops and watch what the agents depend on: their own
# watchdog, "Agents - not running or failing" (a runner that has stopped can't report
# itself), and "Splunk - health degraded".
[homelab_slack]
is_custom = 1
label = Homelab Slack
description = Post the finding to the homelab Slack channel
payload_format = json
python.version = python3
