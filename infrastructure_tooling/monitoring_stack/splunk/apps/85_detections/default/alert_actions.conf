# Posts each finding to the homelab Slack channel through an incoming webhook.
# The webhook URL is not in the repo: it is stored in Splunk's credential store
# (storage/passwords, realm homelab_slack, user webhook, app 85_detections) by
# scripts/set-slack-webhook.sh, and read by bin/homelab_slack.py at send time.
# Findings reach Slack through the agents (homelab_agents). The searches that use
# this action are the ones in 85_homelab_ops that set action.homelab_slack: the
# agents' own watchdog, "Agents - not running or failing" (a runner that has stopped
# can't report itself), the checks on what the agents depend on ("Splunk - health
# degraded", "Splunk - license expiring", "Splunk - detection validation failed"),
# and the Kubernetes posture reports ("Kubernetes - CIS benchmark failures",
# "Trivy - critical vulnerabilities in running images", "Trivy - secret found in a
# running image"), and "Authentik - database backup failed or missing".
[homelab_slack]
is_custom = 1
label = Homelab Slack
description = Post the finding to the homelab Slack channel
payload_format = json
python.version = python3
