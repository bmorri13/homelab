# Splunk Web (8000) presents a cert from the homelab CA (scripts/tls-certs.sh) instead
# of Splunk's default self-signed one, so Traefik on k3s-01 can verify it when it
# serves https://splunk.bmosan.com. HTTPS itself is turned on by the image
# (SPLUNK_HTTP_ENABLESSL, etc/system/local/web.conf).
[settings]
serverCert = $SPLUNK_HOME/etc/auth/homelab/web.crt
privKeyPath = $SPLUNK_HOME/etc/auth/homelab/web.key
# Behind Traefik: take the client address and host name from X-Forwarded-*. Only
# k3s-01 can reach port 8000 (scripts/mgmt-firewall.sh).
tools.proxy.on = true
