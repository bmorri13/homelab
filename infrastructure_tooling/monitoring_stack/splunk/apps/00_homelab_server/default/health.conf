# splunkd's IOWait defaults (yellow/red: 1/3 % average across CPUs, 5/10 % on one CPU,
# 7/15 for the three busiest CPUs) are tuned for dedicated indexers. This VM shares
# its disk with guardrail, s3search and Cribl, and a few minutes of their I/O, or the
# nightly config backup, held health red at about 3-5 % average iowait while disk
# latency stayed around 1 ms. Sustained iowait at these levels still shows.
[feature:iowait]
indicator:avg_cpu__max_perc_last_3m:yellow = 5
indicator:avg_cpu__max_perc_last_3m:red = 10
indicator:single_cpu__max_perc_last_3m:yellow = 10
indicator:single_cpu__max_perc_last_3m:red = 20
indicator:sum_top3_cpu_percs__max_last_3m:yellow = 15
indicator:sum_top3_cpu_percs__max_last_3m:red = 30
