# The root filesystem is shared with other containers on security-tooling-01.
# Stop indexing (not corrupt anything) while less than 50 GB is free.
[diskUsage]
minFreeSpace = 51200

# splunkd (management port 8089, which the MCP gateway on k3s-01 calls) presents a
# cert from the homelab CA instead of Splunk's default self-signed one. Both files are
# written by scripts/tls-certs.sh. caCertFile is Splunk's default CA plus the homelab
# CA, so anything that trusted the default CA still does.
[sslConfig]
serverCert = $SPLUNK_HOME/etc/auth/homelab/server.pem
caCertFile = $SPLUNK_HOME/etc/auth/homelab/cacert.pem
