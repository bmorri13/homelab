# Hot/warm/cold all live on local disk (Splunk does not support NFS for hot/warm).
# Buckets are deleted when they pass frozenTimePeriodInSecs or when the volume cap
# below is reached, oldest first. Nothing is archived yet.
# To archive instead of delete once the Unraid NFS share exists (issue #165), add
# this line to each index:
#   coldToFrozenScript = "/bin/sh" "$SPLUNK_HOME/etc/apps/00_homelab_indexes/bin/archive_bucket.sh"
#
# Cribl picks the index for every event (cribl/local/cribl/pipelines). Adding an
# index here means adding it to Cribl's routing and to 00_homelab_roles too.

[default]
# Events sent to an index that doesn't exist land here instead of being dropped.
lastChanceIndex = unrouted

[volume:local]
path = $SPLUNK_DB
# Combined cap for the homelab indexes below (MB). The 600 GB root disk is shared.
maxVolumeDataSizeMB = 350000

[network]
# UniFi gateway: firewall, IDS/IPS, DHCP. Later DNS and ingress access logs.
homePath   = volume:local/network/db
coldPath   = volume:local/network/colddb
thawedPath = $SPLUNK_DB/network/thaweddb
frozenTimePeriodInSecs = 7776000

[infra]
# Proxmox, Unraid, VM system logs (journald, auth), the GitHub Actions runner
homePath   = volume:local/infra/db
coldPath   = volume:local/infra/colddb
thawedPath = $SPLUNK_DB/infra/thaweddb
frozenTimePeriodInSecs = 7776000

[k8s]
# Cluster platform on k3s-01 and docker-compose-03: pod logs and events
homePath   = volume:local/k8s/db
coldPath   = volume:local/k8s/colddb
thawedPath = $SPLUNK_DB/k8s/thaweddb
frozenTimePeriodInSecs = 2592000

[apps]
# Your own apps, wherever they run (Docker hosts or k8s)
homePath   = volume:local/apps/db
coldPath   = volume:local/apps/colddb
thawedPath = $SPLUNK_DB/apps/thaweddb
frozenTimePeriodInSecs = 2592000

[audit]
# Vault, ToolHive, ArgoCD and UniFi admin actions, remote-access logins.
# Directories are homelab_audit because Splunk's built-in _audit index already
# uses $SPLUNK_DB/audit and summaries/audit, and any shared path stops splunkd
# from starting. tstatsHomePath would otherwise default to summaries/audit.
homePath   = volume:local/homelab_audit/db
coldPath   = volume:local/homelab_audit/colddb
thawedPath = $SPLUNK_DB/homelab_audit/thaweddb
tstatsHomePath = volume:_splunk_summaries/homelab_audit/datamodel_summary
frozenTimePeriodInSecs = 7776000

[ai_agents]
# AI agent telemetry: Claude Code, Codex, MCP gateway tool calls, agents we build
homePath   = volume:local/ai_agents/db
coldPath   = volume:local/ai_agents/colddb
thawedPath = $SPLUNK_DB/ai_agents/thaweddb
frozenTimePeriodInSecs = 7776000

[cribl]
# Cribl's own warnings and errors
homePath   = volume:local/cribl/db
coldPath   = volume:local/cribl/colddb
thawedPath = $SPLUNK_DB/cribl/thaweddb
frozenTimePeriodInSecs = 1209600

[unrouted]
# Matched no Cribl route, or named an index that doesn't exist. Should stay empty.
homePath   = volume:local/unrouted/db
coldPath   = volume:local/unrouted/colddb
thawedPath = $SPLUNK_DB/unrouted/thaweddb
frozenTimePeriodInSecs = 1209600
