# OpenCanary honeypot events. Cribl (hec_in) sends its JSON lines here, index=security.
# Mapped to CIM Intrusion Detection: nothing legitimate should connect, so every event
# with logtype >= 2000 is treated as an attack on dest.
[opencanary]
KV_MODE = json
LOOKUP-logtype = opencanary_logtypes logtype OUTPUT signature service category
FIELDALIAS-cim = src_host AS src dst_host AS dest dst_port AS dest_port
EVAL-user = if('logdata.USERNAME'=="null" OR 'logdata.USERNAME'=="", null(), 'logdata.USERNAME')
EVAL-signature_id = logtype
EVAL-action = "allowed"
EVAL-ids_type = "network"
# Login attempts (someone tried credentials) rank higher. Uses logtype, not the lookup's
# category: Splunk evaluates EVAL- before LOOKUP-.
EVAL-severity = if(in(tostring(logtype), "2000", "3001", "4002", "6001", "7001", "8001", "9001", "9002", "12001", "20001"), "high", "medium")
EVAL-vendor_product = "OpenCanary"
EVAL-dvc = node_id
