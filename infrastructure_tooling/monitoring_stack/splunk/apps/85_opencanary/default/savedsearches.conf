# Any connection to the OpenCanary honeypot (192.168.4.240, "nas-backup-01").
# Nothing legitimate uses it, so one event is worth a look. Suppressed per source
# for an hour so a scan raises one alert, not hundreds.
[Honeypot - connection to OpenCanary]
search = index=security sourcetype=opencanary logtype>=2000 \
| stats count min(_time) as first_seen max(_time) as last_seen values(signature) as signatures values(dest_port) as ports values(user) as usernames by src_host \
| convert ctime(first_seen) ctime(last_seen)
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = src_host
alert.digest_mode = 0
description = Something connected to the OpenCanary honeypot. Shows source, services and usernames tried.
