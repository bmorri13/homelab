# Login events from journald, which the Cribl hec_in pipeline rewrites into classic
# auth.log lines ("Oct 26 04:42:16 host ident[pid]: message") with sourcetype
# linux_secure. The Splunk Add-on for Unix and Linux (Splunk_TA_nix) parses the
# OpenSSH, sudo, su and useradd lines and maps them to CIM Authentication and
# Change. It has no parsing for the lines below, so this app adds it:
#   tailscaled  "audit: SSH login: ..."  how the Ubuntu VMs are reached (Tailscale SSH)
#   pvedaemon/pveproxy  Proxmox web UI and API logins
#   tailscaled "ssh-session(...): starting ... command"  what each Tailscale SSH session ran
# It also fixes sudo sessions on Ubuntu 24.04 and parses the sudo command line.
# The add-on's own linux_secure settings (dest from the line's host, src from
# src_ip, action and app handling) also apply to these events.

[linux_secure]
REPORT-homelab_auth = homelab_tailscale_ssh_login, homelab_pve_auth_success, homelab_pve_auth_failure, homelab_pam_session_opened, homelab_sudo_command, homelab_tailscale_ssh_session, homelab_tailscale_ssh_cmd
# Tailscale SSH session commands as CIM Endpoint Processes: the command, or the login
# shell for an interactive session. Other linux_secure events keep their own values.
EVAL-process = if(isnotnull(ts_session), coalesce(command, login_shell), process)
EVAL-process_name = if(isnotnull(ts_session), replace(mvindex(split(trim(coalesce(command, login_shell)), " "), 0), "^.*/", ""), process_name)
