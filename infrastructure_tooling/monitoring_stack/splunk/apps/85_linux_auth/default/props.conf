# Login events from journald, which the Cribl hec_in pipeline rewrites into classic
# auth.log lines ("Oct 26 04:42:16 host ident[pid]: message") with sourcetype
# linux_secure. The Splunk Add-on for Unix and Linux (Splunk_TA_nix) parses the
# OpenSSH, sudo, su and useradd lines and maps them to CIM Authentication and
# Change. It has no parsing for the two kinds below, so this app adds it:
#   tailscaled  "audit: SSH login: ..."  how the Ubuntu VMs are reached (Tailscale SSH)
#   pvedaemon/pveproxy  Proxmox web UI and API logins
# It also fixes sudo sessions on Ubuntu 24.04 and parses the sudo command line.
# The add-on's own linux_secure settings (dest from the line's host, src from
# src_ip, action and app handling) also apply to these events.

[linux_secure]
REPORT-homelab_auth = homelab_tailscale_ssh_login, homelab_pve_auth_success, homelab_pve_auth_failure, homelab_pam_session_opened, homelab_sudo_command
