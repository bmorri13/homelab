# tailscaled[812]: audit: SSH login: user=root uid=0 from=100.127.146.108 ts_user=someone@example.com node=laptop.tailnet.ts.net.
# ts_user is the tailnet identity (or "tagged-devices" for tagged machines such as CI runners).
[homelab_tailscale_ssh_login]
REGEX = tailscaled(?:\[\d+\])?:\s+audit: SSH login: user=(\S+) uid=(\d+) from=(\S+) ts_user=(\S+) node=(\S+?)\.?$
FORMAT = app::"tailscale_ssh" signature::"Tailscale SSH login" action::"success" authentication_method::"tailscale" user::$1 user_id::$2 src_ip::$3 ts_user::$4 ts_node::$5

# pvedaemon[1234]: <root@pam> successful auth for user 'root@pam'
[homelab_pve_auth_success]
REGEX = (?:pvedaemon|pveproxy)\[\d+\]:\s+<[^>]*>\s+successful auth for user '([^']+)'
FORMAT = app::"proxmox" signature::"successful auth" action::"success" user::$1

# pvedaemon[1234]: authentication failure; rhost=::ffff:192.168.1.50 user=root@pam msg=Authentication failure
[homelab_pve_auth_failure]
REGEX = (?:pvedaemon|pveproxy)\[\d+\]:\s+authentication failure; rhost=(?:::ffff:)?(\S+) user=(\S+)(?: msg=(.*))?
FORMAT = app::"proxmox" signature::"authentication failure" action::"failure" src_ip::$1 user::$2 reason::$3

# sudo[1185110]: pam_unix(sudo:session): session opened for user root(uid=0) by (uid=1000)
# The add-on's linux_secure_pam_unix_authentication_success needs a name before
# "(uid=...)" after "by", which Ubuntu 24.04 leaves out, so app, signature and
# action stay empty. The add-on already extracts user; its EVAL-action and
# EVAL-src_user then work from the fields set here.
[homelab_pam_session_opened]
REGEX = pam_unix\((\w+(?:-\w+)?):session\):\s+(session opened for user)\s+[^\s(]+(?:\(uid=(\d+)\))?\s+by\s+(?:[^\s(]*)\(uid=(\d+)\)
FORMAT = app::$1 signature::$2 authentication_service::"pam_unix" user_id::$3 src_user_id::$4

# sudo[1185110]:   ubuntu : TTY=pts/0 ; PWD=/home/ubuntu ; USER=root ; COMMAND=/usr/bin/apt update
# The add-on does not parse the command line sudo logs.
[homelab_sudo_command]
REGEX = sudo(?:\[\d+\])?:\s+(\S+)\s+:\s+(?:TTY=(\S+)\s+;\s+)?PWD=(\S+)\s+;\s+USER=(\S+)\s+;\s+(?:ENV=.*?\s+;\s+)?COMMAND=(.*)
FORMAT = app::"sudo" src_user::$1 tty::$2 pwd::$3 user::$4 command::$5

# tailscaled[812]: ssh-session(sess-20261026T050037-6a437d828d): starting non-pty command: [/usr/sbin/tailscaled
#   be-child ssh --login-shell=/bin/bash --uid=0 ... --local-user=root --home-dir=/root --remote-user=someone@example.com
#   --remote-ip=100.127.146.108 --has-tty=false --tty-name= --force-v1-behavior --cmd=apt update]
# One per Tailscale SSH session. Interactive shells have no --cmd. The command can span lines.
[homelab_tailscale_ssh_session]
REGEX = tailscaled(?:\[\d+\])?:\s+ssh-session\((\S+?)\):\s+starting (?:non-)?pty command:\s+\[.*?--login-shell=(\S+)\s+--uid=(\d+)\s.*?--local-user=(\S+)\s.*?--remote-user=(\S+)\s+--remote-ip=(\S+)\s+--has-tty=(\w+)\s+--tty-name=(\S*)
FORMAT = app::"tailscale_ssh" ts_session::$1 login_shell::$2 user_id::$3 user::$4 ts_user::$5 src_ip::$6 has_tty::$7 tty::$8 parent_process_name::"tailscaled"

[homelab_tailscale_ssh_cmd]
REGEX = (?s)tailscaled(?:\[\d+\])?:\s+ssh-session\(\S+?\):\s+starting (?:non-)?pty command:\s+\[.*?\s--cmd=(.*)\]\s*$
FORMAT = command::$1
