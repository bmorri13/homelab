# The software-factory agent (infrastructure_tooling/software_factory, code in the
# private repository bmorri13/software-factory) prints one JSON object per thing it
# did. The Cribl hec_in pipeline tags those lines and sends them to index=ai_agents.
# Every event has `event` and `repo`. The events:
# software_factory.triage: one per pull request sent to the model. number, title, sha,
#   update, tier_rules, rules, tier, verdict, model_verdict, forced, blocked, merged,
#   previous, cost_usd, turns, duration_ms, error
# software_factory.validate: one per merged update checked. number, commit, result
#   (passed, failed, unverified, pending), merged_by_agent, runs, apps, revert
# software_factory.retro_finding: category, target, severity, title, observation,
#   proposal, pull_requests
# software_factory.retro: summary, findings, cost_usd
# software_factory.run: the end of a pass. merge, dry_run

[software_factory:json]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 20000
