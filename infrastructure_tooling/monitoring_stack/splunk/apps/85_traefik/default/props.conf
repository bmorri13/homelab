# Traefik's access log on k3s-01 (k3s_node/traefik-config.yaml): one JSON object per
# request, e.g. {"ClientHost":"100.64.0.10","DownstreamStatus":404,"Duration":1313265,
# "RequestHost":"vault.bmosan.com","RequestMethod":"GET","RequestPath":"/.env",
# "RouterName":"vault-vault-vault-bmosan-com@kubernetes","StartUTC":"...",
# "entryPointName":"websecure","request_User-Agent":"curl/8.5.0",...}. Cribl's hec_in
# pipeline sends it to index=network and sets _time from StartUTC.
#   - ClientHost is the TCP peer (Traefik deletes a client's X-Forwarded-For), so src
#     can't be spoofed. request_Cf-Connecting-Ip is whatever the client sent:
#     claimed_client_ip, never src.
#   - OriginStatus 0 means no backend answered: Traefik itself replied (ipAllowList
#     403, no matching router 404, 502/503/504 when the backend is down or missing).
#   - RouterName *@internal are Traefik's own routers (ping@internal heartbeat,
#     dashboard), on the traefik entry point, not ingress traffic.
#   - Duration and OriginDuration are nanoseconds.
[traefik:access]
KV_MODE = json
FIELDALIAS-cim = ClientHost AS src RequestHost AS dest RequestHost AS site RequestMethod AS http_method DownstreamStatus AS status RouterName AS rule ServiceName AS app
EVAL-uri_path = replace(RequestPath, "\?.*$", "")
EVAL-uri_query = if(like(RequestPath, "%?%"), replace(RequestPath, "^[^?]*\?", ""), null())
EVAL-url = RequestScheme."://".RequestHost.RequestPath
EVAL-http_user_agent = 'request_User-Agent'
EVAL-http_referrer = 'request_Referer'
EVAL-claimed_client_ip = trim(mvindex(split(coalesce('request_Cf-Connecting-Ip', 'request_X-Forwarded-For'), ","), 0))
EVAL-bytes_in = RequestContentSize
EVAL-bytes_out = DownstreamContentSize
EVAL-bytes = RequestContentSize + DownstreamContentSize
EVAL-duration = round(Duration / 1000000000, 4)
EVAL-response_time = round(Duration / 1000000, 1)
EVAL-backend_answered = if(OriginStatus > 0, "yes", "no")
EVAL-action = if(DownstreamStatus == 403 AND OriginStatus == 0, "blocked", "allowed")
EVAL-dest_port = if(RequestScheme == "https", 443, 80)
EVAL-vendor_product = "Traefik"
