# AdGuard Home's DNS query log (infrastructure_tooling/adguard): one JSON object per
# query, e.g. {"T":"...","QH":"debian.org","QT":"A","QC":"IN","CP":"","Upstream":
# "192.168.4.1:53","Answer":"<base64 wire format>","IP":"192.168.4.20","Result":{},
# "Elapsed":12185034}. Cribl's hec_in pipeline sends it to index=network.
[adguard:querylog]
KV_MODE = json
# CIM Network_Resolution names. Elapsed is nanoseconds; CP is the client protocol
# ("" = plain DNS, doh, dot, doq).
FIELDALIAS-cim = IP AS src QH AS query QT AS record_type QC AS query_class Upstream AS dest
EVAL-duration = round(Elapsed / 1000000000, 4)
EVAL-transport = if(CP == "" OR isnull(CP), "udp/tcp", CP)
EVAL-vendor_product = "AdGuard Home"
# Result.IsFiltered is set when a rule blocked or rewrote the answer.
EVAL-action = if('Result.IsFiltered' == "true", "blocked", "allowed")
