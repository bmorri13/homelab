# Control-plane audit events in index=audit. The first four come from
# infrastructure_tooling/audit_poller, which sets _time from each event's own time.
# pve:access comes from the OTel agent's pve role (otel-agent/pve.yaml), which sends
# src, pve_user, method, uri and status as indexed fields.

[cloudflare:audit]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 200000

[tailscale:audit]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 200000

[github:activity]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 200000

[audit_poller:status]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false

[pve:access]
KV_MODE = none
SHOULD_LINEMERGE = false
