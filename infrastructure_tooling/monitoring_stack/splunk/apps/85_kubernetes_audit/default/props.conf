# Kubernetes API audit events (audit.k8s.io/v1 Event, one JSON object per line) from
# k3s-01's apiserver, tailed by the OTel DaemonSet (infrastructure_tooling/k3s_audit).
# The collector sets _time from requestReceivedTimestamp, so only search-time JSON
# extraction is needed. Useful fields: user.username, user.groups{}, verb,
# objectRef.resource, objectRef.namespace, objectRef.name, objectRef.subresource
# (exec, attach, portforward), responseStatus.code, sourceIPs{}, userAgent, level.
# Secrets and ConfigMaps are logged at Metadata level, so no object bodies appear.

[kube:apiserver:audit]
KV_MODE = json
AUTO_KV_JSON = true
SHOULD_LINEMERGE = false
TRUNCATE = 200000
