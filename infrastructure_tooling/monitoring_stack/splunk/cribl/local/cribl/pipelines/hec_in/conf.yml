functions:
  - id: eval
    filter: >-
      __e['k8s.namespace.name'] == 'vault' && /^\{/.test(_raw) && /"type":"(request|response)"/.test(_raw) && /"request":\{/.test(_raw)
    conf:
      add:
        - name: index
          value: "'audit'"
        - name: sourcetype
          value: "'hashicorp_vault_audit_log'"
    final: true
    description: >-
      Vault audit device (file, stdout) entries to index=audit. Final, so no drop
      rule below can discard an audit record. Secret values and tokens are already
      HMAC'd by Vault.
  - id: eval
    filter: >-
      __e['k8s.namespace.name'] == 'toolhive-mcp' && __e['k8s.container.name'] == 'vmcp' && /"msg":"audit_event"/.test(_raw)
    conf:
      add:
        - name: index
          value: "'audit'"
        - name: sourcetype
          value: "'toolhive:vmcp:audit'"
    final: true
    description: >-
      MCP gateway audit records (who called which tool, outcome) to index=audit.
      Final, like the Vault audit rule. The rest of ToolHive's logs go to k8s.
  - id: eval
    filter: >-
      __e['compose.project'] == 'bmosan-news' && __e['container.name'] == 'news-backend' && /^\{"time":/.test(_raw)
    conf:
      add:
        - name: sourcetype
          value: "'bmosan:news:json'"
        - name: index
          value: >-
            /"event": ?"llm_call"/.test(_raw) ? 'ai_agents'
            : /"event": ?"trigger_(invoked|denied)"/.test(_raw) ? 'security'
            : 'apps'
    final: true
    description: >-
      Daily news app backend (news.bmosan.com) JSON logs: Claude API calls to
      ai_agents, admin trigger attempts to security, the rest to apps. The app
      already skips successful health checks and keeps debug off.
  - id: eval
    filter: >-
      __e['container.name'] == 'cloudflared-tunnel' && __e['container.image.name'] == 'cloudflare/cloudflared'
    conf:
      add:
        - name: sourcetype
          value: "'cloudflare:cloudflared'"
        - name: index
          value: "'network'"
    description: >-
      Cloudflare Tunnel connectors (news.bmosan.com, the Splunk stack) to network.
      About 100 lines a week, and the INF lines show tunnel reconnects, so all are kept.
  - id: eval
    filter: >-
      sourcetype == 'linux:journald' && (
      ['sshd', 'sshd-session', 'sudo', 'su', 'login', 'useradd', 'userdel', 'usermod', 'groupadd', 'groupdel', 'groupmod', 'passwd', 'chpasswd', 'chage', 'gpasswd'].includes(__e['syslog.identifier']) ||
      (['pvedaemon', 'pveproxy'].includes(__e['syslog.identifier']) && /successful auth|authentication failure/.test(_raw)) ||
      (__e['syslog.identifier'] == 'tailscaled' && /^audit: SSH login:/.test(_raw)))
    conf:
      add:
        - name: _raw
          value: >-
            C.Time.strftime(_time, '%b %e %H:%M:%S') + ' ' + host + ' ' + __e['syslog.identifier'] +
            (__e['process.pid'] ? '[' + __e['process.pid'] + ']' : '') + ': ' + _raw
        - name: sourcetype
          value: "'linux_secure'"
    description: >-
      Logins, sudo/su and account changes from journald, rewritten as classic auth.log
      lines (sourcetype linux_secure) so the Splunk Add-on for Unix and Linux parses
      them into CIM Authentication and Change. Tailscale SSH and Proxmox logins are
      parsed by apps/85_linux_auth. The indexed journald fields are kept.
  - id: drop
    filter: __e['k8s.namespace.name'] == 'arc-runners'
    conf: {}
    description: "GitHub Actions runner pods: job chatter, no value"
  - id: drop
    filter: /kube-probe\//.test(_raw)
    conf: {}
    description: Kubernetes liveness/readiness probe hits
  - id: drop
    filter: /"level":"debug"|\blevel=debug\b|\bDEBUG\b/i.test(_raw)
    conf: {}
    description: Debug-level lines
  - id: drop
    filter: >-
      /"GET \/(api\/)?(health|healthz|ready|readyz|livez)\b[^"]*" 200/.test(_raw)
    conf: {}
    description: "Container health-check hits that succeeded"
  - id: drop
    filter: >-
      __e['container.name'] && /LockRing: /.test(_raw)
    conf: {}
    description: SeaweedFS lock-ring updates (several every 30 s)
  - id: drop
    filter: >-
      __e['syslog.identifier'] == '50-motd-news' ||
      (__e['syslog.identifier'] == 'systemd' && !/fail/i.test(_raw) &&
      /Deactivated successfully|Consumed .* CPU time|^(Starting|Started|Finished|Stopping|Stopped) .*\.(service|timer|socket|mount|slice|scope)/.test(_raw))
    conf: {}
    description: "journald: MOTD news and routine systemd unit start/stop (failures are kept)"
  - id: drop
    filter: >-
      __e['k8s.namespace.name'] == 'argocd' && !/level=(warn|error|fatal)|"level":"(warn|error|fatal)"/.test(_raw) &&
      /Processing completed|Start processing|finished unary call with code OK|GetRepoObjs stats|Reconciliation completed|manifest cache hit|No status changes|Refreshing app status|Comparing app state|Skipping auto-sync|Update successful/.test(_raw)
    conf: {}
    description: "ArgoCD routine reconcile chatter (warnings, errors and sync actions are kept)"
  - id: drop
    filter: >-
      __e['k8s.namespace.name'] == 'arc-systems' && /\tINFO\t/.test(_raw) && !/scaled|Created|Deleted|Failed/.test(_raw)
    conf: {}
    description: "ARC controller/listener INFO reconcile loop (scale events, warnings and errors are kept)"
  - id: drop
    filter: >-
      __e['k8s.namespace.name'] == 'toolhive-mcp' &&
      (/"(GET|POST|DELETE) \/(mcp|health)? HTTP\/1\.[01]" (2\d\d|404)\b/.test(_raw) || /kubernetes cache synced successfully|waiting for Kubernetes cache sync/.test(_raw))
    conf: {}
    description: "ToolHive: per-request access lines from MCP servers (mostly health polls; each tool call is in the vMCP audit record) and the vMCP cache-sync loop"
  - id: chain
    filter: >-
      (__e['syslog.identifier'] == 'falco' || __e['k8s.namespace.name'] == 'falco') && /^\{"hostname"/.test(_raw)
    conf:
      processor: pack:cc-falco-ocsf
    description: Falco JSON alerts to OCSF Detection Findings (cribl/packs/cc-falco-ocsf)
  - id: eval
    filter: "true"
    conf:
      add:
        - name: index
          value: >-
            __falco_alert ? 'security'
            : ['network', 'infra', 'k8s', 'apps', 'audit', 'ai_agents', 'security', 'cribl', 'unrouted'].includes(index) ? index
            : /claude|codex|agent/i.test(__e['service.name'] || '') ? 'ai_agents'
            : __e['k8s.namespace.name'] == 'vault' ? 'audit'
            : ['alexprinter', 'stirling-pdf', 'uptime-kuma'].includes(__e['k8s.namespace.name']) ? 'apps'
            : __e['k8s.namespace.name'] ? 'k8s'
            : __e['container.name'] ? 'apps'
            : 'infra'
    description: Keep a valid index the collector set; otherwise route by source
asyncFuncTimeout: 1000
output: default
