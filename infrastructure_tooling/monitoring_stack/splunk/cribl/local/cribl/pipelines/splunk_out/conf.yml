functions:
  - id: mask
    filter: "true"
    conf:
      fields:
        - _raw
      depth: 5
      rules:
        - matchRegex: /-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE
            KEY-----/g
          replaceExpr: "'[REDACTED PRIVATE KEY]'"
        - matchRegex: /\b(?:AKIA|ASIA)[0-9A-Z]{16}\b/g
          replaceExpr: "'[REDACTED AWS KEY]'"
        - matchRegex: /\bgh[pousr]_[A-Za-z0-9]{30,}\b/g
          replaceExpr: "'[REDACTED GITHUB TOKEN]'"
        - matchRegex: /\bxox[abprs]-[A-Za-z0-9-]{10,}/g
          replaceExpr: "'[REDACTED SLACK TOKEN]'"
        - matchRegex: /\bsk-[A-Za-z0-9_-]{20,}/g
          replaceExpr: "'[REDACTED API KEY]'"
        - matchRegex: /\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g
          replaceExpr: "'[REDACTED JWT]'"
        - matchRegex: /(authorization["']?\s*[:=]\s*["']?(?:bearer|basic|splunk)\s+)[A-Za-z0-9._~+\/=-]+/gi
          replaceExpr: "`${g1}[REDACTED]`"
        - matchRegex: /\beyJ[A-Za-z0-9+\/_-]{40,}={0,2}/g
          replaceExpr: "'[REDACTED BASE64 JSON]'"
        - matchRegex: /\bLS0tLS1CRUdJTi(?!BDRVJUSUZJQ0FUR|BQVUJMSUMgS0VZ|BYNTA5|BUUlVTVEVEIENFUl)[A-Za-z0-9+\/=]{20,}/g
          replaceExpr: "'[REDACTED BASE64 PEM]'"
        - matchRegex: /\bdckr_pat_[\w-]{20,}/g
          replaceExpr: "'[REDACTED DOCKER HUB TOKEN]'"
        - matchRegex: /\bya29\.[\w-]{30,}/g
          replaceExpr: "'[REDACTED GOOGLE ACCESS TOKEN]'"
        - matchRegex: /\btskey-[A-Za-z0-9-]{10,}/g
          replaceExpr: "'[REDACTED TAILSCALE KEY]'"
        - matchRegex: /\bhv[sbr]\.[A-Za-z0-9_-]{20,}/g
          replaceExpr: "'[REDACTED VAULT TOKEN]'"
        - matchRegex: '/((?:Unseal|Recovery) Key(?: \d+)?:\s*)\S+/gi'
          replaceExpr: "`${g1}[REDACTED]`"
        - matchRegex: /([\w.-]+@(?:pam|pve)![\w.-]+[=:\s])[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi
          replaceExpr: "`${g1}[REDACTED]`"
        - matchRegex: /\b([a-z][a-z0-9+.-]*:\/\/[^\s:@\/"']+:)[^\s@\/"']+@/gi
          replaceExpr: "`${g1}[REDACTED]@`"
        - matchRegex: /(\bdiscord(?:app)?\.com\/api\/webhooks\/\d+\/)[\w-]+/gi
          replaceExpr: "`${g1}[REDACTED]`"
        - matchRegex: /([?&](?:sig|signature|X-Amz-Signature|X-Goog-Signature|access_token|token)=)[^\s&"']{16,}/gi
          replaceExpr: "`${g1}[REDACTED]`"
        - matchRegex: /((?:password|passwd|passphrase|secret|token|api[_-]?key|(?:access|account|secret|private|signing|encryption|master)[_-]?key|credentials?|\bauth)["']?\s*[:=]\s*["']?)(?!\[REDACTED|hmac-sha256:|(?:true|false|null|none|nil)\b)[^\s"'&,;]{4,}/gi
          replaceExpr: "`${g1}[REDACTED]`"
    description: >-
      Redact credentials before they are stored: homelab formats gitleaks has no rule
      for (Tailscale and Cloudflare tunnel tokens, Vault unseal keys, Proxmox API
      tokens, Docker Hub and Google OAuth tokens, base64-wrapped JSON and PEM keys (not certificates), passwords in URLs, signed-URL signatures)
      and key/value pairs whose name says secret.
  - id: chain
    filter: "true"
    conf:
      processor: secret_mask
    description: >-
      gitleaks' default rules (pipeline secret_mask, generated by
      scripts/gen-secret-mask.py). Tested by scripts/cribl-test-mask.sh.
asyncFuncTimeout: 1000
output: default
