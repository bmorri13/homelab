inputs:
  CriblLogs:
    type: cribl
    disabled: false
  syslog_infra:
    type: syslog
    host: 0.0.0.0
    udpPort: 9514
    tcpPort: 9514
    description: Proxmox, Unraid, other hosts (host port 514)
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    maxBufferSize: 1000
    ipWhitelistRegex: /.*/
    timestampTimezone: local
    singleMsgUdpPackets: false
    enableProxyHeader: false
    keepFieldsList: []
    octetCounting: false
    inferFraming: true
    strictlyInferOctetCounting: true
    allowNonStandardAppName: false
    maxActiveCxn: 1000
    socketIdleTimeout: 0
    socketEndingMaxWait: 30
    socketMaxLifespan: 0
    enableLoadBalancing: false
    autoParse: false
  syslog_network:
    type: syslog
    host: 0.0.0.0
    udpPort: 9515
    tcpPort: 9515
    description: UniFi gateway (host port 5514)
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    maxBufferSize: 1000
    ipWhitelistRegex: /.*/
    timestampTimezone: local
    singleMsgUdpPackets: false
    enableProxyHeader: false
    keepFieldsList: []
    octetCounting: false
    inferFraming: true
    strictlyInferOctetCounting: true
    allowNonStandardAppName: false
    maxActiveCxn: 1000
    socketIdleTimeout: 0
    socketEndingMaxWait: 30
    socketMaxLifespan: 0
    enableLoadBalancing: false
    autoParse: false
  hec:
    type: splunk_hec
    host: 0.0.0.0
    port: 8088
    splunkHecAPI: /services/collector
    disabled: true
    authTokens: []
    description: OTel collectors. Token set by scripts/cribl-bootstrap.sh
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    maxActiveReq: 256
    maxRequestsPerSocket: 0
    enableProxyHeader: false
    captureHeaders: false
    activityLogSampleRate: 100
    requestTimeout: 0
    socketTimeout: 0
    keepAliveTimeout: 5
    ipAllowlistRegex: /.*/
    ipDenylistRegex: /^$/
    splunkHecAcks: false
    staleChannelFlushMs: 10000
    autoParse: false
    useFwdTimezone: true
    dropControlFields: true
    extractMetrics: false
    emitTokenMetrics: false
