{{- if .Values.enabled }}
---
# Apiary's own keys: oauth2-proxy cookie secret and the CSRF signing key.
# Generated inside Vault at setup (see README), outside kv/apiary/ so Apiary
# itself can't overwrite them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apiary-app
  labels:
    {{- include "apiary.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: apiary-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range list "cookie_secret" "csrf_key" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secrets.appPath }}
        property: {{ . }}
        {{- include "apiary.esDefaults" $ }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apiary-github-oauth
  labels:
    {{- include "apiary.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: apiary-github-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range list "client_id" "client_secret" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secrets.githubOAuthPath }}
        property: {{ . }}
        {{- include "apiary.esDefaults" $ }}
    {{- end }}
---
# Pull secret for the private ghcr.io/bmorri13/apiary image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apiary-ghcr-pull
  labels:
    {{- include "apiary.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: apiary-ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}'
  data:
    {{- range list "username" "token" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secrets.ghcrPullPath }}
        property: {{ . }}
        {{- include "apiary.esDefaults" $ }}
    {{- end }}
{{- end }}
