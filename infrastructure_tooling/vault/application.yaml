# Vault on k3s-01: the upstream chart, standalone, file storage, Shamir unseal
# (one key). Its ingress is ../vault_ingress; External Secrets reads it through
# the kubernetes auth role external-secrets (../eso_cluster_provider_helm).
#
# Created in the Argo CD UI originally; committed so the version is on record.
# There is no app-of-apps and no automated sync, so a change here does nothing
# until it is applied and synced. Even then the Vault pod keeps running: the
# chart's StatefulSet uses updateStrategy OnDelete, so a new Vault version only
# starts when the pod is deleted, and it starts sealed. See README.md.
#
# The agent injector is off: no pod uses it (no vault.hashicorp.com/agent-inject
# annotations); apps and the agents log in to Vault themselves.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      valuesObject:
        injector:
          enabled: false
        server:
          service:
            annotations:
              # Traefik skips endpoints whose pod isn't Ready, and a sealed Vault
              # isn't, so vault.bmosan.com answered 503 exactly when the unseal
              # page was needed. With this it sends to the Service's ClusterIP
              # instead, which still reaches the pod (publishNotReadyAddresses).
              traefik.ingress.kubernetes.io/service.nativelb: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
