# Installed to /var/lib/rancher/k3s/server/manifests/traefik-config.yaml (install.sh).
# k3s applies it over its bundled Traefik chart. Traefik listens on k3s-01's own
# 80 and 443 (host network); there is no Service, since there is no load balancer.
# Holds for chart 27 (Traefik 2.11, k3s 1.31) through chart 40 (k3s 1.33 to 1.36).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    hostNetwork: true
    service:
      enabled: false
    ports:
      web:
        port: 80
        hostPort: 80
        exposedPort: 80
      websecure:
        port: 443
        hostPort: 443
        exposedPort: 443
