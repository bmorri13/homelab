# systemd drop-in for k3s (installed by install.sh as
# /etc/systemd/system/k3s.service.d/10-hardening.conf).
#
# CIS k3s 1.1.20: the server's PKI certificates must be mode 600. k3s writes them
# 644 and rewrites them when it rotates certificates, so the permissions are set
# again every time k3s has started. Only root (k3s itself) reads them.
[Service]
ExecStartPost=-/bin/sh -c 'chmod 600 /var/lib/rancher/k3s/server/tls/*.crt'
