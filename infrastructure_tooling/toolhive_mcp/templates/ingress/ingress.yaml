---
# Tailnet-only entry point for the vMCP gateway.
#
# Traefik on k3s-01 is hostNetwork with hostPorts 80/443 on every node
# interface, including tailscale0 (100.124.194.87). The DNS record for
# {{ .Values.ingress.host }} points at that tailnet address, and the ipAllowList
# middleware below rejects anything not sourced from the tailnet, so the LAN
# path (192.168.4.98 + Host header) gets a 403 even though Traefik listens there.
#
# The certificate is DNS-01 via Cloudflare, so the host never has to be
# reachable from the internet for issuance or renewal.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  labels:
    {{- include "toolhive-mcp.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.ingress.sourceRanges | nindent 6 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmcp-{{ .Values.vmcp.name }}
  labels:
    {{- include "toolhive-mcp.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entrypoints }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-tailnet-only@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Service created by the operator for the VirtualMCPServer.
                name: vmcp-{{ .Values.vmcp.name }}
                port:
                  number: 4483
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
