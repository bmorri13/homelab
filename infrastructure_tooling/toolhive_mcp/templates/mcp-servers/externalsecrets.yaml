{{- /*
Vault-backed credentials for MCP servers. Each entry produces a Secret of the
same name whose keys mirror the Vault properties, for use in an MCPServer's
spec.secrets: [{name: <entry>, key: <property>, targetEnvName: <ENV>}].
*/}}
{{- range $name, $es := .Values.externalSecrets.secrets }}
{{- if ne (toString $es.enabled) "false" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "toolhive-mcp.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
    # ESO defaults spelled out so ArgoCD doesn't report drift on them
    deletionPolicy: Retain
  data:
    {{- range $es.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.vaultPath }}
        property: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end }}
