{{- /*
Vault-backed credentials for MCP servers. Each entry produces a Secret of the
same name whose keys mirror the Vault properties, for use in an MCPServer's
spec.secrets: [{name: <entry>, key: <property>, targetEnvName: <ENV>}]. With
`template`, the Secret holds the templated keys instead.
*/}}
{{- range $name, $es := .Values.externalSecrets.secrets }}
{{- if ne (toString $es.enabled) "false" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "toolhive-mcp.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
    # ESO defaults spelled out so ArgoCD doesn't report drift on them
    deletionPolicy: Retain
    {{- with $es.template }}
    # Derived keys (e.g. a full Authorization header value built from a token).
    # Only these keys end up in the Secret.
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  data:
    {{- $keys := $es.keys | default list }}
    {{- range $es.fields }}{{ $keys = append $keys .key }}{{ end }}
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.vaultPath }}
        property: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end }}
