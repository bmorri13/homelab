{{- /*
Cedar "allowed clients" condition: the token's sub must be one of the
ServiceAccounts listed in auth.clients. Matching the exact list (rather than a
namespace prefix) is what makes removal a revocation: JWKS validation can't see
that a ServiceAccount was deleted, but the next sync drops it from this set and
every token minted for it is denied from then on.
*/}}
{{- $subs := list }}
{{- range .Values.auth.clients }}
{{- $subs = append $subs (printf "system:serviceaccount:%s:%s" $.Values.auth.clientNamespace .) }}
{{- end }}
{{- $allowed := printf "%s.contains(principal.claim_sub)" ($subs | toJson) }}
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: {{ .Values.vmcp.name }}
  labels:
    {{- include "toolhive-mcp.labels" . | nindent 4 }}
spec:
  groupRef:
    name: {{ .Values.group.name }}
  replicas: {{ .Values.vmcp.replicas }}
  serviceType: ClusterIP
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: k3s-serviceaccounts
      audience: {{ .Values.auth.audience }}
      resourceUrl: https://{{ .Values.ingress.host }}/mcp
    authzConfig:
      type: inline
      inline:
        policies:
          # Only the machine ServiceAccounts in auth.clients. Every other
          # identity (including valid tokens from other namespaces or from
          # removed clients) matches no permit and is denied by Cedar's
          # default-deny.
          - |-
            permit(principal, action in [Action::"list_tools", Action::"list_prompts", Action::"list_resources"], resource)
            when { principal has claim_sub && {{ $allowed }} };
          # Read-only tools: annotated by the server, or vouched for in values.
          - |-
            permit(principal, action == Action::"call_tool", resource)
            when { principal has claim_sub && {{ $allowed }} && resource has readOnlyHint && resource.readOnlyHint == true };
          {{- range .Values.authz.readOnlyTools }}
          - |-
            permit(principal, action == Action::"call_tool", resource == Tool::{{ . | quote }})
            when { principal has claim_sub && {{ $allowed }} };
          {{- end }}
          # Tools that change things, allowed on purpose (see authz.writeTools).
          {{- range .Values.authz.writeTools }}
          - |-
            permit(principal, action == Action::"call_tool", resource == Tool::{{ . | quote }})
            when { principal has claim_sub && {{ $allowed }} };
          {{- end }}
          {{- range .Values.authz.extraPolicies }}
          - {{ . | quote }}
          {{- end }}
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            {{- toYaml .Values.vmcp.resources | nindent 12 }}
        # Serves the API server's JWKS on localhost for token validation; see
        # gateway/oidcconfig.yaml for why. Only GET /openid/v1/jwks is proxied.
        - name: jwks-proxy
          image: {{ .Values.auth.jwksProxy.image }}
          args:
            - proxy
            - --address=127.0.0.1
            - --port={{ .Values.auth.jwksProxy.port }}
            - --accept-hosts=^(localhost|127\.0\.0\.1)$
            - --accept-paths=^/openid/v1/jwks$
            - --reject-methods=^(POST|PUT|PATCH|DELETE|CONNECT|OPTIONS)$
          securityContext:
            runAsNonRoot: true
            # Image default user is root.
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.auth.jwksProxy.resources | nindent 12 }}
  config:
    {{- with .Values.vmcp.audit }}
    audit:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    aggregation:
      conflictResolution: {{ .Values.vmcp.conflictResolution }}
      conflictResolutionConfig:
        prefixFormat: {{ .Values.vmcp.prefixFormat | quote }}
    {{- if .Values.vmcp.debugLogging }}
    operational:
      logLevel: debug
    {{- end }}
