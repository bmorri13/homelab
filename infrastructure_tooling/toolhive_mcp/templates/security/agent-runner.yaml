{{- /*
The agent runner's identity (infrastructure_tooling/homelab_agents). coding-box
holds a long-lived token for this ServiceAccount and nothing else. With it the
runner can only create tokens for the agent ServiceAccounts (a fresh 1-hour
gateway token every run) and for itself (a short-lived Vault login token). No
other API access; it is not listed in any Cedar policy.

The Splunk detection "HL - Kubernetes service account token minted" excludes
exactly these mints (this user, this namespace, these names).
*/}}
{{- with .Values.auth.agentRunner }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $.Values.auth.clientNamespace }}
  labels:
    {{- include "toolhive-mcp.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ . }}-mint
  namespace: {{ $.Values.auth.clientNamespace }}
  labels:
    {{- include "toolhive-mcp.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames:
      {{- range keys $.Values.auth.agents | sortAlpha }}
      - {{ . }}
      {{- end }}
      - {{ . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ . }}-mint
  namespace: {{ $.Values.auth.clientNamespace }}
  labels:
    {{- include "toolhive-mcp.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ . }}-mint
subjects:
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Values.auth.clientNamespace }}
{{- end }}
