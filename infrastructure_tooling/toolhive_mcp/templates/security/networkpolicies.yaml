{{- if .Values.networkPolicy.enabled }}
---
# Default deny for every pod in the namespace, both directions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    {{- include "toolhive-mcp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Pods in this namespace may talk to each other (vMCP -> proxy runner ->
# MCP server) and resolve DNS. Nothing outside the namespace can reach the
# unauthenticated proxy runners.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-and-dns
  labels:
    {{- include "toolhive-mcp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Kubernetes API access (JWKS for token validation, MCPGroup/backend
# discovery, proxy runner managing its MCP server pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  labels:
    {{- include "toolhive-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- toYaml .Values.networkPolicy.apiServerPodLabels | nindent 10 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.apiServer.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.apiServer.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- with .Values.networkPolicy.healthCheckFromNamespaces }}
---
# Health probes from monitoring namespaces to the vMCP only.
#
# Traefik needs no rule here: it is hostNetwork, and kube-router always admits
# traffic sourced from the pod's own node, so on this single-node cluster the
# ingress path to the vMCP is "from the node" rather than a selectable peer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  labels:
    {{- include "toolhive-mcp.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: virtualmcpserver
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 4483}
{{- end }}
{{- range $name, $server := .Values.mcpServers }}
{{- if and $server.enabled $server.egress }}
---
# Egress for MCP server {{ $name }}: only the destinations listed under
# mcpServers.{{ $name }}.egress. Applies to both its proxy runner and server pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-{{ $name }}
  labels:
    {{- include "toolhive-mcp.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      toolhive-name: {{ $name }}
  policyTypes: [Egress]
  egress:
    {{- range $server.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
